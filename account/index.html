body{min-height:100vh;background:var(--glow),radial-gradient(800px 520px at 0% 100%,var(--accent-soft) 0%,transparent 70%),var(--bg);background-attachment:fixed}

details.menu{display:none}

@media (max-width:560px){#menuLbl,#langCur{display:none}.ac-tools{gap:8px}}
.ac-theme{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.ac-theme .ic{width:19px;height:19px}
details.lang li button{all:unset;display:block;box-sizing:border-box;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;cursor:pointer}
details.lang li button:hover,details.lang li button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.ac{max-width:760px;margin:0 auto;padding:32px 20px 56px;display:grid;gap:18px}
.ac-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}
.ac h1{margin:0 0 8px;font-size:30px;line-height:1.15}
.ac h2{margin:0 0 10px;font-size:19px}
.ac-t{margin:0;color:var(--sub);line-height:1.55}
/* Вход: карточка уже и по центру, поля и кнопки — во всю её ширину (21.11.2026, Андрей). */
.ac-in{display:grid;gap:10px;margin-top:18px}
#vIn{width:100%;max-width:520px;justify-self:center}
.ac-btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;text-decoration:none}
.ac-btn.b2{background:var(--accent-soft);color:var(--accent)}
.ac-btn:disabled{opacity:.6;cursor:default}
.ac-f{font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ac-s{margin:0;color:var(--sub);font-size:14px}
.ac-e{color:var(--accent);font-weight:600;margin:0}
.ac-me{display:flex;align-items:center;gap:18px}
.ac-av{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:32px;font-weight:800;position:relative;overflow:hidden}
.ac-av.plus{background:linear-gradient(135deg,#f6d36b,#d79b20 55%,#f8e3a0);color:#5a3c00;box-shadow:0 0 0 3px #e9b949,0 0 26px rgba(233,185,73,.6)}
.ac-av.plus::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%);animation:acShine 3.2s ease-in-out infinite}
@keyframes acShine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@media (prefers-reduced-motion:reduce){.ac-av.plus::after{animation:none;opacity:0}}
.ac-nick{margin:0;font-size:24px;font-weight:800}
.ac-plan{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.ac-plan.plus{background:linear-gradient(135deg,#f6d36b,#e9b949);color:#5a3c00}
/* Плитки чисел (21.11.2026, план Андрея: число никогда не выходит за плитку): равны, пока числа помещаются; длинному
   числу его плитка шире ровно настолько, насколько ему нужно; не помещается строка — плитки переходят на следующую. */
.ac-tiles{display:flex;flex-wrap:wrap;gap:12px}
.ac-tile{flex:1 1 0;min-width:min-content;background:var(--bg);border-radius:18px;padding:16px}
.ac-tile b{display:block;font-size:28px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ac-tile span{color:var(--sub);font-weight:600;font-size:14px}
.ac-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.ac-list li{background:var(--bg);border-radius:14px;padding:12px 14px;font-weight:600}
.ac-list li span{display:block;color:var(--sub);font-weight:500;font-size:13px;margin-top:2px}
.ac-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
@media (max-width:520px){.ac-tile{padding:12px}.ac-tile b{font-size:22px}.ac-card{padding:20px}}
.ac-btn.del{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

.ac-quiet button{appearance:none;background:none;border:0;padding:4px 0;cursor:pointer;font:inherit;font-size:13.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--sub) 45%,transparent)}
.ac-quiet button:hover{color:var(--ink)}

[hidden]{display:none!important}

    "pcX": {"ru": "Страница находит страны, города и маршрут поездок по фото и видео с телефонов и камер, которые хранятся на компьютере или флешке, и сохраняет итог в этой учётной записи.", "en": "The page finds the countries, cities and route of your trips from photos and videos taken with phones and cameras and kept on your computer or a flash drive, and saves the result in this account.", "cs": "Stránka najde země, města a trasu vašich cest podle fotek a videí z telefonů a fotoaparátů uložených v počítači nebo na flash disku a uloží výsledek do tohoto účtu.", "de": "Die Seite findet die Länder, Städte und die Route Ihrer Reisen anhand von Fotos und Videos von Telefonen und Kameras, die auf Ihrem Computer oder einem USB-Stick liegen, und speichert das Ergebnis in diesem Konto.", "fr": "La page retrouve les pays, les villes et l’itinéraire de vos voyages à partir des photos et vidéos de téléphones et d’appareils photo conservées sur votre ordinateur ou une clé USB, et enregistre le résultat dans ce compte.", "es": "La página encuentra los países, las ciudades y la ruta de tus viajes a partir de las fotos y vídeos de teléfonos y cámaras guardados en el ordenador o en una memoria USB, y guarda el resultado en esta cuenta.", "it": "La pagina trova i paesi, le città e il percorso dei Suoi viaggi dalle foto e dai video di telefoni e fotocamere conservati sul computer o su una chiavetta USB e salva il risultato in questo account.", "pt": "A página encontra os países, as cidades e o trajeto das suas viagens pelas fotos e vídeos de celulares e câmeras guardados no computador ou em um pen drive e salva o resultado nesta conta.", "ja": "パソコンやUSBメモリに保存されたスマートフォンやカメラの写真と動画から、旅行した国、都市、ルートを見つけ、このアカウントに結果を保存します。", "ko": "컴퓨터나 USB 메모리에 저장된 휴대폰과 카메라의 사진과 동영상으로 여행한 국가, 도시, 경로를 찾아 이 계정에 결과를 저장합니다."},

    "delH": {"en": "Delete account", "ru": "Удаление учётной записи", "cs": "Smazání účtu", "de": "Konto löschen", "fr": "Suppression du compte", "es": "Eliminar la cuenta", "it": "Eliminazione dell’account", "pt": "Excluir a conta", "ja": "アカウントの削除", "ko": "계정 삭제"},
    "delX": {"ru": "Учётная запись закроется сразу, а через 30 дней будет удалена со всеми данными: коллекцией, маршрутом, монетами и устройствами. Если передумаете, войдите в неё в течение 30 дней — удаление отменится.", "en": "Your account will be closed at once and deleted after 30 days with all its data: collection, route, coins and devices. If you change your mind, sign in within 30 days and the deletion will be cancelled.", "cs": "Účet se hned uzavře a za 30 dní bude smazán se všemi daty: sbírkou, trasou, mincemi a zařízeními. Pokud si to rozmyslíte, přihlaste se do 30 dní a smazání se zruší.", "de": "Das Konto wird sofort geschlossen und nach 30 Tagen mit allen Daten gelöscht: Sammlung, Route, Münzen und Geräte. Wenn Sie es sich anders überlegen, melden Sie sich innerhalb von 30 Tagen an — dann wird das Löschen abgebrochen.", "fr": "Votre compte sera fermé immédiatement, puis supprimé au bout de 30 jours avec toutes ses données : collection, itinéraire, pièces et appareils. Si vous changez d’avis, connectez-vous dans les 30 jours et la suppression sera annulée.", "es": "Tu cuenta se cerrará de inmediato y se eliminará a los 30 días con todos sus datos: colección, ruta, monedas y dispositivos. Si cambias de opinión, inicia sesión en los próximos 30 días y la eliminación se cancelará.", "it": "L’account verrà chiuso subito ed eliminato dopo 30 giorni con tutti i dati: collezione, percorso, monete e dispositivi. Se cambia idea, acceda entro 30 giorni e l’eliminazione verrà annullata.", "pt": "Sua conta será fechada na hora e excluída em 30 dias com todos os dados: coleção, rota, moedas e dispositivos. Se mudar de ideia, entre na conta dentro de 30 dias e a exclusão será cancelada.", "ja": "アカウントはすぐに閉じられ、30日後にコレクション、ルート、コイン、デバイスを含むすべてのデータとともに削除されます。気が変わったら、30日以内にログインすれば削除は取り消されます。", "ko": "계정은 즉시 닫히고 30일 후 컬렉션, 경로, 코인, 기기 등 모든 데이터와 함께 삭제됩니다. 마음이 바뀌면 30일 안에 로그인하세요. 삭제가 취소됩니다."},
    "delOut": {"en": "To delete your account, first sign in above with that account. You can also delete it in the app settings.", "ru": "Чтобы удалить учётную запись, сначала войдите в неё выше. Удалить её можно и в настройках приложения.", "cs": "Chcete-li účet smazat, nejprve se do něj výše přihlaste. Smazat ho můžete i v nastavení aplikace.", "de": "Um Ihr Konto zu löschen, melden Sie sich oben zuerst mit diesem Konto an. Sie können es auch in den App-Einstellungen löschen.", "fr": "Pour supprimer votre compte, connectez-vous d’abord ci-dessus avec ce compte. Vous pouvez aussi le supprimer dans les réglages de l’application.", "es": "Para eliminar tu cuenta, primero inicia sesión arriba con ella. También puedes eliminarla en los ajustes de la aplicación.", "it": "Per eliminare l’account, acceda prima qui sopra con quell’account. Può eliminarlo anche nelle impostazioni dell’app.", "pt": "Para excluir sua conta, primeiro entre nela acima. Você também pode excluí-la nas configurações do aplicativo.", "ja": "アカウントを削除するには、まず上でそのアカウントにログインしてください。アプリの設定から削除することもできます。", "ko": "계정을 삭제하려면 먼저 위에서 그 계정으로 로그인하세요. 앱 설정에서도 삭제할 수 있습니다."},
