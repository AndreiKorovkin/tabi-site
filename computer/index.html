<style>
body{min-height:100vh;background:var(--glow),radial-gradient(800px 520px at 0% 100%,var(--accent-soft) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.pc-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.pc-theme{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.pc-theme .ic{width:19px;height:19px}
details.lang li button{all:unset;display:block;box-sizing:border-box;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;cursor:pointer}
details.lang li button:hover,details.lang li button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.pc{max-width:1320px;margin:0 auto;padding:28px 20px 56px}
.pc-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:20px;align-items:start;transition:grid-template-columns .4s ease}
.pc-grid.idle{grid-template-columns:minmax(0,600px);justify-content:center}
.pc-grid.idle .pc-side{display:none}
.pc-card{background:var(--panel);border-radius:24px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-main{display:grid;gap:16px}
.pc-main h1{font-size:clamp(26px,2.6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0}
.pc-main h2{font-size:20px;margin:0;letter-spacing:-.01em}
.pc-lead{color:var(--sub);margin:0}
.pc-side{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;display:grid;gap:12px;align-content:start}
/* Полосы прокрутки боковых списков — в цветах сайта (18.11.2026, Андрей: белые полосы выглядели чужими). */
.pc-side{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc-side::-webkit-scrollbar{width:8px}
.pc-side::-webkit-scrollbar-track{background:transparent;margin:18px 0}
.pc-side::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid var(--panel)}
.pc-side::-webkit-scrollbar-thumb:hover{background:var(--sub)}
.pc-side h2,.pc-route h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.pc-count{color:var(--sub);font-weight:700;margin-left:6px}
.pc-btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%;text-align:center;text-decoration:none;display:block;box-sizing:border-box}
.pc-btn.b2{background:var(--bg2);color:var(--ink)}
.pc-btn.go{background:var(--go);color:var(--on-go)}
.pc-btn:disabled{opacity:.55;cursor:default}
.pc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc-in{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.pc-s{color:var(--sub);font-size:14px;line-height:1.45;margin:0}
.pc-t{color:var(--ink);font-size:15.5px;line-height:1.5;margin:0}
.pc-e{color:var(--accent);font-size:14.5px;line-height:1.45;font-weight:600}
.pc-chk{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink);cursor:pointer}
.pc-chk input{width:18px;height:18px;accent-color:var(--accent)}
.pc-box{display:grid;gap:10px;padding:18px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.pc-devs{display:grid;gap:12px}
.pc-dev{display:grid;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.pc-dev:first-child{padding-top:0;border-top:0}
.pc-dev .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pc-dev .nm{font-weight:700;overflow-wrap:anywhere}
.pc-dev .n{color:var(--sub);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-dev .ln{color:var(--sub);font-size:14px;line-height:1.4}
.pc-drop{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--sub);font-size:14px}
.pc-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden}.pc-bar>div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.pc-bar.wait>div{width:30%!important;animation:pcWait 1.4s ease-in-out infinite}
@keyframes pcWait{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
/* Строка хода не дёргается: цифры одной ширины (18.11.2026, Андрей). */
#prog,#eta{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-why summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14.5px;list-style:none}
.pc-why summary::-webkit-details-marker{display:none}
.pc-why summary::after{content:" ›";color:var(--sub)}
.pc-why[open] summary::after{content:" ⌄"}
.pc-why ul{margin:8px 0 0;padding:0 0 0 18px;display:grid;gap:6px;font-size:14px;color:var(--sub);line-height:1.45}
.pc-why li b{color:var(--ink);font-weight:650}
.pc-when{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;min-height:1.1em}
.pc-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pc-stat{background:var(--bg);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.pc-stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.pc-stat span{font-size:12.5px;color:var(--sub);line-height:1.25;display:block}
.pc-list{display:grid;gap:8px}
.pc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both}
.pc-item img{width:34px;height:24px;object-fit:cover;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pc-item .nm{font-weight:700;line-height:1.25}
.pc-item .dt{color:var(--sub);font-size:12.5px}
.pc-regs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pc-regs span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;animation:pcIn .45s ease both}
.pc-city{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both;min-width:0}
.pc-city .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.pc-city .cc{color:var(--sub);font-size:12.5px;white-space:nowrap;flex:none}
.pc-route{margin-top:20px;display:grid;gap:12px}
.pc-map{position:relative;border-radius:16px;overflow:hidden;background:var(--bg)}
.pc-map canvas{width:100%;height:clamp(420px,62vh,720px);display:block;touch-action:none;cursor:grab}
.pc-map canvas.drag{cursor:grabbing}
.pc-zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.pc-zoom button{appearance:none;border:1px solid var(--line);width:38px;height:38px;border-radius:12px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:21px;font-weight:700;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.pc-link{color:var(--accent);font-weight:700;font-size:15px;text-decoration:none}.pc-link:hover{text-decoration:underline}
.pc-zoom button svg{width:18px;height:18px}
.pc-tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.pc-tip b{display:block;font-weight:700}
.pc-legend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pc-legend i{flex:1;max-width:320px;height:8px;border-radius:999px}
.pc-foot{max-width:1320px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px}
.pc-foot a{color:var(--sub);font-weight:600;text-decoration:none}.pc-foot a:hover{color:var(--ink)}
.pc-over{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);font-size:24px;font-weight:800;color:var(--accent);pointer-events:none}
@keyframes pcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pc-item,.pc-city,.pc-regs span{animation:none}}
@media (max-width:1100px){.pc-grid{grid-template-columns:minmax(0,1fr)}.pc-grid.idle{grid-template-columns:minmax(0,600px)}.pc-side{position:static;max-height:none}.pc-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.pc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pc-map canvas{height:340px}.pc-row{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style></head>
<body>
<header class="top"><div class="wrap">
<a class="wordmark" href="/" id="homeLink" aria-label="Tabi">Tabi</a>
<div class="pc-tools">
<a data-tabi-acc id="accChip" href="/account/"></a>
<details class="lang" id="langBox"><summary><span class="sr" id="langLbl"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span id="langCur"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><ul id="langList"></ul></details>
<button class="pc-theme" id="themeBtn" type="button"></button>
</div>
</div></header>

<main class="pc">
<div class="pc-grid idle" id="grid">
  <aside class="pc-card pc-side" id="left" aria-live="polite">
    <h2><span id="hCountries"></span><span class="pc-count" id="nCountries"></span></h2>
    <div class="pc-list" id="countries"></div>
  </aside>

  <section class="pc-card pc-main">
    <h1 id="title"></h1>
    <p class="pc-lead" id="lead"></p>
    <!-- Телефон: страница разбирает медиафайлы компьютера -->
    <div id="vPhone" hidden class="pc-box">
      <h2 id="phoneT"></h2>
      <p class="pc-t" id="phoneX"></p>
      <a class="pc-btn go" id="bPlay" rel="noopener"></a>
      <button class="pc-btn b2" id="bCopy" type="button"></button>
    </div>
    <!-- Выбор файлов -->
    <div id="vPick" hidden style="display:grid;gap:10px">
      <div class="pc-row"><button class="pc-btn" id="bFolder"></button><button class="pc-btn b2" id="bFiles"></button></div>
      <div class="pc-drop" id="drop"></div>
      <p class="pc-s" id="whole"></p>
      <p class="pc-s" id="keepHint"></p>
      <p class="pc-s" id="anonNote"></p>
      <a href="#" class="pc-link" id="bView"></a>
      <input type="file" id="fFolder" webkitdirectory multiple hidden>
      <input type="file" id="fFiles" multiple accept="image/*,video/*,.heic,.heif,.mov,.mp4,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.json,.gpx,.kml,.tcx,.geojson" hidden>
    </div>
    <!-- Чтение и разбор -->
    <div id="vWork" hidden style="display:grid;gap:12px">
      <div class="pc-when" id="when" aria-live="polite"></div>
      <div id="prog" class="pc-s"></div>
      <div class="pc-bar" id="bar"><div id="barIn"></div></div>
      <div id="eta" class="pc-s" hidden></div>
      <p class="pc-s" id="slow" hidden></p>
      <p class="pc-s" id="sysX" hidden></p>
    </div>
    <div class="pc-stats" id="stats" hidden></div>
    <!-- Итог -->
    <div id="vDone" hidden style="display:grid;gap:12px">
      <p class="pc-t" id="done" hidden></p>
      <p class="pc-t" id="runX" hidden></p>
      <details class="pc-why" id="why" hidden><summary id="whyS"></summary><ul id="whyL"></ul></details>
      <p class="pc-s" id="sideX" hidden></p>
      <p class="pc-s" id="restored" hidden><span id="restoredX"></span> <a href="#" class="pc-link" id="bClear"></a></p>
      <div class="pc-row"><button class="pc-btn b2" id="bMore"></button><button class="pc-btn b2" id="bMoreF"></button></div>
    </div>
    <!-- Устройства: с каких устройств что пришло и через какой компьютер (19.11.2026) -->
    <div id="devBox" hidden class="pc-box">
      <h2 id="hDevs"></h2>
      <p class="pc-s" id="devMerge"></p>
      <div class="pc-devs" id="devList"></div>
    </div>
    <!-- Сохранение итога: вход после разбора -->
    <div id="vSave" hidden class="pc-box">
      <h2 id="saveT"></h2>
      <p class="pc-t" id="saveX"></p>
      <div id="inBox" style="display:grid;gap:10px">
        <button class="pc-btn" id="bGoogle"></button>
        <p class="pc-s" id="orMail"></p>
        <input class="pc-in" id="mail" type="email" autocomplete="email">
        <button class="pc-btn b2" id="bCode"></button>
        <input class="pc-in" id="code" inputmode="numeric" autocomplete="one-time-code" hidden>
        <button class="pc-btn" id="bVerify" hidden></button>
      </div>
      <p class="pc-s" id="who" hidden></p>
      <label class="pc-chk" id="newsBox"><input type="checkbox" id="news"><span id="newsL"></span></label>
      <p class="pc-s" id="devNote"></p>
    </div>
    <div id="vSaved" hidden class="pc-box">
      <p class="pc-t" id="savedX"></p>
      <p class="pc-t" id="mailedX" hidden></p>
      <p class="pc-t" id="specialX" hidden style="font-weight:700"></p>
      <a class="pc-btn go" id="bPlay2" rel="noopener"></a>
      <button class="pc-btn" id="bRetry" hidden></button>
    </div>
    <div class="pc-e" id="err" hidden></div>
    <p class="pc-s" id="placesNote" hidden></p>
    <p class="pc-s" id="privacyNote"></p>
  </section>

  <aside class="pc-card pc-side" id="right" aria-live="polite">
    <h2><span id="hCities"></span><span class="pc-count" id="nCities"></span></h2>
    <div class="pc-list" id="cities"></div>
  </aside>
</div>

<section class="pc-card pc-route" id="routeBox" hidden>
  <h2 id="hRoute"></h2>
  <div class="pc-map" id="mapBox">
    <canvas id="map"></canvas>
    <div class="pc-zoom">
      <button type="button" id="zIn">+</button>
      <button type="button" id="zOut">−</button>
      <button type="button" id="zAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="pc-tip" id="tip" hidden></div>
  </div>
  <div class="pc-legend" id="legend" hidden><span id="lgA"></span><i id="lgBar"></i><span id="lgB"></span></div>
  <p class="pc-s" id="mapHint"></p>
</section>
</main>
<footer class="pc-foot"><a href="/" id="fHome"></a><a href="/privacy.html" id="pol"></a><span id="credits"></span></footer>
<div class="pc-over" id="over" hidden></div>

    "eNet": {"en": "No connection to Tabi. Check the internet and try again.", "ru": "Нет связи с Tabi. Проверьте интернет и попробуйте ещё раз.", "cs": "Spojení s Tabi chybí. Zkontrolujte internet a zkuste to znovu.", "de": "Keine Verbindung zu Tabi. Prüfen Sie das Internet und versuchen Sie es erneut.", "fr": "Pas de connexion à Tabi. Vérifiez internet et réessayez.", "es": "No hay conexión con Tabi. Comprueba internet y vuelve a intentarlo.", "it": "Nessuna connessione con Tabi. Controlli la connessione a Internet e riprovi.", "pt": "Sem conexão com o Tabi. Verifique a internet e tente novamente.", "ja": "Tabiに接続できません。インターネットを確認して、もう一度お試しください。", "ko": "Tabi에 연결할 수 없습니다. 인터넷 연결을 확인하고 다시 시도하세요."},

    "drop": {"en": "Or drag folders and files here — several at once.", "ru": "Или перетащите сюда папки и файлы — можно несколько сразу.", "cs": "Nebo sem přetáhněte složky a soubory — i několik najednou.", "de": "Oder ziehen Sie Ordner und Dateien hierher – auch mehrere auf einmal.", "fr": "Ou faites glisser ici des dossiers et des fichiers, même plusieurs à la fois.", "es": "O arrastra aquí carpetas y archivos, también varios a la vez.", "it": "Oppure trascini qui cartelle e file, anche più di uno alla volta.", "pt": "Ou arraste pastas e arquivos para cá — vários de uma vez.", "ja": "またはフォルダやファイルをここにドラッグしてください。複数まとめてでもかまいません。", "ko": "또는 폴더와 파일을 여기로 끌어다 놓으세요. 여러 개를 한 번에 놓을 수도 있습니다."},
    "dropHere": {"en": "Drop to add", "ru": "Отпустите, чтобы добавить", "cs": "Pusťte a soubory se přidají", "de": "Loslassen zum Hinzufügen", "fr": "Relâchez pour ajouter", "es": "Suelta para añadir", "it": "Rilasci per aggiungere", "pt": "Solte para adicionar", "ja": "ドロップして追加", "ko": "놓아서 추가"},
    "whole": {"ru": "Выбирайте папки с фотографиями и видео, а не весь диск: список всех файлов диска браузер собирает очень долго. Папки можно добавлять по очереди — найденное складывается.", "en": "Choose folders with photos and videos rather than the whole drive: the browser takes a very long time to list every file on a drive. You can add folders one after another — the results add up.", "cs": "Vybírejte složky s fotkami a videi, ne celý disk: seznam všech souborů disku prohlížeč sestavuje velmi dlouho. Složky můžete přidávat postupně — nálezy se sčítají.", "de": "Wählen Sie Ordner mit Fotos und Videos statt des ganzen Laufwerks: Die Liste aller Dateien eines Laufwerks erstellt der Browser sehr lange. Ordner lassen sich nacheinander hinzufügen — die Ergebnisse summieren sich.", "fr": "Choisissez des dossiers de photos et de vidéos plutôt que le disque entier : le navigateur met très longtemps à lister tous les fichiers d’un disque. Vous pouvez ajouter les dossiers l’un après l’autre — les résultats s’additionnent.", "es": "Elija carpetas con fotos y vídeos en lugar de todo el disco: el navegador tarda mucho en listar todos los archivos de un disco. Puede añadir carpetas una tras otra: los resultados se suman.", "it": "Scelga cartelle con foto e video invece dell’intero disco: il browser impiega molto tempo a elencare tutti i file di un disco. Può aggiungere le cartelle una dopo l’altra: i risultati si sommano.", "pt": "Escolha pastas com fotos e vídeos em vez do disco inteiro: o navegador demora muito para listar todos os arquivos de um disco. Você pode adicionar pastas uma após a outra — os resultados se somam.", "ja": "ドライブ全体ではなく、写真と動画のフォルダーを選んでください。ドライブ全体のファイル一覧の作成には、ブラウザーが非常に長い時間をかけます。フォルダーは順に追加でき、結果は合算されます。", "ko": "드라이브 전체가 아니라 사진과 동영상 폴더를 선택하세요. 브라우저가 드라이브의 모든 파일 목록을 만드는 데 매우 오래 걸립니다. 폴더는 차례로 추가할 수 있으며 결과는 합산됩니다."},

    "lead": {"en": "Old trips are often kept on a computer. Choose a folder with photos and videos — Tabi will restore countries, cities and the route from them. No account is needed for this.", "ru": "Старые поездки часто хранятся на компьютере. Выберите папку с фотографиями и видео — Tabi восстановит по ним страны, города и маршрут. Учётная запись для этого не нужна.", "cs": "Staré cesty bývají uložené v počítači. Vyberte složku s fotkami a videi — Tabi z nich obnoví země, města a trasu. Účet k tomu není potřeba.", "de": "Alte Reisen liegen oft auf dem Computer. Wählen Sie einen Ordner mit Fotos und Videos — Tabi stellt daraus Länder, Städte und die Route wieder her. Ein Konto ist dafür nicht nötig.", "fr": "Les anciens voyages sont souvent gardés sur l’ordinateur. Choisissez un dossier de photos et de vidéos : Tabi en retrouvera les pays, les villes et l’itinéraire. Aucun compte n’est nécessaire.", "es": "Los viajes antiguos suelen guardarse en el ordenador. Elige una carpeta con fotos y vídeos: Tabi recuperará con ellos países, ciudades y la ruta. No necesitas una cuenta para ello.", "it": "I viaggi passati sono spesso conservati sul computer. Scelga una cartella con foto e video: Tabi ne ricaverà paesi, città e percorso. Non serve un account.", "pt": "Viagens antigas costumam ficar guardadas no computador. Escolha uma pasta com fotos e vídeos — o Tabi restaurará a partir deles os países, as cidades e o trajeto. Não é preciso ter uma conta.", "ja": "昔の旅はパソコンに保存されていることがよくあります。写真と動画のフォルダを選んでください。Tabiが国、都市、ルートを復元します。アカウントは必要ありません。", "ko": "지난 여행은 컴퓨터에 보관되어 있는 경우가 많습니다. 사진과 동영상이 있는 폴더를 선택하세요. Tabi가 이를 바탕으로 국가, 도시와 경로를 복원합니다. 계정은 필요하지 않습니다."},
    "orMail": {"en": "Or with a code sent to your email:", "ru": "Или по коду на почту:", "cs": "Nebo kódem zaslaným na e-mail:", "de": "Oder mit einem Code per E-Mail:", "fr": "Ou avec un code envoyé par e-mail :", "es": "O con un código enviado a tu correo:", "it": "Oppure con un codice inviato via e-mail:", "pt": "Ou com um código enviado ao seu e-mail:", "ja": "またはメールに届くコードで：", "ko": "또는 이메일로 받은 코드로:"},
    "saving": {"en": "Saving the result…", "ru": "Сохраняем итог…", "cs": "Ukládáme výsledek…", "de": "Das Ergebnis wird gespeichert …", "fr": "Enregistrement du résultat…", "es": "Guardando el resultado…", "it": "Salvataggio del risultato…", "pt": "Salvando o resultado…", "ja": "結果を保存しています…", "ko": "결과를 저장하는 중…"},
    "saved": {"en": "The result is saved in your Tabi account: {n} points. Sign in to the Tabi app with the same address — it will check them and add the trips to your collection.", "ru": "Итог сохранён в вашей учётной записи Tabi: точек — {n}. Войдите в приложение Tabi с этим же адресом — оно проверит их и добавит поездки в вашу коллекцию.", "cs": "Výsledek je uložen ve vašem účtu Tabi: bodů — {n}. Přihlaste se do aplikace Tabi se stejnou adresou — body zkontroluje a přidá cesty do vaší sbírky.", "de": "Das Ergebnis ist in Ihrem Tabi-Konto gespeichert: {n} Punkte. Melden Sie sich in der Tabi-App mit derselben Adresse an — sie prüft die Punkte und fügt die Reisen Ihrer Sammlung hinzu.", "fr": "Le résultat est enregistré dans votre compte Tabi : {n} points. Connectez-vous à l’application Tabi avec la même adresse : elle vérifiera les points et ajoutera les voyages à votre collection.", "es": "El resultado está guardado en tu cuenta de Tabi: {n} puntos. Inicia sesión en la aplicación Tabi con la misma dirección: comprobará los puntos y añadirá los viajes a tu colección.", "it": "Il risultato è salvato nel Suo account Tabi: {n} punti. Acceda all’app Tabi con lo stesso indirizzo: verificherà i punti e aggiungerà i viaggi alla Sua collezione.", "pt": "O resultado está salvo na sua conta do Tabi: {n} pontos. Entre no aplicativo Tabi com o mesmo endereço — ele vai verificar os pontos e adicionar as viagens à sua coleção.", "ja": "結果をTabiのアカウントに保存しました：地点 {n}。同じアドレスでTabiアプリにログインすると、地点を確認して旅をコレクションに追加します。", "ko": "결과를 Tabi 계정에 저장했습니다: 지점 {n}개. 같은 주소로 Tabi 앱에 로그인하면 지점을 확인하고 여행을 컬렉션에 추가합니다."},
    "savedNone": {"en": "This result is already saved in your Tabi account.", "ru": "Этот итог уже сохранён в вашей учётной записи Tabi.", "cs": "Tento výsledek už je ve vašem účtu Tabi uložen.", "de": "Dieses Ergebnis ist bereits in Ihrem Tabi-Konto gespeichert.", "fr": "Ce résultat est déjà enregistré dans votre compte Tabi.", "es": "Este resultado ya está guardado en tu cuenta de Tabi.", "it": "Questo risultato è già salvato nel Suo account Tabi.", "pt": "Este resultado já está salvo na sua conta do Tabi.", "ja": "この結果はすでにTabiのアカウントに保存されています。", "ko": "이 결과는 이미 Tabi 계정에 저장되어 있습니다."},
    "mailed": {"en": "We have sent the result and the picture of your route to {m}.", "ru": "Итог и картинка маршрута отправлены на {m}.", "cs": "Výsledek a obrázek trasy jsme poslali na {m}.", "de": "Wir haben das Ergebnis und das Bild Ihrer Route an {m} gesendet.", "fr": "Nous avons envoyé le résultat et l’image de votre itinéraire à {m}.", "es": "Hemos enviado el resultado y la imagen de tu ruta a {m}.", "it": "Abbiamo inviato il risultato e l’immagine del Suo percorso a {m}.", "pt": "Enviamos o resultado e a imagem do seu trajeto para {m}.", "ja": "結果とルートの画像を{m}に送信しました。", "ko": "결과와 경로 이미지를 {m}(으)로 보냈습니다."},
    "special": {"en": "Special places of Tabi where your photos were taken: {n}. The app will show which ones.", "ru": "Особых мест Tabi, где сделаны ваши снимки: {n}. Какие это места, покажет приложение.", "cs": "Výjimečná místa Tabi, kde vznikly vaše snímky: {n}. Která to jsou, ukáže aplikace.", "de": "Besondere Orte von Tabi, an denen Ihre Fotos entstanden sind: {n}. Welche das sind, zeigt die App.", "fr": "Lieux d’exception de Tabi où vos photos ont été prises : {n}. L’application vous montrera lesquels.", "es": "Lugares especiales de Tabi donde se tomaron tus fotos: {n}. La aplicación te mostrará cuáles.", "it": "Luoghi speciali di Tabi in cui sono state scattate le Sue foto: {n}. Quali siano, lo mostrerà l’app.", "pt": "Lugares especiais do Tabi onde suas fotos foram tiradas: {n}. O aplicativo mostrará quais são.", "ja": "写真を撮ったTabiの特別な場所：{n}か所。どの場所かはアプリでわかります。", "ko": "사진을 찍은 Tabi의 특별한 장소: {n}곳. 어떤 장소인지는 앱에서 볼 수 있습니다."},
    "specialMin": {"en": "Special places of Tabi where your photos were taken: at least {n}. The app will show which ones.", "ru": "Особых мест Tabi, где сделаны ваши снимки: не меньше {n}. Какие это места, покажет приложение.", "cs": "Výjimečná místa Tabi, kde vznikly vaše snímky: nejméně {n}. Která to jsou, ukáže aplikace.", "de": "Besondere Orte von Tabi, an denen Ihre Fotos entstanden sind: mindestens {n}. Welche das sind, zeigt die App.", "fr": "Lieux d’exception de Tabi où vos photos ont été prises : au moins {n}. L’application vous montrera lesquels.", "es": "Lugares especiales de Tabi donde se tomaron tus fotos: al menos {n}. La aplicación te mostrará cuáles.", "it": "Luoghi speciali di Tabi in cui sono state scattate le Sue foto: almeno {n}. Quali siano, lo mostrerà l’app.", "pt": "Lugares especiais do Tabi onde suas fotos foram tiradas: pelo menos {n}. O aplicativo mostrará quais são.", "ja": "写真を撮ったTabiの特別な場所：少なくとも{n}か所。どの場所かはアプリでわかります。", "ko": "사진을 찍은 Tabi의 특별한 장소: 최소 {n}곳. 어떤 장소인지는 앱에서 볼 수 있습니다."},

    "saveT": {"en": "Save the result", "ru": "Сохраните итог", "cs": "Uložte si výsledek", "de": "Ergebnis speichern", "fr": "Enregistrez le résultat", "es": "Guarda el resultado", "it": "Salvi il risultato", "pt": "Salve o resultado", "ja": "結果を保存", "ko": "결과 저장"},
    "saveX": {"en": "We will save what was found in your Tabi account and email you the result with a picture of your route. In the Tabi app it becomes your collection.", "ru": "Мы сохраним найденное в вашей учётной записи Tabi и пришлём итог с картинкой маршрута вам на почту. В приложении Tabi оно станет вашей коллекцией.", "cs": "Nalezené uložíme do vašeho účtu Tabi a výsledek s obrázkem trasy vám pošleme e-mailem. V aplikaci Tabi se z něj stane vaše sbírka.", "de": "Wir speichern das Gefundene in Ihrem Tabi-Konto und senden Ihnen das Ergebnis mit einem Bild Ihrer Route per E-Mail. In der Tabi-App wird daraus Ihre Sammlung.", "fr": "Nous enregistrons ce qui a été trouvé dans votre compte Tabi et vous envoyons le résultat par e-mail avec une image de votre itinéraire. Dans l’application Tabi, cela devient votre collection.", "es": "Guardaremos lo encontrado en tu cuenta de Tabi y te enviaremos el resultado por correo con una imagen de tu ruta. En la aplicación Tabi se convertirá en tu colección.", "it": "Salveremo quanto trovato nel Suo account Tabi e Le invieremo il risultato via e-mail con un’immagine del Suo percorso. Nell’app Tabi diventerà la Sua collezione.", "pt": "Vamos salvar o que foi encontrado na sua conta do Tabi e enviar o resultado por e-mail com uma imagem do seu trajeto. No aplicativo Tabi, isso se tornará a sua coleção.", "ja": "見つかったものをTabiのアカウントに保存し、ルートの画像付きで結果をメールでお送りします。Tabiアプリでは、それがあなたのコレクションになります。", "ko": "찾은 결과를 Tabi 계정에 저장하고 경로 이미지와 함께 이메일로 보내 드립니다. Tabi 앱에서 이는 여러분의 컬렉션이 됩니다."},
    "devNote": {"en": "Together with the points we save the camera model and the folder names: in the app they help to set apart other people’s devices.", "ru": "Вместе с точками сохраняются модель камеры и названия папок: по ним в приложении можно отделить чужие устройства.", "cs": "Spolu s body se ukládá model fotoaparátu a názvy složek: podle nich lze v aplikaci oddělit cizí zařízení.", "de": "Zusammen mit den Punkten werden das Kameramodell und die Ordnernamen gespeichert: Damit lassen sich in der App fremde Geräte abtrennen.", "fr": "Avec les points, nous enregistrons le modèle de l’appareil photo et le nom des dossiers : ils permettent de séparer dans l’application les appareils des autres personnes.", "es": "Junto con los puntos se guardan el modelo de la cámara y los nombres de las carpetas: con ellos, en la aplicación puedes separar los dispositivos de otras personas.", "it": "Insieme ai punti vengono salvati il modello della fotocamera e i nomi delle cartelle: nell’app permettono di separare i dispositivi di altre persone.", "pt": "Junto com os pontos, salvamos o modelo da câmera e os nomes das pastas: com eles, no aplicativo é possível separar os dispositivos de outras pessoas.", "ja": "地点と一緒にカメラの機種とフォルダ名も保存します。アプリでは、これを使ってほかの人の機器を分けられます。", "ko": "지점과 함께 카메라 모델과 폴더 이름도 저장합니다. 앱에서는 이를 이용해 다른 사람의 기기를 구분할 수 있습니다."},
    "news": {"en": "Send me news about Tabi", "ru": "Присылать мне новости Tabi", "cs": "Posílejte mi novinky o Tabi", "de": "Neuigkeiten über Tabi per E-Mail erhalten", "fr": "M’envoyer les nouveautés de Tabi", "es": "Enviarme novedades de Tabi", "it": "Inviatemi le novità di Tabi", "pt": "Enviar-me novidades do Tabi", "ja": "Tabiのお知らせを受け取る", "ko": "Tabi 소식 받기"},
    "note": {"en": "Your files never leave the computer: the page reads only the shooting location and time and the camera model. We respect your privacy.", "ru": "Файлы не покидают компьютер: страница читает в них только место и время съёмки и модель камеры. Мы уважаем вашу конфиденциальность.", "cs": "Soubory neopouštějí počítač: stránka v nich čte jen místo a čas pořízení a model fotoaparátu. Respektujeme vaše soukromí.", "de": "Ihre Dateien verlassen den Computer nicht: Die Seite liest nur Aufnahmeort, Aufnahmezeit und Kameramodell. Wir respektieren Ihre Privatsphäre.", "fr": "Vos fichiers ne quittent pas l’ordinateur : la page n’y lit que le lieu et l’heure de prise de vue et le modèle de l’appareil. Nous respectons votre vie privée.", "es": "Tus archivos no salen del ordenador: la página solo lee el lugar y la hora de captura y el modelo de la cámara. Respetamos tu privacidad.", "it": "I file non lasciano il computer: la pagina legge solo luogo e ora dello scatto e il modello della fotocamera. Rispettiamo la Sua privacy.", "pt": "Os arquivos não saem do computador: a página lê neles apenas o local e a hora da captura e o modelo da câmera. Respeitamos a sua privacidade.", "ja": "ファイルはパソコンの外に出ません。ページが読むのは撮影場所、撮影時刻、カメラの機種だけです。私たちはあなたのプライバシーを尊重します。", "ko": "파일은 컴퓨터를 벗어나지 않습니다. 페이지는 촬영 장소와 시간, 카메라 모델만 읽습니다. 우리는 여러분의 개인정보를 존중합니다."},
    "eLimit": {"en": "Enough points have been saved today. The rest can be saved tomorrow.", "ru": "На сегодня сохранено достаточно точек. Остальное можно сохранить завтра.", "cs": "Pro dnešek je uloženo dost bodů. Zbytek můžete uložit zítra.", "de": "Für heute sind genug Punkte gespeichert. Den Rest können Sie morgen speichern.", "fr": "Assez de points ont été enregistrés aujourd’hui. Le reste pourra l’être demain.", "es": "Por hoy se han guardado suficientes puntos. El resto puedes guardarlo mañana.", "it": "Per oggi sono stati salvati abbastanza punti. Il resto potrà salvarlo domani.", "pt": "Por hoje, já foram salvos pontos suficientes. O restante pode ser salvo amanhã.", "ja": "今日はこれ以上保存できません。残りは明日保存できます。", "ko": "오늘은 충분한 지점이 저장되었습니다. 나머지는 내일 저장할 수 있습니다."},
    "eFull": {"en": "Your Tabi account already holds the maximum number of points waiting to be checked. Open Tabi on your phone to check them.", "ru": "В вашей учётной записи Tabi уже ждёт проверки наибольшее число точек. Откройте Tabi на телефоне, чтобы проверить их.", "cs": "Ve vašem účtu Tabi už čeká na kontrolu nejvyšší možný počet bodů. Otevřete Tabi v telefonu, aby je zkontrolovalo.", "de": "In Ihrem Tabi-Konto warten bereits so viele Punkte auf die Prüfung, wie möglich ist. Öffnen Sie Tabi auf dem Telefon, um sie zu prüfen.", "fr": "Votre compte Tabi contient déjà le nombre maximal de points en attente de vérification. Ouvrez Tabi sur votre téléphone pour les vérifier.", "es": "Tu cuenta de Tabi ya tiene el número máximo de puntos pendientes de comprobar. Abre Tabi en el teléfono para comprobarlos.", "it": "Nel Suo account Tabi è già in attesa di verifica il numero massimo di punti. Apra Tabi sul telefono per verificarli.", "pt": "Sua conta do Tabi já tem o número máximo de pontos aguardando verificação. Abra o Tabi no telefone para verificá-los.", "ja": "Tabiのアカウントには、確認待ちの地点がすでに上限まであります。スマートフォンでTabiを開いて確認してください。", "ko": "Tabi 계정에 확인을 기다리는 지점이 이미 최대치입니다. 휴대전화에서 Tabi를 열어 확인하세요."},
    "none": {"en": "None of the chosen files contains a shooting location. Choose another folder.", "ru": "Ни в одном из выбранных файлов нет места съёмки. Выберите другую папку.", "cs": "V žádném z vybraných souborů není místo pořízení. Vyberte jinou složku.", "de": "Keine der gewählten Dateien enthält einen Aufnahmeort. Wählen Sie einen anderen Ordner.", "fr": "Aucun des fichiers choisis ne contient de lieu de prise de vue. Choisissez un autre dossier.", "es": "Ninguno de los archivos elegidos contiene el lugar de captura. Elige otra carpeta.", "it": "Nessuno dei file scelti contiene il luogo di scatto. Scelga un’altra cartella.", "pt": "Nenhum dos arquivos escolhidos contém o local da captura. Escolha outra pasta.", "ja": "選んだファイルのどれにも撮影場所がありません。別のフォルダを選んでください。", "ko": "선택한 파일 중 촬영 장소가 있는 파일이 없습니다. 다른 폴더를 선택하세요."},
    "eSrv": {"en": "The Tabi server did not save the result (code {c}). Please try again.", "ru": "Сервер Tabi не сохранил итог (код {c}). Попробуйте ещё раз.", "cs": "Server Tabi výsledek neuložil (kód {c}). Zkuste to znovu.", "de": "Der Tabi-Server hat das Ergebnis nicht gespeichert (Code {c}). Bitte versuchen Sie es erneut.", "fr": "Le serveur Tabi n’a pas enregistré le résultat (code {c}). Veuillez réessayer.", "es": "El servidor de Tabi no guardó el resultado (código {c}). Inténtalo de nuevo.", "it": "Il server di Tabi non ha salvato il risultato (codice {c}). Riprovi.", "pt": "O servidor do Tabi não salvou o resultado (código {c}). Tente novamente.", "ja": "Tabiのサーバーが結果を保存しませんでした（コード {c}）。もう一度お試しください。", "ko": "Tabi 서버가 결과를 저장하지 않았습니다(코드 {c}). 다시 시도하세요."},

    "phoneA": {"en": "Open tabimobile.com/computer on a computer to scan the media files kept on it. The media files of this phone are scanned by the Tabi app.", "ru": "Откройте tabimobile.com/computer на компьютере — там можно разобрать медиафайлы, которые на нём хранятся. Медиафайлы этого телефона разберёт приложение Tabi.", "cs": "Otevřete tabimobile.com/computer v počítači — tam lze projít mediální soubory, které jsou v něm uložené. Mediální soubory tohoto telefonu projde aplikace Tabi.", "de": "Öffnen Sie tabimobile.com/computer auf einem Computer, um die dort gespeicherten Mediendateien auszuwerten. Die Mediendateien dieses Telefons wertet die Tabi-App aus.", "fr": "Ouvrez tabimobile.com/computer sur un ordinateur pour analyser les fichiers multimédias qui s’y trouvent. Les fichiers multimédias de ce téléphone sont analysés par l’application Tabi.", "es": "Abre tabimobile.com/computer en un ordenador para analizar los archivos multimedia que guarda. Los archivos multimedia de este teléfono los analiza la aplicación Tabi.", "it": "Apra tabimobile.com/computer su un computer per analizzare i file multimediali che vi sono conservati. I file multimediali di questo telefono li analizza l’app Tabi.", "pt": "Abra tabimobile.com/computer em um computador para analisar os arquivos de mídia guardados nele. Os arquivos de mídia deste telefone são analisados pelo aplicativo Tabi.", "ja": "パソコンでtabimobile.com/computerを開くと、パソコンに保存されたメディアファイルを分析できます。このスマートフォンのメディアファイルはTabiアプリが分析します。", "ko": "컴퓨터에서 tabimobile.com/computer를 열면 컴퓨터에 저장된 미디어 파일을 분석할 수 있습니다. 이 휴대전화의 미디어 파일은 Tabi 앱이 분석합니다."},
    "phoneI": {"en": "Open tabimobile.com/computer on a computer to scan the media files kept on it.", "ru": "Откройте tabimobile.com/computer на компьютере — там можно разобрать медиафайлы, которые на нём хранятся.", "cs": "Otevřete tabimobile.com/computer v počítači — tam lze projít mediální soubory, které jsou v něm uložené.", "de": "Öffnen Sie tabimobile.com/computer auf einem Computer, um die dort gespeicherten Mediendateien auszuwerten.", "fr": "Ouvrez tabimobile.com/computer sur un ordinateur pour analyser les fichiers multimédias qui s’y trouvent.", "es": "Abre tabimobile.com/computer en un ordenador para analizar los archivos multimedia que guarda.", "it": "Apra tabimobile.com/computer su un computer per analizzare i file multimediali che vi sono conservati.", "pt": "Abra tabimobile.com/computer em um computador para analisar os arquivos de mídia guardados nele.", "ja": "パソコンでtabimobile.com/computerを開くと、パソコンに保存されたメディアファイルを分析できます。", "ko": "컴퓨터에서 tabimobile.com/computer를 열면 컴퓨터에 저장된 미디어 파일을 분석할 수 있습니다."},

    "copied": {"en": "The link is copied", "ru": "Ссылка скопирована", "cs": "Odkaz je zkopírován", "de": "Link kopiert", "fr": "Lien copié", "es": "Enlace copiado", "it": "Link copiato", "pt": "Link copiado", "ja": "リンクをコピーしました", "ko": "링크를 복사했습니다"},
    "mapHint": {"en": "Zoom with the mouse wheel or the buttons and drag the map with the mouse. Colour shows time: from early photos to recent ones.", "ru": "Приближайте колесом мыши или кнопками, перетаскивайте карту мышью. Цвет показывает время: от ранних снимков к недавним.", "cs": "Přibližujte kolečkem myši nebo tlačítky a mapu posouvejte myší. Barva ukazuje čas: od nejstarších snímků k nejnovějším.", "de": "Zoomen Sie mit dem Mausrad oder den Schaltflächen und verschieben Sie die Karte mit der Maus. Die Farbe zeigt die Zeit: von frühen zu neuen Fotos.", "fr": "Zoomez avec la molette ou les boutons et déplacez la carte avec la souris. La couleur indique le temps : des premières photos aux plus récentes.", "es": "Acerca con la rueda del ratón o los botones y arrastra el mapa con el ratón. El color muestra el tiempo: de las fotos más antiguas a las más recientes.", "it": "Ingrandisca con la rotellina del mouse o con i pulsanti e trascini la mappa con il mouse. Il colore indica il tempo: dalle foto più vecchie alle più recenti.", "pt": "Aproxime com a roda do mouse ou com os botões e arraste o mapa com o mouse. A cor mostra o tempo: das fotos mais antigas às mais recentes.", "ja": "マウスホイールかボタンで拡大し、マウスで地図を動かせます。色は時間を表します：古い写真から新しい写真へ。", "ko": "마우스 휠이나 버튼으로 확대하고 마우스로 지도를 움직이세요. 색은 시간을 나타냅니다: 오래된 사진에서 최근 사진까지."},

    "whyGone": {"en": "Shooting information removed: {n}. This happens with files saved from the internet, from a social network or after an editor.", "ru": "Сведения о съёмке удалены — {n}: так бывает с файлами, сохранёнными из интернета, из соцсети или после редактора.", "cs": "Údaje o pořízení odstraněny — {n}: tak to bývá u souborů uložených z internetu, ze sociální sítě nebo po úpravě v editoru.", "de": "Aufnahmedaten entfernt: {n}. Das kommt bei Dateien vor, die aus dem Internet, aus einem sozialen Netzwerk oder nach einem Bildbearbeitungsprogramm gespeichert wurden.", "fr": "Informations de prise de vue supprimées : {n}. Cela arrive avec les fichiers enregistrés depuis internet, un réseau social ou après un éditeur.", "es": "Datos de la captura eliminados: {n}. Ocurre con archivos guardados de internet, de una red social o tras un editor.", "it": "Dati dello scatto rimossi: {n}. Succede con file salvati da internet, da un social network o dopo un editor.", "pt": "Dados da captura removidos: {n}. Isso acontece com arquivos salvos da internet, de uma rede social ou depois de um editor.", "ja": "撮影情報が削除されたもの：{n}。インターネットやSNSから保存したファイル、編集アプリで保存したファイルでよく起こります。", "ko": "촬영 정보가 삭제된 파일: {n}. 인터넷이나 소셜 네트워크에서 저장했거나 편집기로 저장한 파일에서 생깁니다."},
