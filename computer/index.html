    "tGen": {"en": "Rarity shows how much a place stands out among places of its kind: castles, waterfalls, museums.", "ru": "Редкость показывает, насколько место выделяется среди мест своего рода — замков, водопадов, музеев.", "cs": "Vzácnost ukazuje, jak moc místo vyniká mezi místy svého druhu – hrady, vodopády, muzei.", "de": "Die Seltenheit zeigt, wie sehr ein Ort unter Orten seiner Art hervorsticht – unter Burgen, Wasserfällen, Museen.", "fr": "La rareté indique à quel point un lieu se distingue parmi ceux de son genre : châteaux, cascades, musées.", "es": "La rareza indica cuánto destaca un lugar entre los de su tipo: castillos, cascadas, museos.", "it": "La rarità indica quanto un luogo si distingue tra quelli del suo genere: castelli, cascate, musei.", "pt": "A raridade indica quanto um lugar se destaca entre os do seu tipo: castelos, cachoeiras, museus.", "ja": "レア度は、城・滝・博物館など同じ種類の場所の中で、その場所がどれほど際立っているかを表します。", "ko": "희귀도는 성, 폭포, 박물관처럼 같은 종류의 장소 가운데 그곳이 얼마나 돋보이는지를 나타냅니다."},
    "tX_mythic": {"en": "Unique is the highest rarity: symbols of countries and of the whole world, only a few dozen on the entire planet.", "ru": "Уникальные — высшая редкость: символы стран и всего мира, на всей планете их лишь несколько десятков.", "cs": "Unikátní je nejvyšší vzácnost: symboly zemí i celého světa, na celé planetě jich je jen několik desítek.", "de": "Einzigartig ist die höchste Seltenheit: Symbole von Ländern und der ganzen Welt, auf dem ganzen Planeten nur einige Dutzend.", "fr": "Unique est la plus haute rareté : des symboles de pays et du monde entier, quelques dizaines seulement sur toute la planète.", "es": "Único es la rareza más alta: símbolos de países y del mundo entero, apenas unas decenas en todo el planeta.", "it": "Unico è la rarità più alta: simboli di paesi e del mondo intero, solo poche decine su tutto il pianeta.", "pt": "Único é a raridade mais alta: símbolos de países e do mundo inteiro, apenas algumas dezenas em todo o planeta.", "ja": "「唯一無二」は最高のレア度で、国や世界の象徴です。地球全体でも数十か所しかありません。", "ko": "유일은 가장 높은 희귀도로, 국가와 세계의 상징입니다. 지구 전체에 수십 곳뿐입니다."},
    "tX_legendary": {"en": "Legendary places are the best of their kind, the most famous places in the world.", "ru": "Легендарные — лучшие в своём роде, самые известные места мира.", "cs": "Legendární místa jsou nejlepší svého druhu, nejznámější místa světa.", "de": "Legendäre Orte sind die besten ihrer Art, die bekanntesten Orte der Welt.", "fr": "Les lieux légendaires sont les meilleurs de leur genre, les plus célèbres du monde.", "es": "Los lugares legendarios son los mejores de su tipo, los más famosos del mundo.", "it": "I luoghi leggendari sono i migliori del loro genere, i più famosi al mondo.", "pt": "Os lugares lendários são os melhores do seu tipo, os mais famosos do mundo.", "ja": "「秘境」は同じ種類の中で最高の、世界でも特に有名な場所です。", "ko": "전설은 같은 종류 가운데 최고이자 세계에서 가장 유명한 장소입니다."},
    "tX_epic": {"en": "Epic places are outstanding: people travel to a country or a city to see them.", "ru": "Эпические — выдающиеся места, ради которых едут в страну или город.", "cs": "Epická místa jsou výjimečná: kvůli nim se jezdí do země nebo do města.", "de": "Epische Orte sind herausragend: Ihretwegen reist man in ein Land oder eine Stadt.", "fr": "Les lieux épiques sont remarquables : on se rend dans un pays ou une ville pour les voir.", "es": "Los lugares épicos son excepcionales: se viaja a un país o a una ciudad para verlos.", "it": "I luoghi epici sono eccezionali: si va in un paese o in una città apposta per vederli.", "pt": "Os lugares épicos são excepcionais: as pessoas viajam a um país ou a uma cidade para vê-los.", "ja": "「絶景」は、それを見るために国や街を訪れるほどの際立った場所です。", "ko": "에픽은 그곳을 보려고 나라나 도시를 찾을 만큼 뛰어난 장소입니다."},
    "tX_rare": {"en": "Rare places stand out and are worth seeing.", "ru": "Редкие — заметные места, которые стоит увидеть.", "cs": "Vzácná místa vynikají a stojí za to je vidět.", "de": "Seltene Orte stechen hervor und sind sehenswert.", "fr": "Les lieux rares se distinguent et méritent d’être vus.", "es": "Los lugares raros destacan y merecen la pena.", "it": "I luoghi rari si distinguono e meritano di essere visti.", "pt": "Os lugares raros se destacam e valem a visita.", "ja": "「名勝」は、ひときわ目を引く一見の価値がある場所です。", "ko": "희귀는 눈에 띄며 볼 만한 장소입니다."},
    "tX_common": {"en": "Common places are the core of the collection: known to travellers and described in encyclopaedias.", "ru": "Обычные — основа коллекции: места, известные путешественникам и описанные в энциклопедиях.", "cs": "Běžná místa jsou základem sbírky: znají je cestovatelé a popisují je encyklopedie.", "de": "Gewöhnliche Orte sind die Grundlage der Sammlung: Reisenden bekannt und in Enzyklopädien beschrieben.", "fr": "Les lieux de rang commun forment la base de la collection : connus des voyageurs et décrits dans les encyclopédies.", "es": "Los lugares de rango común son la base de la colección: conocidos por los viajeros y descritos en las enciclopedias.", "it": "I luoghi di rango comune sono la base della collezione: noti ai viaggiatori e descritti nelle enciclopedie.", "pt": "Os lugares de nível comum são a base da coleção: conhecidos dos viajantes e descritos em enciclopédias.", "ja": "「定番」はコレクションの基本で、旅行者に知られ、百科事典にも載っている場所です。", "ko": "일반은 컬렉션의 바탕으로, 여행자에게 알려져 있고 백과사전에도 실린 장소입니다."},
    "tX_dangerous": {"en": "Dangerous places call for special caution; the app says what makes each of them dangerous.", "ru": "Опасные — места, где нужна особая осторожность; в приложении у каждого сказано, чем оно опасно.", "cs": "Nebezpečná místa vyžadují zvláštní opatrnost; aplikace u každého uvádí, čím je nebezpečné.", "de": "Gefährliche Orte verlangen besondere Vorsicht; die App nennt bei jedem, was ihn gefährlich macht.", "fr": "Les lieux dangereux demandent une prudence particulière ; l’application précise pour chacun ce qui le rend dangereux.", "es": "Los lugares peligrosos exigen una precaución especial; la aplicación indica qué hace peligroso a cada uno.", "it": "I luoghi pericolosi richiedono particolare prudenza; l’app indica per ciascuno che cosa lo rende pericoloso.", "pt": "Os lugares perigosos exigem cuidado especial; o aplicativo indica o que torna cada um deles perigoso.", "ja": "「危険」は特に注意が必要な場所で、アプリでは何が危険なのかをそれぞれ説明しています。", "ko": "위험은 각별한 주의가 필요한 장소로, 앱에서 각각 무엇이 위험한지 알려 줍니다."},

    "tGet": {"en": "Your route shows that you have been there. The Tabi app will show names, photos and descriptions: install it on your phone and sign in with the same account, {mail}. The app will receive your route and mark what was found in your collection.", "ru": "Ваш маршрут показывает, что вы там побывали. Названия, снимки и описания покажет приложение Tabi: установите его на телефон и войдите с той же учётной записью — {mail}. Приложение получит ваш маршрут и отметит найденное в коллекции.", "cs": "Vaše trasa ukazuje, že jste tam byli. Názvy, fotografie a popisy ukáže aplikace Tabi: nainstalujte si ji do telefonu a přihlaste se stejným účtem – {mail}. Aplikace převezme vaši trasu a nalezené označí ve sbírce.", "de": "Ihre Route zeigt, dass Sie dort waren. Namen, Fotos und Beschreibungen zeigt die App Tabi: Installieren Sie sie auf dem Telefon und melden Sie sich mit demselben Konto an – {mail}. Die App übernimmt Ihre Route und markiert das Gefundene in Ihrer Sammlung.", "fr": "Votre itinéraire montre votre passage sur place. Les noms, photos et descriptions s’affichent dans l’application Tabi : installez-la sur votre téléphone et connectez-vous avec le même compte, {mail}. L’application recevra votre itinéraire et marquera les lieux trouvés dans votre collection.", "es": "Tu ruta muestra que estuviste allí. Los nombres, las fotos y las descripciones te los mostrará la aplicación Tabi: instálala en tu teléfono e inicia sesión con la misma cuenta, {mail}. La aplicación recibirá tu ruta y marcará lo encontrado en tu colección.", "it": "Lo indica il Suo percorso. Nomi, foto e descrizioni Glieli mostrerà l’app Tabi: la installi sul telefono e acceda con lo stesso account, {mail}. L’app riceverà il Suo percorso e segnerà nella Sua collezione ciò che è stato trovato.", "pt": "O seu trajeto mostra que você esteve lá. Os nomes, as fotos e as descrições aparecem no aplicativo Tabi: instale-o no celular e entre com a mesma conta, {mail}. O aplicativo vai receber o seu trajeto e marcar na sua coleção o que foi encontrado.", "ja": "ルートから、あなたがそこを訪れたことがわかります。名前・写真・説明はTabiアプリで見られます。スマートフォンにインストールし、同じアカウント（{mail}）でログインしてください。アプリがルートを受け取り、見つかった場所をコレクションに記録します。", "ko": "경로를 보면 그곳에 다녀오신 것을 알 수 있습니다. 이름과 사진, 설명은 Tabi 앱에서 볼 수 있습니다. 휴대폰에 앱을 설치하고 같은 계정({mail})으로 로그인하세요. 앱이 경로를 받아 찾은 장소를 컬렉션에 표시합니다."},
    "tHas": {"en": "Your route shows that you have been there. Names, photos and descriptions are in the Tabi app: open it on your phone, and what was found on your route will appear in your collection.", "ru": "Ваш маршрут показывает, что вы там побывали. Названия, снимки и описания — в приложении Tabi: откройте его на телефоне, и найденное по маршруту появится в коллекции.", "cs": "Vaše trasa ukazuje, že jste tam byli. Názvy, fotografie a popisy najdete v aplikaci Tabi: otevřete ji v telefonu a nalezené podle trasy se objeví ve sbírce.", "de": "Ihre Route zeigt, dass Sie dort waren. Namen, Fotos und Beschreibungen finden Sie in der App Tabi: Öffnen Sie sie auf dem Telefon, dann erscheint das auf Ihrer Route Gefundene in Ihrer Sammlung.", "fr": "Votre itinéraire montre votre passage sur place. Les noms, photos et descriptions sont dans l’application Tabi : ouvrez-la sur votre téléphone, et les lieux trouvés sur votre itinéraire apparaîtront dans votre collection.", "es": "Tu ruta muestra que estuviste allí. Los nombres, las fotos y las descripciones están en la aplicación Tabi: ábrela en tu teléfono y lo encontrado en tu ruta aparecerá en tu colección.", "it": "Lo indica il Suo percorso. Nomi, foto e descrizioni sono nell’app Tabi: la apra sul telefono, e ciò che è stato trovato sul Suo percorso comparirà nella Sua collezione.", "pt": "O seu trajeto mostra que você esteve lá. Os nomes, as fotos e as descrições estão no aplicativo Tabi: abra-o no celular, e o que foi encontrado no seu trajeto aparecerá na sua coleção.", "ja": "ルートから、あなたがそこを訪れたことがわかります。名前・写真・説明はTabiアプリにあります。スマートフォンでアプリを開くと、ルートで見つかった場所がコレクションに表示されます。", "ko": "경로를 보면 그곳에 다녀오신 것을 알 수 있습니다. 이름과 사진, 설명은 Tabi 앱에 있습니다. 휴대폰에서 앱을 열면 경로에서 찾은 장소가 컬렉션에 나타납니다."},
    "eOauth": {"en": "Sign-in did not work. Try again or sign in with a code sent to your email.", "ru": "Войти не удалось. Попробуйте ещё раз или войдите по коду на почту.", "cs": "Přihlášení se nezdařilo. Zkuste to znovu nebo se přihlaste kódem zaslaným e-mailem.", "de": "Die Anmeldung hat nicht geklappt. Versuchen Sie es erneut oder melden Sie sich mit einem Code per E-Mail an.", "fr": "La connexion n’a pas abouti. Réessayez ou connectez-vous avec un code envoyé par e-mail.", "es": "No se pudo iniciar sesión. Inténtalo de nuevo o inicia sesión con un código enviado a tu correo.", "it": "L’accesso non è riuscito. Riprovi oppure acceda con un codice inviato per e-mail.", "pt": "Não foi possível entrar. Tente de novo ou entre com um código enviado ao seu e-mail.", "ja": "ログインできませんでした。もう一度試すか、メールに届くコードでログインしてください。", "ko": "로그인하지 못했습니다. 다시 시도하거나 이메일로 받은 코드로 로그인하세요."},
