<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tabi</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/account.js?v=da076c019a"></script>
<script>
// Тема и язык — до первой отрисовки, чтобы страница не мигала (17.11.2026).
(function () { try { var th = localStorage.getItem("tabiTheme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {} })();
</script>
<style>
body{min-height:100vh;background:var(--glow),radial-gradient(800px 520px at 0% 100%,var(--accent-soft) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.pc-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
/* Навигация сайта (20.11.2026, Андрей): две вкладки — главная и эта страница; на узком экране — меню. */
nav.sections+.pc-tools{margin-left:22px}
details.menu{display:none}
@media (max-width:1100px){nav.sections+.pc-tools{margin-left:auto}details.menu{display:block}}
/* Узкий экран: у меню и языка — только значки, шапка в одну строку без прокрутки вбок. */
@media (max-width:560px){#menuLbl,#langCur{display:none}.pc-tools{gap:8px}}
/* Итог выбора — плитками (20.11.2026, Андрей: строка была технической). */
.pc-run{display:grid;gap:8px}
.pc-run .hd{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.pc-run .tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-run .tl div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.pc-run .tl b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.pc-run .tl span{font-size:12.5px;color:var(--sub)}
.pc-run .tl div.new{border-color:var(--accent)}
.pc-run .tl div.new b{color:var(--accent)}
.pc-run .why0{font-size:14px;color:var(--sub);margin:0}
.pc-theme{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.pc-theme .ic{width:19px;height:19px}
details.lang li button{all:unset;display:block;box-sizing:border-box;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;cursor:pointer}
details.lang li button:hover,details.lang li button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.pc{max-width:1320px;margin:0 auto;padding:28px 20px 56px}
.pc-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:20px;align-items:start;transition:grid-template-columns .4s ease}
.pc-grid.idle{grid-template-columns:minmax(0,600px);justify-content:center}
.pc-grid.idle .pc-side{display:none}
.pc-card{background:var(--panel);border-radius:24px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-main{display:grid;gap:16px}
.pc-main h1{font-size:clamp(26px,2.6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0}
.pc-main h2{font-size:20px;margin:0;letter-spacing:-.01em}
.pc-lead{color:var(--sub);margin:0}
.pc-side{max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;display:grid;gap:12px;align-content:start}
/* Полосы прокрутки боковых списков — в цветах сайта (18.11.2026, Андрей: белые полосы выглядели чужими). */
.pc-side{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc-side::-webkit-scrollbar{width:8px}
.pc-side::-webkit-scrollbar-track{background:transparent;margin:18px 0}
.pc-side::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid var(--panel)}
.pc-side::-webkit-scrollbar-thumb:hover{background:var(--sub)}
.pc-side h2,.pc-route h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.pc-count{color:var(--sub);font-weight:700;margin-left:6px}
.pc-btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%;text-align:center;text-decoration:none;display:block;box-sizing:border-box}
.pc-btn.b2{background:var(--bg2);color:var(--ink)}
.pc-btn:disabled{opacity:.55;cursor:default}
.pc-btn.sm{width:auto;display:inline-block;padding:10px 18px;font-size:14.5px}
.pc-end{display:flex;justify-content:flex-start;margin-top:20px}
dialog.pc-dlg{border:1px solid var(--line);border-radius:24px;padding:26px;width:min(460px,calc(100vw - 32px));box-sizing:border-box;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog.pc-dlg::backdrop{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(4px)}
dialog.pc-dlg h2{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
dialog.pc-dlg .pc-row{margin-top:20px}
dialog.pc-res{width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow-y:auto}
dialog.pc-res[open]{display:grid;gap:16px}
dialog.pc-res h3{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:700}
/* Плитки чисел окна итога, особых мест и строки итога (21.11.2026, план Андрея: число никогда не выходит за плитку): число
   не переносится; плитка не уже своего числа и подписи; не помещается строка — плитки переходят на следующую. */
.pc-res-tl{display:flex;flex-wrap:wrap;gap:8px}
.pc-res-tl div{flex:1 1 104px;min-width:min-content;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.pc-res-tl b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.pc-res-tl span{font-size:12.5px;color:var(--sub)}
.pc-res-tl .new{border-color:var(--accent)}.pc-res-tl .new b{color:var(--accent)}
.pc-res-cc{display:flex;flex-wrap:wrap;gap:8px}
.pc-res-cc span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:650;font-size:14.5px}
.pc-res-cc img{width:26px;height:18px;object-fit:cover;border-radius:4px}
.pc-app{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.pc-qr{width:128px;height:128px;padding:10px;background:#fff;border-radius:14px}
.pc-qr svg{width:100%;height:100%;display:block}
.pc-steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.45;color:var(--ink)}
.pc-shots{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.pc-shots img{height:240px;width:auto;border-radius:18px;border:1px solid var(--line);flex:none}
.pc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc-in{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.pc-s{color:var(--sub);font-size:14px;line-height:1.45;margin:0}
.pc-t{color:var(--ink);font-size:15.5px;line-height:1.5;margin:0}
.pc-e{color:var(--accent);font-size:14.5px;line-height:1.45;font-weight:600}
.pc-chk{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink);cursor:pointer}
.pc-chk input{width:18px;height:18px;accent-color:var(--accent)}
.pc-box{display:grid;gap:10px;padding:18px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.pc-devs{display:grid;gap:12px}
.pc-dev{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.pc-dev .bd{display:grid;gap:2px;min-width:0}
.pc-dev .pc-btn.sm{padding:7px 14px;font-size:13.5px}
.pc-dev:first-child{padding-top:0;border-top:0}
.pc-dev .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pc-dev .nm{font-weight:700;overflow-wrap:anywhere}
.pc-dev .n{color:var(--sub);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-dev .ln{color:var(--sub);font-size:14px;line-height:1.4}
.pc-drop{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--sub);font-size:14px}
.pc-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden}.pc-bar>div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.pc-bar.wait>div{width:30%!important;animation:pcWait 1.4s ease-in-out infinite}
@keyframes pcWait{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
/* Строка хода не дёргается: цифры одной ширины (18.11.2026, Андрей). */
#prog,#eta{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-why summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14.5px;list-style:none}
.pc-why summary::-webkit-details-marker{display:none}
.pc-why summary::after{content:" ›";color:var(--sub)}
.pc-why[open] summary::after{content:" ⌄"}
.pc-why ul{margin:8px 0 0;padding:0 0 0 18px;display:grid;gap:6px;font-size:14px;color:var(--sub);line-height:1.45}
.pc-why li b{color:var(--ink);font-weight:650}
.pc-when{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;min-height:1.1em}
/* Строка итога: плитки равны, пока числа помещаются; длинному числу (километры) его плитка шире ровно настолько, насколько
   ему нужно, соседние — уже, до своей подписи. Во время счёта ширину держит невидимое конечное число (.sz), и плитка не
   растёт рывком с каждой новой цифрой. */
.pc-stats{display:flex;flex-wrap:wrap;gap:10px}
.pc-stat{flex:1 1 0;min-width:min-content;background:var(--bg);border-radius:14px;padding:10px 12px;border:1px solid var(--line);text-align:center}
.pc-stat>b{display:grid;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.pc-stat>b>span{grid-area:1/1}
.pc-stat>b>.sz{visibility:hidden}
.pc-stat>span{font-size:12.5px;color:var(--sub);line-height:1.25;display:block}
.pc-list{display:grid;gap:8px}
.pc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both}
.pc-item img{width:34px;height:24px;object-fit:cover;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pc-item .nm{font-weight:700;line-height:1.25}
.pc-item .dt{color:var(--sub);font-size:12.5px}
.pc-regs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pc-regs span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;animation:pcIn .45s ease both}
.pc-city{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both;min-width:0}
.pc-city .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.pc-city .cc{color:var(--sub);font-size:12.5px;white-space:nowrap;flex:none}
.pc-route{margin-top:20px;display:grid;gap:12px}
/* Под картой — две половины (20.11.2026, Андрей: устройства — левая половина, правая пока пуста). */
.pc-under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pc-under.idle{grid-template-columns:minmax(0,600px);justify-content:center}
/* Особые места по редкости (20.11.2026, Андрей): полоса долей и плитки; нажатие — сколько таких на всей карте. */
.pc-tiers{display:flex;flex-wrap:wrap;gap:8px}
.pc-tier{flex:1 1 96px;min-width:min-content;border:1px solid var(--line);border-radius:14px;padding:12px 10px 9px;background:var(--bg);color:var(--ink);display:grid;gap:2px;position:relative;overflow:hidden}
.pc-tier::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.pc-tier b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.pc-tier span{font-size:12.5px;color:var(--sub)}
/* Вопросы и ответы — справа от устройств: подробности, которые не нужны на главном месте (20.11.2026, Андрей). */
.pc-faq{border-top:1px solid var(--line);padding:13px 0}
.pc-faq:first-of-type{border-top:0;padding-top:0}
.pc-faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;line-height:1.4}
.pc-faq summary::-webkit-details-marker{display:none}
.pc-faq summary::after{content:" ›";color:var(--sub)}
.pc-faq[open] summary::after{content:" ⌄"}
.pc-faq p{margin:8px 0 0;color:var(--sub);font-size:16px;line-height:1.55}
.pc-map{position:relative;border-radius:16px;overflow:hidden;background:var(--bg)}
.pc-map canvas{width:100%;height:clamp(420px,62vh,720px);display:block;touch-action:none;cursor:grab}
.pc-map canvas.drag{cursor:grabbing}
.pc-zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.pc-zoom button{appearance:none;border:1px solid var(--line);width:38px;height:38px;border-radius:12px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:21px;font-weight:700;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.pc-link{color:var(--accent);font-weight:700;font-size:15px;text-decoration:none}.pc-link:hover{text-decoration:underline}
.pc-zoom button svg{width:18px;height:18px}
.pc-tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.pc-tip b{display:block;font-weight:700}
.pc-legend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pc-legend i{flex:1;max-width:320px;height:8px;border-radius:999px}
.pc-foot{max-width:1320px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px}
.pc-foot a{color:var(--sub);font-weight:600;text-decoration:none}.pc-foot a:hover{color:var(--ink)}
.pc-over{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);font-size:24px;font-weight:800;color:var(--accent);pointer-events:none}
@keyframes pcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Открытие (20.11.2026, Андрей: сначала мелькал вид «до разбора» с вопросами): пока идут итог браузера и учётная запись —
   только тонкая полоса посередине, затем страница появляется сразу в своём виде. */
.pc-loader{max-width:320px;margin:22vh auto 0;padding:0 20px}
main.pc.pc-load,main.pc.pc-load~.pc-foot{display:none}
main.pc.pc-show{animation:pcFade .35s ease both}
@keyframes pcFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pc-item,.pc-city,.pc-regs span{animation:none}}
@media (max-width:1100px){.pc-under{grid-template-columns:minmax(0,1fr)}.pc-grid{grid-template-columns:minmax(0,1fr)}.pc-grid.idle{grid-template-columns:minmax(0,600px)}.pc-side{position:static;max-height:none}.pc-stat{flex-basis:calc((100% - 21px) / 3)}}
@media (max-width:520px){.pc-map canvas{height:340px}.pc-row{grid-template-columns:1fr}.pc-app{grid-template-columns:1fr}.pc-shots img{height:200px}}
[hidden]{display:none!important}
</style></head>
<body>
<header class="top"><div class="wrap">
<a class="wordmark" href="/" id="homeLink" aria-label="Tabi">Tabi</a>
<nav class="sections" id="nav" aria-label="Tabi"></nav>
<div class="pc-tools">
<details class="lang menu" id="menuBox"><summary><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menuLbl"></span></summary><ul id="menuList"></ul></details>
<details class="lang" id="langBox"><summary><span class="sr" id="langLbl"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span id="langCur"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><ul id="langList"></ul></details>
<button class="pc-theme" id="themeBtn" type="button"></button>
<a data-tabi-acc id="accChip" href="/account/"></a>
</div>
</div></header>

<div class="pc-loader" id="loader" hidden><div class="pc-bar wait"><div></div></div></div>
<main class="pc" id="pcMain">
<div class="pc-grid idle" id="grid">
  <aside class="pc-card pc-side" id="left" aria-live="polite">
    <h2><span id="hCountries"></span><span class="pc-count" id="nCountries"></span></h2>
    <div class="pc-list" id="countries"></div>
  </aside>

  <section class="pc-card pc-main">
    <h1 id="title"></h1>
    <p class="pc-lead" id="lead"></p>
    <!-- Телефон: страница разбирает медиафайлы компьютера -->
    <div id="vPhone" hidden class="pc-box">
      <h2 id="phoneT"></h2>
      <p class="pc-t" id="phoneX"></p>
      <a class="pc-btn" id="bPlay" rel="noopener"></a>
      <button class="pc-btn b2" id="bCopy" type="button"></button>
    </div>
    <!-- Выбор файлов -->
    <div id="vPick" hidden style="display:grid;gap:10px">
      <button class="pc-btn" id="bFolder"></button>
      <div class="pc-drop" id="drop"></div>
      <input type="file" id="fFolder" webkitdirectory multiple hidden>
    </div>
    <!-- Чтение и разбор -->
    <div id="vWork" hidden style="display:grid;gap:12px">
      <div class="pc-when" id="when" aria-live="polite"></div>
      <div id="prog" class="pc-s"></div>
      <div class="pc-bar" id="bar"><div id="barIn"></div></div>
      <div id="eta" class="pc-s" hidden></div>
      <p class="pc-s" id="slow" hidden></p>
      <p class="pc-s" id="sysX" hidden></p>
    </div>
    <div class="pc-stats" id="stats" hidden></div>
    <!-- Итог -->
    <div id="vDone" hidden style="display:grid;gap:12px">
      <p class="pc-t" id="done" hidden></p>
      <button class="pc-btn b2" id="bMore"></button>
    </div>
    <!-- Сохранение (20.11.2026, Андрей): «Сохранить итог» или «Перенести на телефон», затем только «Войти через Google» -->
    <div id="vSave" hidden class="pc-box">
      <h2 id="saveT"></h2>
      <p class="pc-t" id="saveX"></p>
      <div class="pc-row" id="saveWays"><button class="pc-btn" id="bSaveAcc" type="button"></button><button class="pc-btn b2" id="bSavePhone" type="button"></button></div>
      <button class="pc-btn" id="bGoogle" type="button" hidden></button>
    </div>
    <!-- Особые места на снимках по редкости (20.11.2026, Андрей): число и плитки; приложения нет — какие это места, покажет
         приложение: код и ссылка Google Play, экраны приложения; приложение уже есть — без строк о нём -->
    <div id="vApp" hidden class="pc-box">
      <h2 id="spT"></h2>
      <div class="pc-tiers" id="tiers"></div>
      <div id="appGet" style="display:grid;gap:12px">

    "lead": {"en": "Old trips are often kept on a computer. Choose a folder with photos and videos, and we will restore the countries and cities you have visited and your route.", "ru": "Старые поездки часто хранятся на компьютере. Выберите папку с фотографиями и видео — мы восстановим по ним страны и города, в которых вы побывали, и ваш маршрут.", "cs": "Staré cesty bývají uložené v počítači. Vyberte složku s fotografiemi a videi a my podle nich obnovíme země a města, kde jste byli, i vaši trasu.", "de": "Alte Reisen liegen oft auf dem Computer. Wählen Sie einen Ordner mit Fotos und Videos, und wir stellen daraus die Länder und Städte, in denen Sie waren, und Ihre Route wieder her.", "fr": "Les anciens voyages sont souvent conservés sur l’ordinateur. Choisissez un dossier de photos et de vidéos : nous retrouverons les pays et les villes où vous êtes allé et votre itinéraire.", "es": "Los viajes antiguos suelen guardarse en el ordenador. Elige una carpeta con fotos y vídeos y recuperaremos los países y las ciudades que visitaste y tu ruta.", "it": "I vecchi viaggi spesso restano sul computer. Scelga una cartella di foto e video: ricostruiremo i Paesi e le città in cui è stato e il Suo percorso.", "pt": "Viagens antigas costumam ficar guardadas no computador. Escolha uma pasta com fotos e vídeos, e vamos recuperar os países e as cidades por onde você passou e o seu trajeto.", "ja": "昔の旅の記録はパソコンに残っていることがよくあります。写真と動画のフォルダーを選ぶと、訪れた国と都市、そしてルートを復元します。", "ko": "예전 여행은 컴퓨터에 남아 있는 경우가 많습니다. 사진과 동영상 폴더를 고르면 다녀온 나라와 도시, 그리고 경로를 되살려 드립니다."},

    "saveX": {"en": "The result is stored only in this browser. Save it or move it to your phone.", "ru": "Итог хранится только в этом браузере. Сохраните его или перенесите на телефон.", "cs": "Výsledek je uložen jen v tomto prohlížeči. Uložte si ho, nebo ho přeneste do telefonu.", "de": "Das Ergebnis ist nur in diesem Browser gespeichert. Speichern Sie es oder übertragen Sie es auf Ihr Telefon.", "fr": "Le résultat n’est conservé que dans ce navigateur. Enregistrez-le ou transférez-le sur votre téléphone.", "es": "El resultado solo está guardado en este navegador. Guárdalo o pásalo a tu teléfono.", "it": "Il risultato è conservato solo in questo browser. Lo salvi o lo trasferisca sul telefono.", "pt": "O resultado está guardado só neste navegador. Salve-o ou passe-o para o celular.", "ja": "結果はこのブラウザーにだけ保存されています。保存するか、スマートフォンに移してください。", "ko": "결과는 이 브라우저에만 보관되어 있습니다. 저장하거나 휴대폰으로 옮기세요."},
    "eLimit": {"en": "Enough points have been saved today. The rest can be saved tomorrow.", "ru": "На сегодня сохранено достаточно точек. Остальное можно сохранить завтра.", "cs": "Pro dnešek je uloženo dost bodů. Zbytek můžete uložit zítra.", "de": "Für heute sind genug Punkte gespeichert. Den Rest können Sie morgen speichern.", "fr": "Assez de points ont été enregistrés aujourd’hui. Le reste pourra l’être demain.", "es": "Por hoy se han guardado suficientes puntos. El resto puedes guardarlo mañana.", "it": "Per oggi sono stati salvati abbastanza punti. Il resto potrà salvarlo domani.", "pt": "Por hoje, já foram salvos pontos suficientes. O restante pode ser salvo amanhã.", "ja": "今日はこれ以上保存できません。残りは明日保存できます。", "ko": "오늘은 충분한 지점이 저장되었습니다. 나머지는 내일 저장할 수 있습니다."},
    "eFull": {"en": "The largest number of points is already waiting to be checked. Open the app on your phone to check them.", "ru": "Наибольшее число точек уже ждёт проверки. Откройте приложение на телефоне, чтобы проверить их.", "cs": "Na kontrolu už čeká největší možný počet bodů. Otevřete aplikaci v telefonu a zkontrolujte je.", "de": "Die größte Zahl an Punkten wartet bereits auf die Prüfung. Öffnen Sie die App auf Ihrem Telefon, um sie zu prüfen.", "fr": "Le nombre maximal de points attend déjà d’être vérifié. Ouvrez l’application sur votre téléphone pour les vérifier.", "es": "Ya hay el número máximo de puntos esperando revisión. Abre la aplicación en tu teléfono para revisarlos.", "it": "Il numero massimo di punti è già in attesa di verifica. Apra l’app sul telefono per verificarli.", "pt": "O número máximo de pontos já aguarda verificação. Abra o aplicativo no celular para verificá-los.", "ja": "確認待ちの地点がすでに上限に達しています。スマートフォンでアプリを開いて確認してください。", "ko": "확인을 기다리는 지점이 이미 최대입니다. 휴대폰에서 앱을 열어 확인하세요."},
    "none": {"en": "None of the chosen files contains a shooting location. Choose another folder.", "ru": "Ни в одном из выбранных файлов нет места съёмки. Выберите другую папку.", "cs": "V žádném z vybraných souborů není místo pořízení. Vyberte jinou složku.", "de": "Keine der gewählten Dateien enthält einen Aufnahmeort. Wählen Sie einen anderen Ordner.", "fr": "Aucun des fichiers choisis ne contient de lieu de prise de vue. Choisissez un autre dossier.", "es": "Ninguno de los archivos elegidos contiene el lugar de captura. Elige otra carpeta.", "it": "Nessuno dei file scelti contiene il luogo di scatto. Scelga un’altra cartella.", "pt": "Nenhum dos arquivos escolhidos contém o local da captura. Escolha outra pasta.", "ja": "選んだファイルのどれにも撮影場所がありません。別のフォルダを選んでください。", "ko": "선택한 파일 중 촬영 장소가 있는 파일이 없습니다. 다른 폴더를 선택하세요."},

    "slow": {"en": "The files are being read slowly: this happens when they are on a flash drive, an external disk or in a cloud folder that the computer downloads first.", "ru": "Файлы читаются медленно: так бывает, когда они лежат на флешке, внешнем диске или в облачной папке, которую компьютер сначала скачивает.", "cs": "Soubory se čtou pomalu: tak to bývá, když jsou na flash disku, externím disku nebo v cloudové složce, kterou počítač nejdřív stahuje.", "de": "Die Dateien werden langsam gelesen: Das kommt vor, wenn sie auf einem USB-Stick, einer externen Festplatte oder in einem Cloud-Ordner liegen, den der Computer zuerst herunterlädt.", "fr": "Les fichiers sont lus lentement : cela arrive lorsqu’ils se trouvent sur une clé USB, un disque externe ou dans un dossier cloud que l’ordinateur télécharge d’abord.", "es": "Los archivos se leen despacio: ocurre cuando están en una memoria USB, un disco externo o una carpeta en la nube que el ordenador descarga primero.", "it": "I file vengono letti lentamente: succede quando si trovano su una chiavetta USB, su un disco esterno o in una cartella cloud che il computer scarica prima.", "pt": "Os arquivos estão sendo lidos devagar: isso acontece quando estão em um pen drive, em um disco externo ou em uma pasta na nuvem que o computador baixa primeiro.", "ja": "ファイルの読み込みに時間がかかっています。USBメモリーや外付けディスク、先にダウンロードが必要なクラウドのフォルダにあるファイルでは、こうなることがあります。", "ko": "파일을 천천히 읽고 있습니다. 파일이 USB 메모리, 외장 디스크 또는 컴퓨터가 먼저 내려받아야 하는 클라우드 폴더에 있을 때 이렇게 됩니다."},
    "whyS": {"en": "Files without a shooting location: {n}. Why", "ru": "Файлы без места съёмки: {n}. Почему", "cs": "Soubory bez místa pořízení: {n}. Proč", "de": "Dateien ohne Aufnahmeort: {n}. Warum", "fr": "Fichiers sans lieu de prise de vue : {n}. Pourquoi", "es": "Archivos sin lugar de captura: {n}. Por qué", "it": "File senza luogo di scatto: {n}. Perché", "pt": "Arquivos sem local da captura: {n}. Por quê", "ja": "撮影場所のないファイル：{n}。理由", "ko": "촬영 장소가 없는 파일: {n}. 이유"},
    "whyCam": {"en": "The camera did not record the place: {n}. Either the camera has no GPS, or location recording was turned off in its settings:", "ru": "Камера не записала место — {n}. У камеры нет GPS, или запись места была выключена в её настройках:", "cs": "Fotoaparát místo nezaznamenal — {n}. Fotoaparát nemá GPS, nebo bylo ukládání polohy v jeho nastavení vypnuté:", "de": "Die Kamera hat den Ort nicht gespeichert: {n}. Die Kamera hat kein GPS, oder die Ortsaufzeichnung war in ihren Einstellungen ausgeschaltet:", "fr": "L’appareil n’a pas enregistré le lieu : {n}. Il n’a pas de GPS, ou l’enregistrement du lieu était désactivé dans ses réglages :", "es": "La cámara no registró el lugar: {n}. La cámara no tiene GPS o el registro de ubicación estaba desactivado en sus ajustes:", "it": "La fotocamera non ha registrato il luogo: {n}. Non ha il GPS, oppure la registrazione della posizione era disattivata nelle sue impostazioni:", "pt": "A câmera não registrou o local: {n}. A câmera não tem GPS ou o registro de localização estava desativado nas configurações dela:", "ja": "カメラが撮影場所を記録していません：{n}。GPSのないカメラか、設定で位置情報の記録がオフになっていました：", "ko": "카메라가 장소를 기록하지 않았습니다: {n}. 카메라에 GPS가 없거나 설정에서 위치 기록이 꺼져 있었습니다:"},

    "q1": {"en": "Why do some files have no location?", "ru": "Почему у части файлов нет места съёмки?", "cs": "Proč některé soubory nemají místo pořízení?", "de": "Warum haben manche Dateien keinen Aufnahmeort?", "fr": "Pourquoi certains fichiers n’ont-ils pas de lieu de prise de vue ?", "es": "¿Por qué algunos archivos no tienen lugar de captura?", "it": "Perché alcuni file non hanno il luogo di scatto?", "pt": "Por que alguns arquivos não têm local de captura?", "ja": "撮影場所がないファイルがあるのはなぜですか？", "ko": "일부 파일에 촬영 위치가 없는 이유는 무엇인가요?"},
    "a1": {"en": "The phone or camera records the location at the moment of shooting, and only if location is turned on. Often it is erased later: messengers and social networks remove it when files are sent, files saved from the internet or after an editor lose it, and some cloud services strip it when they pass files to other apps or share them by link. Google Photos, for example, does not give the location to other apps; a full Google Takeout export keeps it, and this page reads it from the .json files next to the photos. Screenshots and pictures never have a location.", "ru": "Место записывает телефон или фотоаппарат в момент съёмки, и только если у него включена геолокация. Часто оно стирается потом: мессенджеры и соцсети удаляют его при пересылке, его теряют файлы после редактора и сохранённые из интернета, а некоторые облачные сервисы вырезают его, когда передают файлы другим программам или по ссылке. Google Фото, например, не отдаёт место съёмки другим программам; полная выгрузка через Google Takeout его сохраняет, и страница читает место из файлов .json рядом со снимками. В снимках экрана и картинках места не бывает.", "cs": "Místo zapisuje telefon nebo fotoaparát v okamžiku pořízení, a jen když má zapnutou polohu. Často se pak smaže: messengery a sociální sítě ho při odesílání odstraní, soubory po úpravě v editoru nebo uložené z internetu ho ztrácejí a některé cloudové služby ho odstraňují, když soubory předávají jiným aplikacím nebo sdílejí odkazem. Například Fotky Google místo pořízení jiným aplikacím nepředávají; úplný export přes Google Takeout ho zachová a tato stránka ho čte ze souborů .json vedle snímků. Snímky obrazovky a obrázky místo nemají nikdy.", "de": "Den Aufnahmeort speichert das Telefon oder die Kamera beim Aufnehmen, und zwar nur, wenn die Standortfunktion eingeschaltet ist. Oft wird er danach gelöscht: Messenger und soziale Netzwerke entfernen ihn beim Versenden, bearbeitete oder aus dem Internet gespeicherte Dateien verlieren ihn, und manche Cloud-Dienste entfernen ihn, wenn sie Dateien an andere Apps weitergeben oder per Link teilen. Google Fotos zum Beispiel gibt den Aufnahmeort nicht an andere Apps weiter; ein vollständiger Export über Google Takeout behält ihn, und diese Seite liest ihn aus den .json-Dateien neben den Fotos. Bildschirmfotos und Grafiken haben nie einen Aufnahmeort.", "fr": "Le lieu est enregistré par le téléphone ou l’appareil photo au moment de la prise de vue, et seulement si la localisation est activée. Il est souvent effacé ensuite : les messageries et les réseaux sociaux le suppriment à l’envoi, les fichiers retouchés ou enregistrés depuis Internet le perdent, et certains services de cloud le retirent lorsqu’ils transmettent des fichiers à d’autres applications ou les partagent par lien. Google Photos, par exemple, ne transmet pas le lieu aux autres applications ; un export complet via Google Takeout le conserve, et cette page le lit dans les fichiers .json placés à côté des photos. Les captures d’écran et les images n’ont jamais de lieu.", "es": "El lugar lo graba el teléfono o la cámara en el momento de la foto, y solo si tiene la ubicación activada. A menudo se borra después: las aplicaciones de mensajería y las redes sociales lo eliminan al enviar los archivos, los archivos editados o guardados de internet lo pierden, y algunos servicios en la nube lo quitan cuando pasan archivos a otras aplicaciones o los comparten por enlace. Google Fotos, por ejemplo, no entrega el lugar a otras aplicaciones; una exportación completa con Google Takeout lo conserva, y esta página lo lee de los archivos .json que acompañan a las fotos. Las capturas de pantalla y las imágenes nunca tienen lugar.", "it": "Il luogo viene registrato dal telefono o dalla fotocamera al momento dello scatto, e solo se la localizzazione è attiva. Spesso poi viene cancellato: le app di messaggistica e i social network lo rimuovono durante l’invio, i file modificati o salvati da internet lo perdono e alcuni servizi cloud lo tolgono quando passano i file ad altre app o li condividono tramite link. Google Foto, ad esempio, non fornisce il luogo ad altre app; un’esportazione completa con Google Takeout lo conserva, e questa pagina lo legge dai file .json accanto alle foto. Gli screenshot e le immagini non hanno mai un luogo.", "pt": "O local é gravado pelo celular ou pela câmera no momento da foto, e só se a localização estiver ativada. Muitas vezes ele é apagado depois: os aplicativos de mensagens e as redes sociais o removem ao enviar os arquivos, arquivos editados ou salvos da internet o perdem, e alguns serviços de nuvem o retiram ao passar arquivos para outros aplicativos ou compartilhá-los por link. O Google Fotos, por exemplo, não entrega o local a outros aplicativos; uma exportação completa pelo Google Takeout o mantém, e esta página o lê nos arquivos .json ao lado das fotos. Capturas de tela e imagens nunca têm local.", "ja": "撮影場所は、撮影の瞬間にスマートフォンやカメラが記録します。位置情報がオンのときだけです。その後で消えることもよくあります。メッセージアプリやSNSは送信時に場所を削除し、編集したファイルやインターネットから保存したファイルでは場所が失われます。一部のクラウドサービスも、ファイルを他のアプリに渡すときやリンクで共有するときに場所を取り除きます。たとえばGoogleフォトは撮影場所を他のアプリに渡しません。Google Takeoutで全体を書き出すと場所は残り、このページは写真の横にある.jsonファイルから場所を読み取ります。スクリーンショットや画像には場所がありません。", "ko": "촬영 위치는 촬영하는 순간 휴대폰이나 카메라가 기록하며, 위치 기능이 켜져 있을 때만 기록됩니다. 그 뒤에 지워지는 경우도 많습니다. 메신저와 SNS는 파일을 보낼 때 위치를 지우고, 편집한 파일이나 인터넷에서 저장한 파일은 위치를 잃으며, 일부 클라우드 서비스는 파일을 다른 앱에 넘기거나 링크로 공유할 때 위치를 제거합니다. 예를 들어 Google 포토는 촬영 위치를 다른 앱에 넘기지 않습니다. Google 테이크아웃으로 전체를 내보내면 위치가 남아 있으며, 이 페이지는 사진 옆의 .json 파일에서 위치를 읽습니다. 스크린샷과 이미지에는 위치가 없습니다."},
    "q2": {"en": "Are my photos uploaded anywhere?", "ru": "Снимки куда-нибудь загружаются?", "cs": "Nahrávají se moje snímky někam?", "de": "Werden meine Fotos irgendwohin hochgeladen?", "fr": "Mes photos sont-elles envoyées quelque part ?", "es": "¿Se suben mis fotos a algún sitio?", "it": "Le mie foto vengono caricate da qualche parte?", "pt": "Minhas fotos são enviadas para algum lugar?", "ja": "写真はどこかにアップロードされますか？", "ko": "사진이 어딘가에 업로드되나요?"},
    "a2": {"en": "No. The page reads only the place and time of shooting and the camera model; the photos and videos themselves stay on your computer.", "ru": "Нет. Страница читает в файлах только место и время съёмки и модель камеры; сами снимки и видео остаются на компьютере.", "cs": "Ne. Stránka čte v souborech jen místo a čas pořízení a model fotoaparátu; samotné snímky a videa zůstávají v počítači.", "de": "Nein. Die Seite liest in den Dateien nur Aufnahmeort, Aufnahmezeit und Kameramodell; die Fotos und Videos selbst bleiben auf Ihrem Computer.", "fr": "Non. La page ne lit dans les fichiers que le lieu et l’heure de prise de vue et le modèle d’appareil ; les photos et vidéos restent sur votre ordinateur.", "es": "No. La página solo lee en los archivos el lugar y la hora de la toma y el modelo de cámara; las fotos y los vídeos se quedan en tu ordenador.", "it": "No. La pagina legge nei file solo il luogo e l’ora dello scatto e il modello della fotocamera; foto e video restano sul Suo computer.", "pt": "Não. A página lê nos arquivos só o local e a hora da foto e o modelo da câmera; as fotos e os vídeos ficam no seu computador.", "ja": "いいえ。ページがファイルから読むのは撮影場所・撮影時刻・カメラの機種だけで、写真や動画そのものはパソコンに残ります。", "ko": "아니요. 페이지는 파일에서 촬영 장소와 시간, 카메라 모델만 읽으며, 사진과 동영상은 컴퓨터에 그대로 남습니다."},
    "q3": {"en": "Where is the result stored?", "ru": "Где хранится итог?", "cs": "Kde se výsledek ukládá?", "de": "Wo wird das Ergebnis gespeichert?", "fr": "Où le résultat est-il conservé ?", "es": "¿Dónde se guarda el resultado?", "it": "Dove viene conservato il risultato?", "pt": "Onde o resultado fica guardado?", "ja": "結果はどこに保存されますか？", "ko": "결과는 어디에 보관되나요?"},
    "a3": {"en": "In this browser: it stays when you close the page. Right after the analysis, the places and times are also kept on our server without an account for 30 days. A saved result is kept in your account.", "ru": "В этом браузере: закроете страницу — он останется. Сразу после разбора место и время сохраняются и на нашем сервере без учётной записи, на 30 дней. Сохранённый итог хранится в вашей учётной записи.", "cs": "V tomto prohlížeči: když stránku zavřete, zůstane. Hned po analýze se místa a časy uloží i na náš server bez účtu, na 30 dní. Uložený výsledek je ve vašem účtu.", "de": "In diesem Browser: Es bleibt erhalten, wenn Sie die Seite schließen. Gleich nach der Auswertung werden Orte und Zeiten auch ohne Konto für 30 Tage auf unserem Server gespeichert. Ein gespeichertes Ergebnis liegt in Ihrem Konto.", "fr": "Dans ce navigateur : il reste quand vous fermez la page. Juste après l’analyse, les lieux et les heures sont aussi conservés sur notre serveur sans compte, pendant 30 jours. Un résultat enregistré est conservé dans votre compte.", "es": "En este navegador: se conserva aunque cierres la página. Justo después del análisis, los lugares y las horas también se guardan en nuestro servidor sin cuenta durante 30 días. Un resultado guardado se conserva en tu cuenta.", "it": "In questo browser: resta anche se chiude la pagina. Subito dopo l’analisi luoghi e orari vengono conservati anche sul nostro server senza account, per 30 giorni. Un risultato salvato resta nel Suo account.", "pt": "Neste navegador: ele continua lá quando você fecha a página. Logo após a análise, os locais e horários também ficam no nosso servidor sem conta, por 30 dias. Um resultado salvo fica na sua conta.", "ja": "このブラウザーです。ページを閉じても残ります。分析の直後には、場所と時刻がアカウントなしで当社のサーバーにも30日間保存されます。保存した結果はアカウントに保管されます。", "ko": "이 브라우저에 보관되며, 페이지를 닫아도 남아 있습니다. 분석 직후에는 장소와 시간이 계정 없이 저희 서버에도 30일 동안 저장됩니다. 저장한 결과는 계정에 보관됩니다."},
    "q4": {"en": "How do I move the result to my phone?", "ru": "Как перенести итог на телефон?", "cs": "Jak výsledek přenést do telefonu?", "de": "Wie übertrage ich das Ergebnis auf mein Telefon?", "fr": "Comment transférer le résultat sur mon téléphone ?", "es": "¿Cómo paso el resultado a mi teléfono?", "it": "Come trasferisco il risultato sul telefono?", "pt": "Como passo o resultado para o celular?", "ja": "結果をスマートフォンに移すには？", "ko": "결과를 휴대폰으로 옮기려면?"},
    "a4": {"en": "Press “Move to my phone” and sign in with Google. Then install the app and sign in with the same Google account: the app will offer to add the result to your collection.", "ru": "Нажмите «Перенести на телефон» и войдите через Google. Затем установите приложение и войдите в нём с той же учётной записью Google: приложение предложит добавить итог в коллекцию.", "cs": "Stiskněte „Přenést do telefonu“ a přihlaste se přes Google. Pak nainstalujte aplikaci a přihlaste se v ní stejným účtem Google: aplikace nabídne přidat výsledek do sbírky.", "de": "Drücken Sie „Aufs Telefon übertragen“ und melden Sie sich mit Google an. Installieren Sie dann die App und melden Sie sich dort mit demselben Google-Konto an: Die App bietet an, das Ergebnis Ihrer Sammlung hinzuzufügen.", "fr": "Appuyez sur « Transférer sur mon téléphone » et connectez-vous avec Google. Installez ensuite l’application et connectez-vous avec le même compte Google : elle proposera d’ajouter le résultat à votre collection.", "es": "Pulsa «Pasar a mi teléfono» e inicia sesión con Google. Luego instala la aplicación e inicia sesión con la misma cuenta de Google: la aplicación te ofrecerá añadir el resultado a tu colección.", "it": "Prema «Trasferisci sul telefono» e acceda con Google. Poi installi l’app e acceda con lo stesso account Google: l’app Le proporrà di aggiungere il risultato alla collezione.", "pt": "Toque em “Passar para o celular” e entre com o Google. Depois instale o aplicativo e entre com a mesma conta do Google: o aplicativo vai oferecer adicionar o resultado à sua coleção.", "ja": "「スマートフォンに移す」を押してGoogleでログインします。次にアプリをインストールし、同じGoogleアカウントでログインすると、結果をコレクションに加えるよう案内されます。", "ko": "‘휴대폰으로 옮기기’를 누르고 Google로 로그인하세요. 그런 다음 앱을 설치하고 같은 Google 계정으로 로그인하면 앱이 결과를 컬렉션에 추가하도록 안내합니다."},
    "q5": {"en": "Why are there fewer points than photos?", "ru": "Почему точек меньше, чем снимков?", "cs": "Proč je bodů méně než snímků?", "de": "Warum gibt es weniger Punkte als Fotos?", "fr": "Pourquoi y a-t-il moins de points que de photos ?", "es": "¿Por qué hay menos puntos que fotos?", "it": "Perché ci sono meno punti che foto?", "pt": "Por que há menos pontos do que fotos?", "ja": "地点の数が写真より少ないのはなぜですか？", "ko": "왜 사진보다 지점이 적나요?"},
    "a5": {"en": "A series of shots by one device within 150 m and 20 minutes counts as one point.", "ru": "Серия снимков одного устройства в пределах 150 м и 20 минут считается одной точкой.", "cs": "Série snímků jednoho zařízení v okruhu 150 m a během 20 minut se počítá jako jeden bod.", "de": "Eine Serie von Aufnahmen eines Geräts innerhalb von 150 m und 20 Minuten zählt als ein Punkt.", "fr": "Une série de prises de vue d’un même appareil dans un rayon de 150 m et en 20 minutes compte comme un seul point.", "es": "Una serie de fotos de un mismo dispositivo dentro de 150 m y 20 minutos cuenta como un solo punto.", "it": "Una serie di scatti dello stesso dispositivo entro 150 m e 20 minuti conta come un solo punto.", "pt": "Uma série de fotos de um mesmo aparelho dentro de 150 m e 20 minutos conta como um único ponto.", "ja": "同じ機器で150 m以内・20分以内に撮った一連の写真は、1つの地点として数えます。", "ko": "한 기기로 150 m 이내, 20분 이내에 찍은 연속 사진은 하나의 지점으로 셉니다."},
    "q6": {"en": "Which files can I choose?", "ru": "Какие файлы подходят?", "cs": "Které soubory se hodí?", "de": "Welche Dateien eignen sich?", "fr": "Quels fichiers puis-je choisir ?", "es": "¿Qué archivos sirven?", "it": "Quali file posso scegliere?", "pt": "Quais arquivos servem?", "ja": "どのファイルが使えますか？", "ko": "어떤 파일을 고를 수 있나요?"},
    "a6": {"en": "Photos and videos (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), a Google location history export and route files GPX, KML, TCX and GeoJSON. Choose folders rather than the whole disk: the browser takes a very long time to list every file on a disk.", "ru": "Фотографии и видео (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), выгрузка истории местоположений Google и файлы маршрута GPX, KML, TCX и GeoJSON. Выбирайте папки, а не весь диск: список всех файлов диска браузер собирает очень долго.", "cs": "Fotografie a videa (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), export historie polohy Google a soubory trasy GPX, KML, TCX a GeoJSON. Vybírejte složky, ne celý disk: seznam všech souborů disku prohlížeč sestavuje velmi dlouho.", "de": "Fotos und Videos (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), ein Export des Google-Standortverlaufs und Routendateien GPX, KML, TCX und GeoJSON. Wählen Sie Ordner statt der ganzen Festplatte: Die Liste aller Dateien einer Festplatte stellt der Browser sehr lange zusammen.", "fr": "Photos et vidéos (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), un export de l’historique des positions Google et des fichiers d’itinéraire GPX, KML, TCX et GeoJSON. Choisissez des dossiers plutôt que tout le disque : le navigateur met très longtemps à lister tous les fichiers d’un disque.", "es": "Fotos y vídeos (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), una exportación del historial de ubicaciones de Google y archivos de ruta GPX, KML, TCX y GeoJSON. Elige carpetas, no el disco entero: el navegador tarda mucho en listar todos los archivos de un disco.", "it": "Foto e video (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), un’esportazione della cronologia delle posizioni di Google e file di percorso GPX, KML, TCX e GeoJSON. Scelga cartelle, non l’intero disco: il browser impiega molto tempo a elencare tutti i file di un disco.", "pt": "Fotos e vídeos (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), uma exportação do histórico de localização do Google e arquivos de trajeto GPX, KML, TCX e GeoJSON. Escolha pastas, não o disco inteiro: o navegador demora muito para listar todos os arquivos de um disco.", "ja": "写真と動画（JPEG、HEIC、PNG、WebP、MP4、MOV、RAW）、Googleのロケーション履歴のエクスポート、ルートファイル（GPX、KML、TCX、GeoJSON）です。ディスク全体ではなくフォルダーを選んでください。ディスク全体のファイル一覧を作るにはブラウザーがとても時間をかけます。", "ko": "사진과 동영상(JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), Google 위치 기록 내보내기, 경로 파일 GPX, KML, TCX, GeoJSON입니다. 디스크 전체가 아니라 폴더를 고르세요. 디스크의 모든 파일 목록을 만드는 데 브라우저가 아주 오래 걸립니다."},
    "q7": {"en": "What is saved together with the points?", "ru": "Что сохраняется вместе с точками?", "cs": "Co se ukládá spolu s body?", "de": "Was wird zusammen mit den Punkten gespeichert?", "fr": "Qu’est-ce qui est enregistré avec les points ?", "es": "¿Qué se guarda junto con los puntos?", "it": "Che cosa viene salvato insieme ai punti?", "pt": "O que é salvo junto com os pontos?", "ja": "地点と一緒に何が保存されますか？", "ko": "지점과 함께 무엇이 저장되나요?"},
    "a7": {"en": "The camera model and folder names: they show which device took what, and any device can be deleted from the result.", "ru": "Модель камеры и названия папок: по ним видно, какое устройство что сняло, и любое устройство можно удалить из итога.", "cs": "Model fotoaparátu a názvy složek: je z nich vidět, co které zařízení nasnímalo, a kterékoli zařízení lze z výsledku odstranit.", "de": "Das Kameramodell und die Ordnernamen: Daran ist zu sehen, welches Gerät was aufgenommen hat, und jedes Gerät lässt sich aus dem Ergebnis löschen.", "fr": "Le modèle d’appareil et le nom des dossiers : on voit ainsi quel appareil a pris quoi, et chaque appareil peut être supprimé du résultat.", "es": "El modelo de cámara y los nombres de las carpetas: con ellos se ve qué dispositivo tomó qué, y cualquier dispositivo se puede eliminar del resultado.", "it": "Il modello della fotocamera e i nomi delle cartelle: mostrano quale dispositivo ha scattato cosa, e qualsiasi dispositivo si può eliminare dal risultato.", "pt": "O modelo da câmera e os nomes das pastas: por eles se vê qual aparelho fez o quê, e qualquer aparelho pode ser excluído do resultado.", "ja": "カメラの機種とフォルダー名です。どの機器で何を撮ったかがわかり、どの機器も結果から削除できます。", "ko": "카메라 모델과 폴더 이름입니다. 어느 기기가 무엇을 찍었는지 알 수 있고, 어떤 기기든 결과에서 삭제할 수 있습니다."},
