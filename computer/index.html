<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Открыта для поиска (21.11.2026, Андрей); описание — на языке страницы: сборка ставит английское, сценарий меняет. -->
<meta name="description" content="We will check the media files on your computer and show the statistics of your life: the countries, regions and cities you have visited. The files themselves are not viewed and never leave your device: only their metadata are collected, above all the place and time of shooting. We value your privacy.">
<title>Tabi</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/site.css?v=c402b2d950">
<script src="/assets/account.js?v=e4ceba3c72"></script>
<script>
// Тема и язык — до первой отрисовки, чтобы страница не мигала (17.11.2026).
(function () { try { var th = localStorage.getItem("tabiTheme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {} })();
</script>
<style>
body{min-height:100vh;background:var(--glow),radial-gradient(800px 520px at 0% 100%,var(--accent-soft) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.pc-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
/* Навигация сайта (20.11.2026, Андрей): две вкладки — главная и эта страница; на узком экране — меню. */
nav.sections+.pc-tools{margin-left:22px}
details.menu{display:none}
@media (max-width:1100px){nav.sections+.pc-tools{margin-left:auto}details.menu{display:block}}
/* Узкий экран: у меню и языка — только значки, шапка в одну строку без прокрутки вбок. */
@media (max-width:560px){#menuLbl,#langCur{display:none}.pc-tools{gap:8px}}
/* Итог выбора — плитками (20.11.2026, Андрей: строка была технической). */
.pc-run{display:grid;gap:8px}
.pc-run .hd{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.pc-run .tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-run .tl div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.pc-run .tl b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.pc-run .tl span{font-size:12.5px;color:var(--sub)}
.pc-run .tl div.new{border-color:var(--accent)}
.pc-run .tl div.new b{color:var(--accent)}
.pc-run .why0{font-size:14px;color:var(--sub);margin:0}
.pc-theme{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.pc-theme .ic{width:19px;height:19px}
details.lang li button{all:unset;display:block;box-sizing:border-box;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;cursor:pointer}
details.lang li button:hover,details.lang li button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.pc{max-width:1320px;margin:0 auto;padding:28px 20px 56px}
.pc-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:20px;align-items:start;transition:grid-template-columns .4s ease}
/* Вступительный блок — 640 точек (21.11.2026, Андрей: чуть уже 720, но русский заголовок — одной строкой; заголовок
   550 точек, поля по 26 — запас 36). С результатом блок шире. */
.pc-grid.idle{grid-template-columns:minmax(0,640px);justify-content:center}
.pc-grid.idle .pc-side{display:none}
.pc-card{background:var(--panel);border-radius:24px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-main{display:grid;gap:16px}
.pc-main h1{font-size:clamp(26px,2.6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0}
.pc-main h2{font-size:20px;margin:0;letter-spacing:-.01em}
.pc-lead{color:var(--sub);margin:0}
.pc-side{max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;display:grid;gap:12px;align-content:start}
/* Полосы прокрутки боковых списков — в цветах сайта (18.11.2026, Андрей: белые полосы выглядели чужими). */
.pc-side{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc-side::-webkit-scrollbar{width:8px}
.pc-side::-webkit-scrollbar-track{background:transparent;margin:18px 0}
.pc-side::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid var(--panel)}
.pc-side::-webkit-scrollbar-thumb:hover{background:var(--sub)}
.pc-side h2,.pc-route h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.pc-count{color:var(--sub);font-weight:700;margin-left:6px}
.pc-btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%;text-align:center;text-decoration:none;display:block;box-sizing:border-box}
.pc-btn.b2{background:var(--bg2);color:var(--ink)}
.pc-btn:disabled{opacity:.55;cursor:default}
.pc-btn.sm{width:auto;display:inline-block;padding:10px 18px;font-size:14.5px}
.pc-end{display:flex;justify-content:flex-start;margin-top:20px}
/* Окна — общий элемент сайта (dialog.win в assets/site.css, 21.11.2026); здесь — только своё. */
dialog.win .pc-row{margin-top:20px}
dialog.win.pc-res{width:min(600px,calc(100vw - 32px))}
dialog.win.pc-res[open]{display:grid;gap:16px}
dialog.win.pc-res h3{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:700}
/* Окно выбора (21.11.2026, Андрей): тезисы белыми точками, затем две кнопки — папка или файлы. */
#pickDlg{width:min(600px,calc(100vw - 32px))}
.pc-pick{margin:4px 0 0;padding:0 0 0 20px;display:grid;gap:10px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.pc-pick li::marker{color:var(--ink)}
/* Плитки чисел окна итога, особых мест и строки итога (21.11.2026, план Андрея: число никогда не выходит за плитку): число
   не переносится; плитка не уже своего числа и подписи; не помещается строка — плитки переходят на следующую. */
.pc-res-tl{display:flex;flex-wrap:wrap;gap:8px}
.pc-res-tl div{flex:1 1 104px;min-width:min-content;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.pc-res-tl b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.pc-res-tl span{font-size:12.5px;color:var(--sub)}
.pc-res-tl .new{border-color:var(--accent)}.pc-res-tl .new b{color:var(--accent)}
.pc-res-cc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pc-res-cc span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:650;font-size:14.5px}
.pc-res-cc img{width:26px;height:18px;object-fit:cover;border-radius:4px}
.pc-app{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.pc-qr{width:128px;height:128px;padding:10px;background:#fff;border-radius:14px;border:0;appearance:none;cursor:zoom-in;display:block;box-sizing:content-box}
.pc-qr:hover,.pc-qr:focus-visible{box-shadow:0 0 0 3px var(--accent);outline:none}
.pc-qr.big{width:auto;height:auto;aspect-ratio:1;padding:16px;cursor:default;margin-top:14px}
.pc-qr.big:hover{box-shadow:none}
.pc-qr svg{width:100%;height:100%;display:block}
.pc-steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.45;color:var(--ink)}
.pc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc-in{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.pc-s{color:var(--sub);font-size:14px;line-height:1.45;margin:0}
.pc-t{color:var(--ink);font-size:15.5px;line-height:1.5;margin:0}
.pc-e{color:var(--accent);font-size:14.5px;line-height:1.45;font-weight:600}
.pc-chk{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink);cursor:pointer}
.pc-chk input{width:18px;height:18px;accent-color:var(--accent)}
.pc-box{display:grid;gap:10px;padding:18px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.pc-devs{display:grid;gap:12px}
.pc-dev{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.pc-dev .bd{display:grid;gap:2px;min-width:0}
.pc-dev .pc-btn.sm{padding:7px 14px;font-size:13.5px}
.pc-dev:first-child{padding-top:0;border-top:0}
.pc-dev .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pc-dev .nm{font-weight:700;overflow-wrap:anywhere}
.pc-dev .n{color:var(--sub);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-dev .ln{color:var(--sub);font-size:14px;line-height:1.4}
/* Удалённые устройства (21.11.2026, план Андрея): 30 дней их можно вернуть; строка-переключатель, список свёрнут. */
.pc-trash{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pc-trash>button{appearance:none;background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:14px;color:var(--sub);text-align:left;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.pc-trash>button:hover{color:var(--ink)}
.pc-trash .pc-dev:first-child{padding-top:0;border-top:0}
.pc-signin{display:grid;gap:10px;margin:14px 0}
.pc-drop{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--sub);font-size:14px}
.pc-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden}.pc-bar>div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.pc-bar.wait>div{width:30%!important;animation:pcWait 1.4s ease-in-out infinite}
@keyframes pcWait{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
/* Строка хода не дёргается: цифры одной ширины (18.11.2026, Андрей). */
#prog,#eta{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Срок — справа в строке хода (21.11.2026, Андрей: отдельной строкой он растягивал карточку). */
.pc-progrow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;min-width:0}
.pc-progrow #prog{flex:1;min-width:0}
.pc-progrow #eta{flex:none}
.pc-why summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14.5px;list-style:none}
.pc-why summary::-webkit-details-marker{display:none}
/* Без стрелок-шевронов (правило Андрея): строка-переключатель подчёркнута. */
.pc-why summary{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.pc-why ul{margin:8px 0 0;padding:0 0 0 18px;display:grid;gap:6px;font-size:14px;color:var(--sub);line-height:1.45}
.pc-why li b{color:var(--ink);font-weight:650}
.pc-when{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;min-height:1.1em}
.pc-when:empty{display:none}
/* Строка итога: плитки равны, пока числа помещаются; длинному числу (километры) его плитка шире ровно настолько, насколько
   ему нужно, соседние — уже, до своей подписи. Во время счёта ширину держит невидимое конечное число (.sz), и плитка не
   растёт рывком с каждой новой цифрой. */
.pc-stats{display:flex;flex-wrap:wrap;gap:10px}
.pc-stat{flex:1 1 0;min-width:min-content;background:var(--bg);border-radius:14px;padding:10px 12px;border:1px solid var(--line);text-align:center}
.pc-stat>b{display:grid;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.pc-stat>b>span{grid-area:1/1}
.pc-stat>b>.sz{visibility:hidden}
.pc-stat>span{font-size:12.5px;color:var(--sub);line-height:1.25;display:block}
.pc-list{display:grid;gap:8px}
.pc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both}
.pc-item img{width:34px;height:24px;object-fit:cover;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pc-item .nm{font-weight:700;line-height:1.25}
.pc-item .dt{color:var(--sub);font-size:12.5px}
.pc-regs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pc-regs span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;animation:pcIn .45s ease both}
.pc-city{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both;min-width:0}
.pc-city .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.pc-city .cc{color:var(--sub);font-size:12.5px;white-space:nowrap;flex:none}
.pc-route{margin-top:20px;display:grid;gap:12px}
/* Под картой — две половины (20.11.2026, Андрей: устройства — левая половина, правая пока пуста). */
.pc-under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pc-under.idle{grid-template-columns:minmax(0,640px);justify-content:center}
/* Особые места по редкости (20.11.2026, Андрей): полоса долей и плитки; нажатие — сколько таких на всей карте. */
.pc-tiers{display:flex;flex-wrap:wrap;gap:8px}
.pc-tier{flex:1 1 96px;min-width:min-content;border:1px solid var(--line);border-radius:14px;padding:12px 10px 9px;background:var(--bg);color:var(--ink);display:grid;gap:2px;position:relative;overflow:hidden;appearance:none;font:inherit;text-align:left;cursor:pointer;transition:border-color .15s}
.pc-tier:hover,.pc-tier:focus-visible{border-color:var(--tc);outline:none}
/* Окно редкости (22.11.2026, слово Андрея): полоса цвета редкости сверху, как у плитки. */
dialog.win.pc-tw{width:min(480px,calc(100vw - 32px));overflow:hidden}
dialog.win.pc-tw[open]{display:grid;gap:12px}
dialog.win.pc-tw::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tc)}
dialog.win.pc-qrw{width:min(400px,calc(100vw - 32px))}
/* «Позже» убирает блок особых мест плавно; кнопка «Перенести на телефон» под «Устройствами» его возвращает. */
#vApp:not([hidden]),#bToPhone:not([hidden]){animation:pcIn .35s ease both}
#vApp.pc-leave{animation:pcOut .25s ease forwards}
/* Кнопки рядом с кодом — одна под другой: подписи не переносятся ни на одном языке. */
#vApp .pc-row{grid-template-columns:minmax(0,1fr);gap:10px}
#doneRow .pc-btn[hidden]{display:none}
#doneRow:has(#bCard[hidden]){grid-template-columns:minmax(0,1fr)}
.pc-col{display:grid;gap:14px;align-content:start;min-width:0}
.pc-col:not(:has(>:not([hidden]))){display:none}
.pc-tier::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.pc-tier b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.pc-tier span{font-size:12.5px;color:var(--sub)}
/* Вопросы и ответы (21.11.2026, Андрей): новому человеку их не вываливают — небольшой блок, по нажатию окно. */
.pc-qa{appearance:none;margin-top:20px;display:flex;align-items:center;gap:12px;width:100%;padding:18px 22px;font:inherit;font-weight:700;font-size:16px;color:var(--ink);text-align:left;cursor:pointer}
.pc-qa:hover{border-color:var(--accent)}
.pc-qa .ic{color:var(--accent)}
.pc-map{position:relative;border-radius:16px;overflow:hidden;background:var(--bg)}
.pc-map canvas{width:100%;height:clamp(420px,62vh,720px);display:block;touch-action:none;cursor:grab}
.pc-map canvas.drag{cursor:grabbing}
.pc-zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.pc-zoom button{appearance:none;border:1px solid var(--line);width:38px;height:38px;border-radius:12px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:21px;font-weight:700;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.pc-link{color:var(--accent);font-weight:700;font-size:15px;text-decoration:none}.pc-link:hover{text-decoration:underline}
.pc-zoom button svg{width:18px;height:18px}
.pc-tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.pc-tip b{display:block;font-weight:700}
.pc-legend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.pc-legend i{flex:1;max-width:320px;height:8px;border-radius:999px}
/* Профессиональный режим (22.11.2026, слово Андрея): карта на всё окно и панель работы со своими точками. */
html.pc-pro-on,html.pc-pro-on body{overflow:hidden}
.pc-pro{position:fixed;inset:0;z-index:1000;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);background:var(--bg)}
.pc-pro[hidden]{display:none}
.pc-pro-side{overflow:auto;overscroll-behavior:contain;padding:0 18px 28px;display:flex;flex-direction:column;gap:20px;background:var(--panel);border-right:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc-pro-hd{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.pc-pro-hd h2{margin:0;font-size:19px}
.pc-pro-x{appearance:none;border:1px solid var(--line);width:36px;height:36px;border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.pc-pro-x svg{width:18px;height:18px}
.pc-pro-side section{display:grid;gap:10px;padding:0;margin:0;max-width:none;border:0;background:none}
.pc-pro-side section[hidden],.pc-pro-side [hidden]{display:none}
.pc-pro-side h3{margin:0;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);font-weight:700}
.pc-pro-map{position:relative;min-width:0;min-height:0}
.pc-pro-map .pc-map{position:absolute;inset:0;border-radius:0}
.pc-pro-map .pc-map canvas{height:100%}
.pc-pro-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc-pro-st div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.pc-pro-st b{display:block;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pc-pro-st span{font-size:12px;color:var(--sub)}
.pc-pro-list{display:grid;gap:7px;max-height:236px;overflow:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc-pro-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.pc-pro-row.nb{cursor:default}
.pc-pro-row input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.pc-pro-row img{width:20px;height:14px;border-radius:3px;object-fit:cover;vertical-align:-2px;box-shadow:0 0 0 1px var(--line)}
.pc-pro-row .nm img{display:inline-block;margin-right:7px}
.pc-pro-row>span>img{display:block}
.pc-pro-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-pro-row .n{color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
.pc-pro-selb{display:grid;gap:10px}
.pc-pro-file{appearance:none;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;padding:7px 0 0;display:grid;gap:1px;cursor:pointer;min-width:0}

    "lead": {"en": "We will check the media files on your computer and show the statistics of your life: the countries, regions and cities you have visited. The files themselves are not viewed and never leave your device: only their metadata are collected, above all the place and time of shooting. We value your privacy.", "ru": "Мы проверим медиафайлы на вашем компьютере и покажем статистику вашей жизни: страны, регионы и города, в которых вы побывали. Сами файлы не просматриваются и не покидают ваше устройство: собираются только их метаданные — прежде всего место и время съёмки. Мы ценим вашу приватность.", "cs": "Zkontrolujeme mediální soubory ve vašem počítači a ukážeme statistiku vašeho života: země, regiony a města, která jste navštívili. Samotné soubory se neprohlížejí a vaše zařízení neopouštějí: shromažďují se jen jejich metadata — především místo a čas pořízení. Vaše soukromí je pro nás důležité.", "de": "Wir prüfen die Mediendateien auf Ihrem Computer und zeigen Ihnen die Statistik Ihres Lebens: die Länder, Regionen und Städte, in denen Sie waren. Die Dateien selbst werden nicht angesehen und verlassen Ihr Gerät nicht: Erfasst werden nur ihre Metadaten – vor allem Aufnahmeort und Aufnahmezeit. Ihre Privatsphäre ist uns wichtig.", "fr": "Nous vérifions les fichiers multimédias de votre ordinateur et vous montrons les statistiques de votre vie : les pays, régions et villes que vous avez visités. Les fichiers eux-mêmes ne sont pas consultés et ne quittent pas votre appareil : seules leurs métadonnées sont collectées, avant tout le lieu et l’heure de prise de vue. Nous respectons votre vie privée.", "es": "Revisaremos los archivos multimedia de tu ordenador y te mostraremos la estadística de tu vida: los países, regiones y ciudades que has visitado. Los archivos no se visualizan ni salen de tu dispositivo: solo se recogen sus metadatos, sobre todo el lugar y la hora de la toma. Valoramos tu privacidad.", "it": "Controlleremo i file multimediali sul Suo computer e Le mostreremo le statistiche della Sua vita: i paesi, le regioni e le città che ha visitato. I file non vengono visualizzati e non lasciano il Suo dispositivo: si raccolgono solo i loro metadati, soprattutto il luogo e l’ora dello scatto. Teniamo alla Sua privacy.", "pt": "Vamos verificar os arquivos de mídia do seu computador e mostrar a estatística da sua vida: os países, regiões e cidades que você visitou. Os arquivos em si não são visualizados e não saem do seu dispositivo: são coletados apenas os metadados deles, sobretudo o local e a hora da captura. Valorizamos a sua privacidade.", "ja": "パソコン内のメディアファイルを確認し、あなたの人生の統計――訪れた国・地域・都市――をお見せします。ファイルそのものは閲覧されず、お使いの端末の外にも出ません。集められるのはメタデータだけで、主に撮影場所と撮影時刻です。私たちはあなたのプライバシーを大切にしています。", "ko": "컴퓨터에 있는 미디어 파일을 확인해 당신의 삶의 통계, 즉 방문한 국가, 지역, 도시를 보여 드립니다. 파일 자체는 열람되지 않으며 기기 밖으로 나가지 않습니다. 수집되는 것은 메타데이터, 무엇보다 촬영 장소와 시간뿐입니다. 저희는 개인정보를 소중히 여깁니다."},

    "saveX": {"en": "Without signing in, the result is kept only in this browser. Sign in to save it to your account and move it to the Tabi app on your phone.", "ru": "Без входа результат хранится только в этом браузере. Войдите — он сохранится в учётной записи и перенесётся на телефон в приложение Tabi.", "cs": "Bez přihlášení zůstane výsledek jen v tomto prohlížeči. Přihlaste se a uloží se do účtu a přenese do aplikace Tabi v telefonu.", "de": "Ohne Anmeldung bleibt das Ergebnis nur in diesem Browser. Melden Sie sich an, dann wird es in Ihrem Konto gespeichert und in die App Tabi auf Ihrem Telefon übertragen.", "fr": "Sans connexion, le résultat reste uniquement dans ce navigateur. Connectez-vous pour l’enregistrer dans votre compte et le transférer dans l’application Tabi sur votre téléphone.", "es": "Sin iniciar sesión, el resultado se guarda solo en este navegador. Inicia sesión para guardarlo en tu cuenta y pasarlo a la aplicación Tabi en tu teléfono.", "it": "Senza accesso il risultato resta solo in questo browser. Acceda per salvarlo nel Suo account e trasferirlo nell’app Tabi sul telefono.", "pt": "Sem entrar, o resultado fica apenas neste navegador. Entre para salvá-lo na sua conta e passá-lo para o aplicativo Tabi no celular.", "ja": "ログインしない場合、結果はこのブラウザーにだけ保存されます。ログインすると、アカウントに保存され、スマートフォンのTabiアプリに移せます。", "ko": "로그인하지 않으면 결과는 이 브라우저에만 보관됩니다. 로그인하면 계정에 저장되고 휴대폰의 Tabi 앱으로 옮겨집니다."},
    "eLimit": {"en": "Enough points have been saved today. The rest can be saved tomorrow.", "ru": "На сегодня сохранено достаточно точек. Остальное можно сохранить завтра.", "cs": "Pro dnešek je uloženo dost bodů. Zbytek můžete uložit zítra.", "de": "Für heute sind genug Punkte gespeichert. Den Rest können Sie morgen speichern.", "fr": "Assez de points ont été enregistrés aujourd’hui. Le reste pourra l’être demain.", "es": "Por hoy se han guardado suficientes puntos. El resto puedes guardarlo mañana.", "it": "Per oggi sono stati salvati abbastanza punti. Il resto potrà salvarlo domani.", "pt": "Por hoje, já foram salvos pontos suficientes. O restante pode ser salvo amanhã.", "ja": "今日はこれ以上保存できません。残りは明日保存できます。", "ko": "오늘은 충분한 지점이 저장되었습니다. 나머지는 내일 저장할 수 있습니다."},
    "eFull": {"en": "The largest number of points is already waiting to be checked. Open the app on your phone to check them.", "ru": "Наибольшее число точек уже ждёт проверки. Откройте приложение на телефоне, чтобы проверить их.", "cs": "Na kontrolu už čeká největší možný počet bodů. Otevřete aplikaci v telefonu a zkontrolujte je.", "de": "Die größte Zahl an Punkten wartet bereits auf die Prüfung. Öffnen Sie die App auf Ihrem Telefon, um sie zu prüfen.", "fr": "Le nombre maximal de points attend déjà d’être vérifié. Ouvrez l’application sur votre téléphone pour les vérifier.", "es": "Ya hay el número máximo de puntos esperando revisión. Abre la aplicación en tu teléfono para revisarlos.", "it": "Il numero massimo di punti è già in attesa di verifica. Apra l’app sul telefono per verificarli.", "pt": "O número máximo de pontos já aguarda verificação. Abra o aplicativo no celular para verificá-los.", "ja": "確認待ちの地点がすでに上限に達しています。スマートフォンでアプリを開いて確認してください。", "ko": "확인을 기다리는 지점이 이미 최대입니다. 휴대폰에서 앱을 열어 확인하세요."},
    "none": {"en": "None of the chosen files contains a shooting location. Choose another folder.", "ru": "Ни в одном из выбранных файлов нет места съёмки. Выберите другую папку.", "cs": "V žádném z vybraných souborů není místo pořízení. Vyberte jinou složku.", "de": "Keine der gewählten Dateien enthält einen Aufnahmeort. Wählen Sie einen anderen Ordner.", "fr": "Aucun des fichiers choisis ne contient de lieu de prise de vue. Choisissez un autre dossier.", "es": "Ninguno de los archivos elegidos contiene el lugar de captura. Elige otra carpeta.", "it": "Nessuno dei file scelti contiene il luogo di scatto. Scelga un’altra cartella.", "pt": "Nenhum dos arquivos escolhidos contém o local da captura. Escolha outra pasta.", "ja": "選んだファイルのどれにも撮影場所がありません。別のフォルダを選んでください。", "ko": "선택한 파일 중 촬영 장소가 있는 파일이 없습니다. 다른 폴더를 선택하세요."},

    "phoneA": {"en": "Open tabimobile.com/computer on a computer: there you can analyse the media files stored on it. The media files on this phone are analysed by the app.", "ru": "Откройте tabimobile.com/computer на компьютере — там можно разобрать медиафайлы, которые на нём хранятся. Медиафайлы этого телефона разберёт приложение.", "cs": "Otevřete tabimobile.com/computer v počítači — tam lze projít mediální soubory, které jsou v něm uložené. Mediální soubory tohoto telefonu projde aplikace.", "de": "Öffnen Sie tabimobile.com/computer auf einem Computer — dort lassen sich die darauf gespeicherten Mediendateien auswerten. Die Mediendateien dieses Telefons wertet die App aus.", "fr": "Ouvrez tabimobile.com/computer sur un ordinateur : vous pourrez y analyser les fichiers multimédias qu’il contient. Ceux de ce téléphone sont analysés par l’application.", "es": "Abre tabimobile.com/computer en un ordenador: allí puedes analizar los archivos multimedia que guarda. Los de este teléfono los analiza la aplicación.", "it": "Apra tabimobile.com/computer su un computer: lì può analizzare i file multimediali che contiene. Quelli di questo telefono li analizza l’app.", "pt": "Abra tabimobile.com/computer em um computador: lá você pode analisar os arquivos de mídia guardados nele. Os deste celular são analisados pelo aplicativo.", "ja": "パソコンで tabimobile.com/computer を開くと、そこに保存されたメディアファイルを分析できます。このスマートフォンのメディアファイルはアプリが分析します。", "ko": "컴퓨터에서 tabimobile.com/computer를 열면 그 안의 미디어 파일을 분석할 수 있습니다. 이 휴대폰의 미디어 파일은 앱이 분석합니다."},
    "phoneI": {"en": "Open tabimobile.com/computer on a computer to scan the media files kept on it.", "ru": "Откройте tabimobile.com/computer на компьютере — там можно разобрать медиафайлы, которые на нём хранятся.", "cs": "Otevřete tabimobile.com/computer v počítači — tam lze projít mediální soubory, které jsou v něm uložené.", "de": "Öffnen Sie tabimobile.com/computer auf einem Computer, um die dort gespeicherten Mediendateien auszuwerten.", "fr": "Ouvrez tabimobile.com/computer sur un ordinateur pour analyser les fichiers multimédias qui s’y trouvent.", "es": "Abre tabimobile.com/computer en un ordenador para analizar los archivos multimedia que guarda.", "it": "Apra tabimobile.com/computer su un computer per analizzare i file multimediali che vi sono conservati.", "pt": "Abra tabimobile.com/computer em um computador para analisar os arquivos de mídia guardados nele.", "ja": "パソコンでtabimobile.com/computerを開くと、パソコンに保存されたメディアファイルを分析できます。", "ko": "컴퓨터에서 tabimobile.com/computer를 열면 컴퓨터에 저장된 미디어 파일을 분석할 수 있습니다."},

    "q1": {"en": "What data does the site collect, and where is it stored?", "ru": "Какие данные собирает сайт и где они хранятся?", "cs": "Jaká data web shromažďuje a kde jsou uložena?", "de": "Welche Daten erfasst die Website und wo werden sie gespeichert?", "fr": "Quelles données le site collecte-t-il et où sont-elles conservées ?", "es": "¿Qué datos recoge el sitio y dónde se guardan?", "it": "Quali dati raccoglie il sito e dove vengono conservati?", "pt": "Quais dados o site coleta e onde eles ficam guardados?", "ja": "サイトはどんなデータを集め、どこに保存しますか？", "ko": "사이트는 어떤 데이터를 수집하고 어디에 보관하나요?"},
    "a1": {"en": "Media files never leave your computer: the browser reads only their metadata — the place, time and device of shooting.\n\nWithout signing in, the result is kept only in this browser: neither the points nor any data about the files reach our server.\n\nAfter you sign in, the result is kept in your account: it will not be lost, and you can return to it on any computer. You can delete your account together with its data on the account page.\n\nAfter each check, the server also receives an anonymised summary without coordinates, for the site’s statistics. We do not sell your data and do not pass your location or route to advertising networks.", "ru": "Медиафайлы не покидают ваш компьютер: браузер читает в них только метаданные — место, время и устройство съёмки.\n\nБез входа результат проверки хранится только в этом браузере: ни точки, ни сведения о файлах на наш сервер не уходят.\n\nПосле входа результат хранится в вашей учётной записи: он не потеряется, и к нему можно вернуться на любом компьютере. Удалить учётную запись вместе с данными можно на её странице.\n\nПосле каждой проверки сервер получает также обезличенную сводку без координат — для статистики сайта. Мы не продаём ваши данные и не передаём ваше местоположение и маршрут рекламным сетям.", "cs": "Mediální soubory váš počítač neopouštějí: prohlížeč z nich čte jen metadata — místo, čas a zařízení pořízení.\n\nBez přihlášení zůstává výsledek kontroly jen v tomto prohlížeči: na náš server neodcházejí body ani žádné údaje o souborech.\n\nPo přihlášení je výsledek uložen ve vašem účtu: neztratí se a můžete se k němu vrátit na kterémkoli počítači. Účet i s daty můžete smazat na jeho stránce.\n\nPo každé kontrole server dostává také anonymizovaný souhrn bez souřadnic — pro statistiku webu. Vaše data neprodáváme a vaši polohu ani trasu nepředáváme reklamním sítím.", "de": "Mediendateien verlassen Ihren Computer nicht: Der Browser liest nur ihre Metadaten – Ort, Zeit und Gerät der Aufnahme.\n\nOhne Anmeldung bleibt das Ergebnis nur in diesem Browser: Weder Punkte noch Angaben zu den Dateien gelangen auf unseren Server.\n\nNach der Anmeldung wird das Ergebnis in Ihrem Konto gespeichert: Es geht nicht verloren, und Sie können auf jedem Computer darauf zurückgreifen. Ihr Konto samt Daten können Sie auf seiner Seite löschen.\n\nNach jeder Prüfung erhält der Server außerdem eine anonymisierte Zusammenfassung ohne Koordinaten – für die Statistik der Website. Wir verkaufen Ihre Daten nicht und geben Ihren Standort und Ihre Route nicht an Werbenetzwerke weiter.", "fr": "Les fichiers multimédias ne quittent pas votre ordinateur : le navigateur n’y lit que les métadonnées — le lieu, l’heure et l’appareil de prise de vue.\n\nSans connexion, le résultat reste uniquement dans ce navigateur : ni les points ni aucune donnée sur les fichiers n’arrivent sur notre serveur.\n\nAprès connexion, le résultat est conservé dans votre compte : il ne se perdra pas et vous pourrez le retrouver sur n’importe quel ordinateur. Vous pouvez supprimer votre compte avec ses données sur la page du compte.\n\nAprès chaque vérification, le serveur reçoit aussi un résumé anonymisé sans coordonnées, pour les statistiques du site. Nous ne vendons pas vos données et ne transmettons ni votre position ni votre itinéraire aux régies publicitaires.", "es": "Los archivos multimedia no salen de tu ordenador: el navegador solo lee sus metadatos (el lugar, la hora y el dispositivo de la toma).\n\nSin iniciar sesión, el resultado se guarda solo en este navegador: ni los puntos ni ningún dato sobre los archivos llegan a nuestro servidor.\n\nTras iniciar sesión, el resultado se guarda en tu cuenta: no se perderá y podrás volver a él en cualquier ordenador. Puedes eliminar tu cuenta junto con sus datos en la página de la cuenta.\n\nDespués de cada comprobación, el servidor recibe también un resumen anonimizado sin coordenadas, para las estadísticas del sitio. No vendemos tus datos ni cedemos tu ubicación ni tu ruta a redes publicitarias.", "it": "I file multimediali non lasciano il Suo computer: il browser ne legge solo i metadati, cioè il luogo, l’ora e il dispositivo dello scatto.\n\nSenza accesso il risultato resta solo in questo browser: né i punti né alcun dato sui file arrivano al nostro server.\n\nDopo l’accesso il risultato resta nel Suo account: non andrà perso e potrà ritrovarlo su qualsiasi computer. Può eliminare l’account insieme ai dati nella sua pagina.\n\nDopo ogni controllo il server riceve anche un riepilogo anonimizzato senza coordinate, per le statistiche del sito. Non vendiamo i Suoi dati e non cediamo la Sua posizione né il Suo percorso a reti pubblicitarie.", "pt": "Os arquivos de mídia não saem do seu computador: o navegador lê neles apenas os metadados — o local, a hora e o aparelho da captura.\n\nSem entrar na conta, o resultado fica apenas neste navegador: nem os pontos nem nenhum dado sobre os arquivos chegam ao nosso servidor.\n\nDepois de entrar, o resultado fica guardado na sua conta: ele não se perde, e você pode voltar a ele em qualquer computador. Você pode excluir a conta junto com os dados na página da conta.\n\nApós cada verificação, o servidor recebe também um resumo anonimizado sem coordenadas, para as estatísticas do site. Não vendemos os seus dados e não repassamos a sua localização nem o seu trajeto a redes de publicidade.", "ja": "メディアファイルがパソコンの外に出ることはありません。ブラウザーが読み取るのはメタデータ、つまり撮影場所・撮影時刻・撮影機器だけです。\n\nログインしない場合、結果はこのブラウザーにだけ保存され、地点もファイルに関する情報も当社のサーバーには送られません。\n\nログイン後は、結果がアカウントに保存されます。失われることはなく、どのパソコンからでも戻ってこられます。アカウントはデータとともに、アカウントのページで削除できます。\n\n確認のたびに、サーバーは座標を含まない匿名化された集計も受け取ります。サイトの統計のためです。データを販売することはなく、位置情報やルートを広告ネットワークに渡すこともありません。", "ko": "미디어 파일은 컴퓨터 밖으로 나가지 않습니다. 브라우저는 메타데이터, 즉 촬영 장소와 시간, 촬영 기기만 읽습니다.\n\n로그인하지 않으면 결과는 이 브라우저에만 보관되며, 지점도 파일에 관한 어떤 정보도 저희 서버로 보내지지 않습니다.\n\n로그인한 뒤에는 결과가 계정에 보관됩니다. 사라지지 않으며 어느 컴퓨터에서든 다시 볼 수 있습니다. 계정은 데이터와 함께 계정 페이지에서 삭제할 수 있습니다.\n\n확인할 때마다 서버는 좌표가 없는 익명 요약도 받습니다. 사이트 통계를 위한 것입니다. 저희는 데이터를 판매하지 않으며 위치나 경로를 광고 네트워크에 넘기지 않습니다."},
    "q2": {"en": "Which files are suitable?", "ru": "Какие файлы подходят?", "cs": "Jaké soubory jsou vhodné?", "de": "Welche Dateien eignen sich?", "fr": "Quels fichiers conviennent ?", "es": "¿Qué archivos sirven?", "it": "Quali file sono adatti?", "pt": "Quais arquivos servem?", "ja": "どんなファイルが使えますか？", "ko": "어떤 파일이 적합한가요?"},
    "a2": {"en": "Media files (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), Google location history (a Google Takeout or Timeline export) and route files in GPX, KML, TCX and GeoJSON. Only files with a recorded location give a result.", "ru": "Медиафайлы (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), история местоположений Google (выгрузка Google Takeout или «Хронологии») и файлы маршрута GPX, KML, TCX и GeoJSON. Результат дают только файлы, в которых записано место.", "cs": "Mediální soubory (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), historie polohy Google (export z Google Takeout nebo z Časové osy) a soubory trasy GPX, KML, TCX a GeoJSON. Výsledek dávají jen soubory, v nichž je zaznamenáno místo.", "de": "Mediendateien (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), der Google-Standortverlauf (Export aus Google Takeout oder der Zeitachse) und Routendateien im Format GPX, KML, TCX und GeoJSON. Ein Ergebnis liefern nur Dateien, in denen ein Ort gespeichert ist.", "fr": "Les fichiers multimédias (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), l’historique des positions Google (export Google Takeout ou de la Chronologie) et les fichiers d’itinéraire GPX, KML, TCX et GeoJSON. Seuls les fichiers où un lieu est enregistré donnent un résultat.", "es": "Archivos multimedia (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), el historial de ubicaciones de Google (exportación de Google Takeout o de Cronología) y archivos de ruta GPX, KML, TCX y GeoJSON. Solo dan resultado los archivos que tienen el lugar grabado.", "it": "File multimediali (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), la cronologia delle posizioni di Google (esportazione di Google Takeout o della Cronologia) e file di percorso GPX, KML, TCX e GeoJSON. Danno un risultato solo i file in cui è registrato il luogo.", "pt": "Arquivos de mídia (JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), o histórico de localização do Google (exportação do Google Takeout ou da Linha do tempo) e arquivos de trajeto GPX, KML, TCX e GeoJSON. Só dão resultado os arquivos que têm o local gravado.", "ja": "メディアファイル（JPEG、HEIC、PNG、WebP、MP4、MOV、RAW）、Googleのロケーション履歴（Google Takeoutまたはタイムラインの書き出し）、GPX・KML・TCX・GeoJSONのルートファイルです。結果が出るのは、場所が記録されているファイルだけです。", "ko": "미디어 파일(JPEG, HEIC, PNG, WebP, MP4, MOV, RAW), Google 위치 기록(Google 테이크아웃 또는 타임라인 내보내기), GPX, KML, TCX, GeoJSON 경로 파일입니다. 위치가 기록된 파일만 결과를 줍니다."},
    "q3": {"en": "Why do some files have no location?", "ru": "Почему у части файлов нет места съёмки?", "cs": "Proč některé soubory nemají místo pořízení?", "de": "Warum haben manche Dateien keinen Aufnahmeort?", "fr": "Pourquoi certains fichiers n’ont-ils pas de lieu de prise de vue ?", "es": "¿Por qué algunos archivos no tienen lugar de captura?", "it": "Perché alcuni file non hanno il luogo di scatto?", "pt": "Por que alguns arquivos não têm local de captura?", "ja": "撮影場所がないファイルがあるのはなぜですか？", "ko": "일부 파일에 촬영 위치가 없는 이유는 무엇인가요?"},
    "a3": {"en": "The phone or camera records the location at the moment of shooting, and only if location is turned on. Later it is often lost: messengers and social networks remove it when files are sent, many editors when files are saved, and some cloud storage services when files are shared by link or passed to other apps. Google Photos does not give the shooting location to other apps, but a full Google Takeout export keeps it.", "ru": "Место записывает телефон или фотоаппарат в момент съёмки, и только если у него включена геолокация. Потом оно часто теряется: мессенджеры и соцсети удаляют его при пересылке, многие редакторы — при сохранении, некоторые облачные хранилища — при передаче файлов по ссылке или другим программам. Google Фото не отдаёт место съёмки другим программам, но полная выгрузка через Google Takeout его сохраняет.", "cs": "Místo zapisuje telefon nebo fotoaparát v okamžiku pořízení, a jen když má zapnutou polohu. Později se často ztratí: messengery a sociální sítě ho při odesílání odstraní, mnohé editory při ukládání a některá cloudová úložiště při sdílení souborů odkazem nebo při jejich předání jiným aplikacím. Fotky Google místo pořízení jiným aplikacím nepředávají, úplný export přes Google Takeout ho ale zachová.", "de": "Den Aufnahmeort speichert das Telefon oder die Kamera beim Aufnehmen, und zwar nur, wenn die Standortfunktion eingeschaltet ist. Später geht er oft verloren: Messenger und soziale Netzwerke entfernen ihn beim Versenden, viele Bildbearbeitungsprogramme beim Speichern und manche Cloudspeicher, wenn Dateien per Link geteilt oder an andere Apps weitergegeben werden. Google Fotos gibt den Aufnahmeort nicht an andere Apps weiter, ein vollständiger Export über Google Takeout behält ihn jedoch.", "fr": "Le lieu est enregistré par le téléphone ou l’appareil photo au moment de la prise de vue, et seulement si la localisation est activée. Ensuite, il se perd souvent : les messageries et les réseaux sociaux le suppriment à l’envoi, de nombreux logiciels de retouche à l’enregistrement, et certains services de stockage en ligne lorsque les fichiers sont partagés par lien ou transmis à d’autres applications. Google Photos ne transmet pas le lieu de prise de vue aux autres applications, mais un export complet via Google Takeout le conserve.", "es": "El lugar lo graba el teléfono o la cámara en el momento de la toma, y solo si tiene la ubicación activada. Después se pierde a menudo: las aplicaciones de mensajería y las redes sociales lo eliminan al enviar los archivos, muchos editores al guardarlos y algunos servicios en la nube al compartirlos por enlace o pasarlos a otras aplicaciones. Google Fotos no entrega el lugar de la toma a otras aplicaciones, pero una exportación completa con Google Takeout lo conserva.", "it": "Il luogo viene registrato dal telefono o dalla fotocamera al momento dello scatto, e solo se la localizzazione è attiva. In seguito spesso si perde: le app di messaggistica e i social network lo rimuovono durante l’invio, molti editor al salvataggio e alcuni servizi cloud quando i file vengono condivisi tramite link o passati ad altre app. Google Foto non fornisce il luogo dello scatto ad altre app, ma un’esportazione completa con Google Takeout lo conserva.", "pt": "O local é gravado pelo celular ou pela câmera no momento da captura, e só se a localização estiver ativada. Depois ele costuma se perder: os aplicativos de mensagens e as redes sociais o removem ao enviar os arquivos, muitos editores ao salvá-los e alguns serviços de nuvem ao compartilhá-los por link ou passá-los a outros aplicativos. O Google Fotos não entrega o local da captura a outros aplicativos, mas uma exportação completa pelo Google Takeout o mantém.", "ja": "撮影場所は、撮影の瞬間にスマートフォンやカメラが記録します。位置情報がオンのときだけです。その後で失われることもよくあります。メッセージアプリやSNSは送信時に、多くの編集ソフトは保存時に、一部のクラウドストレージはリンクで共有したり他のアプリに渡したりするときに場所を削除します。Googleフォトは撮影場所を他のアプリに渡しませんが、Google Takeoutで全体を書き出せば場所は残ります。", "ko": "촬영 위치는 촬영하는 순간 휴대폰이나 카메라가 기록하며, 위치 기능이 켜져 있을 때만 기록됩니다. 그 뒤에 사라지는 경우가 많습니다. 메신저와 SNS는 파일을 보낼 때, 많은 편집 프로그램은 저장할 때, 일부 클라우드 저장소는 링크로 공유하거나 다른 앱에 넘길 때 위치를 지웁니다. Google 포토는 촬영 위치를 다른 앱에 넘기지 않지만, Google 테이크아웃으로 전체를 내보내면 위치가 남습니다."},
    "q4": {"en": "How do I move the result to my phone?", "ru": "Как перенести результат на телефон?", "cs": "Jak výsledek přenést do telefonu?", "de": "Wie übertrage ich das Ergebnis auf mein Telefon?", "fr": "Comment transférer le résultat sur mon téléphone ?", "es": "¿Cómo paso el resultado a mi teléfono?", "it": "Come trasferisco il risultato sul telefono?", "pt": "Como passo o resultado para o celular?", "ja": "結果をスマートフォンに移すには？", "ko": "결과를 휴대폰으로 옮기려면?"},
    "a4": {"en": "Press “Move to my phone” and sign in to your account on this site. Then install the Tabi app and sign in to the same account there: the app will offer to add the result to your collection.", "ru": "Нажмите «Перенести на телефон» и войдите в учётную запись на этом сайте. Затем установите приложение Tabi и войдите в нём в ту же учётную запись: приложение предложит добавить результат в вашу коллекцию.", "cs": "Stiskněte „Přenést do telefonu“ a přihlaste se ke svému účtu na tomto webu. Pak nainstalujte aplikaci Tabi a přihlaste se v ní ke stejnému účtu: aplikace nabídne přidat výsledek do vaší sbírky.", "de": "Drücken Sie „Aufs Telefon übertragen“ und melden Sie sich auf dieser Website bei Ihrem Konto an. Installieren Sie dann die App Tabi und melden Sie sich dort beim selben Konto an: Die App bietet an, das Ergebnis Ihrer Sammlung hinzuzufügen.", "fr": "Appuyez sur « Transférer sur mon téléphone » et connectez-vous à votre compte sur ce site. Installez ensuite l’application Tabi et connectez-vous au même compte : elle proposera d’ajouter le résultat à votre collection.", "es": "Pulsa «Pasar a mi teléfono» e inicia sesión en tu cuenta en este sitio. Luego instala la aplicación Tabi e inicia sesión en la misma cuenta: la aplicación te ofrecerá añadir el resultado a tu colección.", "it": "Prema «Trasferisci sul telefono» e acceda al Suo account su questo sito. Poi installi l’app Tabi e acceda allo stesso account: l’app Le proporrà di aggiungere il risultato alla Sua collezione.", "pt": "Toque em “Passar para o celular” e entre na sua conta neste site. Depois instale o aplicativo Tabi e entre nele com a mesma conta: o aplicativo vai oferecer adicionar o resultado à sua coleção.", "ja": "「スマートフォンに移す」を押して、このサイトでアカウントにログインします。次にTabiアプリをインストールし、同じアカウントでログインすると、結果をあなたのコレクションに加えるよう案内されます。", "ko": "‘휴대폰으로 옮기기’를 누르고 이 사이트에서 계정에 로그인하세요. 그런 다음 Tabi 앱을 설치하고 같은 계정으로 로그인하면 앱이 결과를 내 컬렉션에 추가하도록 안내합니다."},
    "q5": {"en": "Why are there fewer points on the map than photos?", "ru": "Почему на карте меньше точек, чем снимков?", "cs": "Proč je na mapě méně bodů než snímků?", "de": "Warum gibt es auf der Karte weniger Punkte als Fotos?", "fr": "Pourquoi y a-t-il moins de points sur la carte que de photos ?", "es": "¿Por qué hay menos puntos en el mapa que fotos?", "it": "Perché sulla mappa ci sono meno punti che foto?", "pt": "Por que há menos pontos no mapa do que fotos?", "ja": "地図上の地点が写真より少ないのはなぜですか？", "ko": "왜 지도에 사진보다 지점이 적나요?"},
    "a5": {"en": "Shots from one device taken within 150 metres and 20 minutes of the previous point are assigned to that same point. This way a series of shots in one place does not turn into dozens of identical marks.", "ru": "Снимки одного устройства, сделанные в пределах 150 метров и 20 минут от предыдущей точки, сайт относит к этой же точке. Так серия кадров в одном месте не превращается в десятки одинаковых меток.", "cs": "Snímky jednoho zařízení pořízené do 150 metrů a 20 minut od předchozího bodu web přiřadí k témuž bodu. Série záběrů na jednom místě se tak nepromění v desítky stejných značek.", "de": "Aufnahmen eines Geräts, die innerhalb von 150 Metern und 20 Minuten nach dem vorherigen Punkt entstanden sind, ordnet die Website demselben Punkt zu. So wird eine Bildserie an einem Ort nicht zu Dutzenden gleicher Markierungen.", "fr": "Les photos d’un même appareil prises à moins de 150 mètres et 20 minutes du point précédent sont rattachées à ce même point. Ainsi, une série de prises de vue au même endroit ne se transforme pas en dizaines de repères identiques.", "es": "Las fotos de un mismo dispositivo tomadas a menos de 150 metros y 20 minutos del punto anterior se asignan a ese mismo punto. Así, una serie de fotos en un mismo lugar no se convierte en decenas de marcas iguales.", "it": "Gli scatti di uno stesso dispositivo fatti entro 150 metri e 20 minuti dal punto precedente vengono attribuiti a quello stesso punto. Così una serie di scatti nello stesso luogo non diventa decine di segni uguali.", "pt": "Fotos de um mesmo aparelho feitas a menos de 150 metros e 20 minutos do ponto anterior são atribuídas a esse mesmo ponto. Assim, uma série de fotos no mesmo lugar não vira dezenas de marcas iguais.", "ja": "同じ機器で、前の地点から150メートル以内・20分以内に撮った写真は、その同じ地点にまとめます。こうして、同じ場所での連続写真が何十もの同じ印にならないようにしています。", "ko": "한 기기로 이전 지점에서 150미터, 20분 이내에 찍은 사진은 같은 지점으로 묶습니다. 그래서 한곳에서 찍은 연속 사진이 똑같은 표시 수십 개로 늘어나지 않습니다."},

    "trashNote": {"ru": "Удалённые устройства и точки можно вернуть в течение 30 дней.", "en": "Deleted devices and points can be restored for 30 days.", "cs": "Smazaná zařízení a body lze vrátit do 30 dnů.", "de": "Gelöschte Geräte und Punkte lassen sich 30 Tage lang wiederherstellen.", "fr": "Les appareils et points supprimés peuvent être restaurés pendant 30 jours.", "es": "Los dispositivos y puntos eliminados se pueden recuperar durante 30 días.", "it": "Dispositivi e punti eliminati si possono ripristinare per 30 giorni.", "pt": "Aparelhos e pontos excluídos podem ser restaurados por 30 dias.", "ja": "削除したデバイスと地点は30日以内なら元に戻せます。", "ko": "삭제한 기기와 지점은 30일 동안 되돌릴 수 있습니다."},
    "appInT": {"en": "Sign up on the website", "ru": "Зарегистрируйтесь на сайте", "cs": "Zaregistrujte se na webu", "de": "Registrieren Sie sich auf der Website", "fr": "Inscrivez-vous sur le site", "es": "Regístrate en el sitio web", "it": "Si registri sul sito", "pt": "Cadastre-se no site", "ja": "サイトに登録してください", "ko": "사이트에 가입하세요"},
    "appInX": {"en": "Sign in to the website with the same email you use for the Tabi app. After your files on the computer have been checked successfully, open the Tabi app on your phone to sync the results.", "ru": "Войдите на сайт той же электронной почтой, которую вы используете для приложения Tabi. После успешной проверки файлов на компьютере зайдите в приложение Tabi на телефоне, чтобы синхронизировать итоги.", "cs": "Přihlaste se na web stejným e-mailem, který používáte pro aplikaci Tabi. Po úspěšné kontrole souborů v počítači otevřete aplikaci Tabi v telefonu, aby se výsledky synchronizovaly.", "de": "Melden Sie sich auf der Website mit derselben E-Mail-Adresse an, die Sie für die Tabi-App verwenden. Öffnen Sie nach der erfolgreichen Prüfung der Dateien auf dem Computer die Tabi-App auf dem Telefon, um die Ergebnisse zu synchronisieren.", "fr": "Connectez-vous au site avec la même adresse e-mail que celle que vous utilisez pour l’application Tabi. Une fois les fichiers vérifiés avec succès sur l’ordinateur, ouvrez l’application Tabi sur votre téléphone pour synchroniser les résultats.", "es": "Inicia sesión en el sitio web con el mismo correo que usas para la aplicación Tabi. Cuando los archivos del ordenador se hayan comprobado correctamente, abre la aplicación Tabi en el teléfono para sincronizar los resultados.", "it": "Acceda al sito con la stessa e-mail che usa per l’app Tabi. Dopo che i file sul computer sono stati verificati con successo, apra l’app Tabi sul telefono per sincronizzare i risultati.", "pt": "Entre no site com o mesmo e-mail que você usa no aplicativo Tabi. Depois que os arquivos do computador forem verificados com sucesso, abra o aplicativo Tabi no celular para sincronizar os resultados.", "ja": "Tabiアプリで使っているのと同じメールアドレスでサイトにログインしてください。パソコンでのファイルの確認が完了したら、スマートフォンでTabiアプリを開いて結果を同期してください。", "ko": "Tabi 앱에서 사용하는 것과 같은 이메일로 사이트에 로그인하세요. 컴퓨터에서 파일 확인이 완료되면 휴대폰에서 Tabi 앱을 열어 결과를 동기화하세요."},
    "phoneApp": {"en": "This page works on a computer. Open tabimobile.com/pc on your computer and sign in there with the same email as in the app.", "ru": "Эта страница работает на компьютере. Откройте на компьютере tabimobile.com/pc и войдите там той же почтой, что и в приложении.", "cs": "Tato stránka funguje v počítači. Otevřete v počítači tabimobile.com/pc a přihlaste se tam stejným e-mailem jako v aplikaci.", "de": "Diese Seite funktioniert auf einem Computer. Öffnen Sie tabimobile.com/pc auf dem Computer und melden Sie sich dort mit derselben E-Mail-Adresse wie in der App an.", "fr": "Cette page fonctionne sur un ordinateur. Ouvrez tabimobile.com/pc sur votre ordinateur et connectez-vous avec la même adresse e-mail que dans l’application.", "es": "Esta página funciona en un ordenador. Abre tabimobile.com/pc en tu ordenador e inicia sesión allí con el mismo correo que en la aplicación.", "it": "Questa pagina funziona su un computer. Apra tabimobile.com/pc sul computer e acceda lì con la stessa e-mail dell’app.", "pt": "Esta página funciona em um computador. Abra tabimobile.com/pc no computador e entre lá com o mesmo e-mail do aplicativo.", "ja": "このページはパソコンで使います。パソコンで tabimobile.com/pc を開き、アプリと同じメールアドレスでログインしてください。", "ko": "이 페이지는 컴퓨터에서 작동합니다. 컴퓨터에서 tabimobile.com/pc를 열고 앱과 같은 이메일로 로그인하세요."},
    "pkT": {"en": "Which files to choose", "ru": "Какие файлы выбрать", "cs": "Které soubory vybrat", "de": "Welche Dateien Sie wählen sollten", "fr": "Quels fichiers choisir", "es": "Qué archivos elegir", "it": "Quali file scegliere", "pt": "Quais arquivos escolher", "ja": "どのファイルを選ぶか", "ko": "어떤 파일을 고를까요"},
    "pk1": {"en": "The place and time of shooting are recorded above all by phones. Start with the folders where you moved media files from your phones.", "ru": "Место и время съёмки записывают прежде всего телефоны. Начните с папок, куда вы переносили с них медиафайлы.", "cs": "Místo a čas pořízení zaznamenávají především telefony. Začněte složkami, do kterých jste z nich přenášeli mediální soubory.", "de": "Aufnahmeort und -zeit zeichnen vor allem Telefone auf. Beginnen Sie mit den Ordnern, in die Sie Mediendateien von Ihren Telefonen übertragen haben.", "fr": "Ce sont surtout les téléphones qui enregistrent le lieu et l’heure de prise de vue. Commencez par les dossiers où vous avez transféré les fichiers multimédias de vos téléphones.", "es": "El lugar y la hora de la toma los graban sobre todo los teléfonos. Empieza por las carpetas a las que pasaste los archivos multimedia de tus teléfonos.", "it": "Il luogo e l’ora dello scatto li registrano soprattutto i telefoni. Inizi dalle cartelle in cui ha trasferito i file multimediali dai Suoi telefoni.", "pt": "Quem grava o local e a hora da captura são, sobretudo, os celulares. Comece pelas pastas para onde você passou os arquivos de mídia dos seus celulares.", "ja": "撮影場所と時刻を記録するのは主にスマートフォンです。まずはスマートフォンからメディアファイルを移したフォルダーを選んでください。", "ko": "촬영 장소와 시간은 주로 휴대폰이 기록합니다. 휴대폰에서 미디어 파일을 옮겨 둔 폴더부터 확인하세요."},
    "pk2": {"en": "Cloud storage services and messengers often remove the shooting location, so files downloaded from them may turn out to be useless. From Google Photos, a full Google Takeout export works.", "ru": "Облачные хранилища и мессенджеры часто удаляют место съёмки, поэтому скачанные оттуда файлы могут оказаться бесполезными. Из Google Фото подходит полная выгрузка через Google Takeout.", "cs": "Cloudová úložiště a messengery místo pořízení často odstraňují, takže soubory stažené odtud mohou být k ničemu. Z Fotek Google se hodí úplný export přes Google Takeout.", "de": "Cloudspeicher und Messenger entfernen den Aufnahmeort oft, daher können von dort heruntergeladene Dateien nutzlos sein. Aus Google Fotos eignet sich ein vollständiger Export über Google Takeout.", "fr": "Les services de stockage en ligne et les messageries suppriment souvent le lieu de prise de vue : les fichiers qui en sont téléchargés peuvent donc s’avérer inutiles. Pour Google Photos, un export complet via Google Takeout convient.", "es": "Los servicios en la nube y las aplicaciones de mensajería suelen borrar el lugar de la toma, así que los archivos descargados de ellos pueden no servir. De Google Fotos sirve una exportación completa con Google Takeout.", "it": "I servizi cloud e le app di messaggistica spesso rimuovono il luogo dello scatto, quindi i file scaricati da lì possono risultare inutili. Da Google Foto va bene un’esportazione completa con Google Takeout.", "pt": "Serviços de nuvem e aplicativos de mensagens costumam apagar o local da captura, então arquivos baixados deles podem não servir. Do Google Fotos, serve uma exportação completa pelo Google Takeout.", "ja": "クラウドストレージやメッセージアプリは撮影場所を削除することが多く、そこからダウンロードしたファイルは役に立たない場合があります。Googleフォトなら、Google Takeoutで全体を書き出したものが使えます。", "ko": "클라우드 저장소와 메신저는 촬영 위치를 지우는 경우가 많아, 거기서 내려받은 파일은 쓸모없을 수 있습니다. Google 포토는 Google 테이크아웃으로 전체를 내보낸 파일이 적합합니다."},
    "pk3": {"en": "Connect flash drives, memory cards and cameras to your computer: they can be checked too. Move media files from a phone to your computer first.", "ru": "Подключите к компьютеру флешки, карты памяти и фотоаппараты — их тоже можно проверить. Медиафайлы с телефона сначала перенесите на компьютер.", "cs": "Připojte k počítači flash disky, paměťové karty a fotoaparáty — i ty lze zkontrolovat. Mediální soubory z telefonu nejprve přeneste do počítače.", "de": "Schließen Sie USB-Sticks, Speicherkarten und Kameras an den Computer an – auch sie lassen sich prüfen. Mediendateien vom Telefon übertragen Sie zuerst auf den Computer.", "fr": "Branchez vos clés USB, cartes mémoire et appareils photo à l’ordinateur : on peut aussi les vérifier. Transférez d’abord sur l’ordinateur les fichiers multimédias de votre téléphone.", "es": "Conecta al ordenador memorias USB, tarjetas de memoria y cámaras: también se pueden comprobar. Los archivos multimedia del teléfono pásalos primero al ordenador.", "it": "Colleghi al computer chiavette USB, schede di memoria e fotocamere: si possono controllare anche quelle. I file multimediali del telefono li trasferisca prima sul computer.", "pt": "Conecte ao computador pen drives, cartões de memória e câmeras: eles também podem ser verificados. Os arquivos de mídia do celular, passe-os primeiro para o computador.", "ja": "USBメモリ、メモリーカード、カメラをパソコンにつなげば、それらも確認できます。スマートフォンのメディアファイルは、先にパソコンへ移してください。", "ko": "USB 메모리, 메모리 카드, 카메라를 컴퓨터에 연결하면 함께 확인할 수 있습니다. 휴대폰의 미디어 파일은 먼저 컴퓨터로 옮기세요."},
    "pk4": {"en": "Many cameras and camcorders record only the time of shooting, without the place.", "ru": "Многие фотоаппараты и видеокамеры записывают только время съёмки, без места.", "cs": "Mnoho fotoaparátů a videokamer zaznamenává jen čas pořízení, bez místa.", "de": "Viele Foto- und Videokameras zeichnen nur die Aufnahmezeit auf, ohne den Ort.", "fr": "Beaucoup d’appareils photo et de caméscopes n’enregistrent que l’heure de prise de vue, sans le lieu.", "es": "Muchas cámaras de fotos y videocámaras graban solo la hora de la toma, sin el lugar.", "it": "Molte fotocamere e videocamere registrano solo l’ora dello scatto, senza il luogo.", "pt": "Muitas câmeras fotográficas e filmadoras gravam só a hora da captura, sem o local.", "ja": "多くのカメラやビデオカメラは撮影時刻だけを記録し、場所は記録しません。", "ko": "많은 카메라와 캠코더는 촬영 시간만 기록하고 위치는 기록하지 않습니다."},
    "pk5": {"en": "The site also reads Google location history (a Google Takeout or Timeline export) and route files in GPX, KML, TCX and GeoJSON. Choose the folder with them or the files themselves.", "ru": "Сайт читает и историю местоположений Google — выгрузку Google Takeout или «Хронологии», — а также файлы маршрута GPX, KML, TCX и GeoJSON. Выберите папку с ними или сами файлы.", "cs": "Web čte i historii polohy Google — export z Google Takeout nebo z Časové osy — a soubory trasy GPX, KML, TCX a GeoJSON. Vyberte složku s nimi nebo samotné soubory.", "de": "Die Website liest auch den Google-Standortverlauf – einen Export aus Google Takeout oder der Zeitachse – sowie Routendateien im Format GPX, KML, TCX und GeoJSON. Wählen Sie den Ordner damit oder die Dateien selbst.", "fr": "Le site lit aussi l’historique des positions Google (export Google Takeout ou de la Chronologie) ainsi que les fichiers d’itinéraire GPX, KML, TCX et GeoJSON. Choisissez le dossier qui les contient ou les fichiers eux-mêmes.", "es": "El sitio también lee el historial de ubicaciones de Google (una exportación de Google Takeout o de Cronología) y los archivos de ruta GPX, KML, TCX y GeoJSON. Elige la carpeta que los contiene o los propios archivos.", "it": "Il sito legge anche la cronologia delle posizioni di Google (un’esportazione di Google Takeout o della Cronologia) e i file di percorso GPX, KML, TCX e GeoJSON. Scelga la cartella che li contiene o i file stessi.", "pt": "O site também lê o histórico de localização do Google (uma exportação do Google Takeout ou da Linha do tempo) e os arquivos de trajeto GPX, KML, TCX e GeoJSON. Escolha a pasta com eles ou os próprios arquivos.", "ja": "Googleのロケーション履歴（Google Takeoutまたはタイムラインの書き出し）と、GPX・KML・TCX・GeoJSONのルートファイルも読み取れます。それらが入ったフォルダーか、ファイルそのものを選んでください。", "ko": "Google 위치 기록(Google 테이크아웃 또는 타임라인 내보내기)과 GPX, KML, TCX, GeoJSON 경로 파일도 읽을 수 있습니다. 이 파일이 든 폴더나 파일 자체를 고르세요."},
    "pk6": {"en": "Don’t remember where your media files are? Drag your whole desktop or an entire disk onto this page — from “This PC” in File Explorer. The check will take longer, but nothing will be missed. A large folder or a whole disk is much faster to drag onto the page than to choose with the button: the check starts at once and you see its progress.", "ru": "Не помните, где хранятся медиафайлы? Перетащите на эту страницу весь рабочий стол или целый диск — из раздела «Этот компьютер» в проводнике. Проверка займёт больше времени, зато ничего не будет упущено. Большую папку или целый диск гораздо быстрее перетащить на страницу, чем выбрать кнопкой: проверка начнётся сразу, и её ход будет виден.", "cs": "Nevíte, kde mediální soubory máte? Přetáhněte na tuto stránku celou plochu nebo celý disk — z oddílu „Tento počítač“ v Průzkumníku. Kontrola potrvá déle, ale nic se nevynechá. Velkou složku nebo celý disk je mnohem rychlejší přetáhnout na stránku než vybrat tlačítkem: kontrola začne hned a její průběh uvidíte.", "de": "Sie wissen nicht mehr, wo Ihre Mediendateien liegen? Ziehen Sie den ganzen Desktop oder ein ganzes Laufwerk auf diese Seite – aus „Dieser PC“ im Explorer. Die Prüfung dauert länger, dafür entgeht ihr nichts. Einen großen Ordner oder eine ganze Festplatte ziehen Sie viel schneller auf die Seite, als sie über die Schaltfläche zu wählen: Die Prüfung beginnt sofort, und ihr Fortschritt ist sichtbar.", "fr": "Vous ne savez plus où se trouvent vos fichiers multimédias ? Faites glisser sur cette page tout le Bureau ou un disque entier, depuis « Ce PC » dans l’Explorateur de fichiers. La vérification prendra plus de temps, mais rien ne sera oublié. Un grand dossier ou un disque entier se glisse sur la page bien plus vite qu’il ne se choisit avec le bouton : l’analyse commence aussitôt et sa progression est visible.", "es": "¿No recuerdas dónde están tus archivos multimedia? Arrastra a esta página todo el escritorio o un disco entero, desde «Este equipo» en el Explorador de archivos. La comprobación tardará más, pero no se escapará nada. Una carpeta grande o un disco entero se arrastra a la página mucho más rápido que si lo eliges con el botón: la revisión empieza enseguida y ves su avance.", "it": "Non ricorda dove sono i file multimediali? Trascini su questa pagina l’intero desktop o un disco intero, da «Questo PC» in Esplora file. Il controllo richiederà più tempo, ma non sfuggirà nulla. Una cartella grande o un intero disco si trascina sulla pagina molto più velocemente di quanto si scelga con il pulsante: la verifica inizia subito e ne vede l’avanzamento.", "pt": "Não lembra onde estão os arquivos de mídia? Arraste para esta página a área de trabalho inteira ou um disco inteiro, a partir de “Este Computador” no Explorador de Arquivos. A verificação vai demorar mais, mas nada vai escapar. Uma pasta grande ou um disco inteiro é muito mais rápido arrastar para a página do que escolher pelo botão: a verificação começa na hora e você vê o progresso.", "ja": "メディアファイルの場所がわからない場合は、デスクトップ全体やディスク全体をこのページにドラッグしてください（エクスプローラーの「PC」から）。確認に時間はかかりますが、見落としはありません。大きなフォルダーやディスク全体は、ボタンで選ぶよりページにドラッグするほうがはるかに速く、すぐに確認が始まって進み具合も見えます。", "ko": "미디어 파일이 어디 있는지 기억나지 않나요? 바탕 화면 전체나 디스크 전체를 이 페이지로 끌어다 놓으세요. 파일 탐색기의 ‘내 PC’에서 끌어오면 됩니다. 확인에 시간이 더 걸리지만 빠뜨리는 것이 없습니다. 큰 폴더나 디스크 전체는 버튼으로 선택하는 것보다 페이지로 끌어다 놓는 편이 훨씬 빠르며, 확인이 바로 시작되고 진행 상황도 보입니다."},
    "pkDir": {"en": "Choose a folder", "ru": "Выбрать папку", "cs": "Vybrat složku", "de": "Ordner auswählen", "fr": "Choisir un dossier", "es": "Elegir una carpeta", "it": "Scegli una cartella", "pt": "Escolher uma pasta", "ja": "フォルダーを選ぶ", "ko": "폴더 선택"},

    "pkNote": {"en": "The browser will ask for permission to access the files: without it the page cannot read them. The files themselves stay on your computer.", "ru": "Браузер попросит разрешения на доступ к файлам: без него страница не сможет их прочитать. Сами файлы остаются на компьютере.", "cs": "Prohlížeč požádá o povolení přístupu k souborům: bez něj je stránka nemůže přečíst. Samotné soubory zůstávají v počítači.", "de": "Der Browser fragt nach der Erlaubnis, auf die Dateien zuzugreifen: Ohne sie kann die Seite sie nicht lesen. Die Dateien selbst bleiben auf Ihrem Computer.", "fr": "Le navigateur demandera l’autorisation d’accéder aux fichiers : sans elle, la page ne peut pas les lire. Les fichiers eux-mêmes restent sur votre ordinateur.", "es": "El navegador pedirá permiso para acceder a los archivos: sin él, la página no puede leerlos. Los archivos se quedan en tu ordenador.", "it": "Il browser chiederà il permesso di accedere ai file: senza, la pagina non può leggerli. I file restano sul Suo computer.", "pt": "O navegador vai pedir permissão para acessar os arquivos: sem ela, a página não consegue lê-los. Os arquivos ficam no seu computador.", "ja": "ブラウザーがファイルへのアクセス許可を求めます。許可がないとページはファイルを読み取れません。ファイルそのものはパソコンに残ります。", "ko": "브라우저가 파일 접근 권한을 요청합니다. 권한이 없으면 페이지가 파일을 읽을 수 없습니다. 파일 자체는 컴퓨터에 그대로 남습니다."},
    "listingT": {"en": "The browser is listing the files… {t}", "ru": "Браузер собирает список файлов… {t}", "cs": "Prohlížeč sestavuje seznam souborů… {t}", "de": "Der Browser erstellt die Dateiliste… {t}", "fr": "Le navigateur dresse la liste des fichiers… {t}", "es": "El navegador está listando los archivos… {t}", "it": "Il browser sta elencando i file… {t}", "pt": "O navegador está listando os arquivos… {t}", "ja": "ブラウザーがファイルの一覧を作成中… {t}", "ko": "브라우저가 파일 목록을 만드는 중… {t}"},
    "bigList": {"ru": "Похоже, выбрана большая папка или весь диск. Браузер сначала сам перебирает все файлы и ничего не сообщает странице: весь диск так перебирается 5–15 минут, а затем ещё дольше передаётся странице. Гораздо быстрее перетащить этот диск или папку прямо на страницу — проверка пойдёт быстрее, и её ход будет виден сразу. Нажмите «Отменить» и перетащите диск или папку сюда из Проводника.", "en": "This looks like a large folder or a whole disk. The browser first goes through all the files on its own and tells the page nothing: a whole disk takes 5–15 minutes this way, and then even longer to reach the page. It is much faster to drag this disk or folder straight onto the page: the check will go faster and you will see its progress at once. Press Cancel and drag the disk or folder here from File Explorer.", "cs": "Zdá se, že jde o velkou složku nebo celý disk. Prohlížeč nejprve sám projde všechny soubory a stránce nic nesděluje: celý disk tak trvá 5–15 minut a pak se ještě déle předává stránce. Mnohem rychlejší je přetáhnout tento disk nebo složku přímo na stránku — kontrola poběží rychleji a její průběh uvidíte hned. Klikněte na „Zrušit“ a přetáhněte disk nebo složku sem z Průzkumníka.", "de": "Das scheint ein großer Ordner oder eine ganze Festplatte zu sein. Der Browser geht zuerst selbst alle Dateien durch und meldet der Seite nichts: Eine ganze Festplatte dauert so 5–15 Minuten und danach noch länger, bis sie die Seite erreicht. Viel schneller geht es, diese Festplatte oder diesen Ordner direkt auf die Seite zu ziehen – die Prüfung läuft schneller, und ihr Fortschritt ist sofort sichtbar. Klicken Sie auf „Abbrechen“ und ziehen Sie die Festplatte oder den Ordner aus dem Datei-Explorer hierher.", "fr": "Il semble s’agir d’un grand dossier ou d’un disque entier. Le navigateur parcourt d’abord lui-même tous les fichiers sans rien communiquer à la page : un disque entier prend ainsi 5 à 15 minutes, puis encore plus longtemps pour arriver à la page. Il est beaucoup plus rapide de faire glisser ce disque ou ce dossier directement sur la page : l’analyse ira plus vite et sa progression sera visible tout de suite. Cliquez sur « Annuler » et faites glisser le disque ou le dossier ici depuis l’Explorateur de fichiers.", "es": "Parece una carpeta grande o un disco entero. El navegador primero recorre por sí mismo todos los archivos y no le comunica nada a la página: un disco entero tarda así de 5 a 15 minutos y luego aún más en llegar a la página. Es mucho más rápido arrastrar este disco o carpeta directamente a la página: la revisión irá más rápido y verás su avance enseguida. Pulsa «Cancelar» y arrastra el disco o la carpeta aquí desde el Explorador de archivos.", "it": "Sembra una cartella grande o un intero disco. Il browser prima scorre da solo tutti i file e non comunica nulla alla pagina: un intero disco richiede così 5–15 minuti e poi ancora di più per arrivare alla pagina. È molto più veloce trascinare questo disco o questa cartella direttamente sulla pagina: la verifica sarà più rapida e ne vedrà subito l’avanzamento. Prema «Annulla» e trascini qui il disco o la cartella da Esplora file.", "pt": "Parece uma pasta grande ou um disco inteiro. O navegador primeiro percorre sozinho todos os arquivos e não informa nada à página: um disco inteiro leva assim de 5 a 15 minutos e depois ainda mais para chegar à página. É muito mais rápido arrastar este disco ou pasta direto para a página — a verificação será mais rápida e o progresso aparecerá na hora. Clique em “Cancelar” e arraste o disco ou a pasta para cá a partir do Explorador de Arquivos.", "ja": "大きなフォルダーかディスク全体のようです。ブラウザーはまず自分ですべてのファイルを調べ、その間ページには何も伝えません。ディスク全体だとこれに5〜15分、さらにページに渡すまでにもっと時間がかかります。このディスクやフォルダーをページに直接ドラッグするほうがはるかに速く、進み具合もすぐに見えます。「キャンセル」を押し、エクスプローラーからディスクかフォルダーをここへドラッグしてください。", "ko": "큰 폴더나 디스크 전체로 보입니다. 브라우저가 먼저 모든 파일을 직접 훑으며 그동안 페이지에 아무것도 알려 주지 않습니다. 디스크 전체는 이렇게 5~15분이 걸리고, 페이지로 넘어오는 데는 그보다 더 걸립니다. 이 디스크나 폴더를 페이지로 바로 끌어다 놓는 편이 훨씬 빠르며 진행 상황도 바로 보입니다. '취소'를 누르고 파일 탐색기에서 디스크나 폴더를 이곳으로 끌어다 놓으세요."},

    "whyTiny": {"ru": "Картинки меньше 320 пикселей по длинной стороне не учтены — {n}: это значки, миниатюры и картинки программ, а не снимки.", "en": "Pictures under 320 pixels on the long side are not counted: {n}. These are icons, thumbnails and program images, not photos.", "cs": "Obrázky menší než 320 pixelů na delší straně se nezapočítávají — {n}: jsou to ikony, náhledy a obrázky programů, ne fotografie.", "de": "Bilder unter 320 Pixel an der längeren Seite werden nicht gezählt: {n}. Das sind Symbole, Vorschaubilder und Programmbilder, keine Fotos.", "fr": "Les images de moins de 320 pixels sur le grand côté ne sont pas comptées : {n}. Ce sont des icônes, des miniatures et des images de programmes, pas des photos.", "es": "Las imágenes de menos de 320 píxeles en el lado largo no se cuentan: {n}. Son iconos, miniaturas e imágenes de programas, no fotos.", "it": "Le immagini sotto i 320 pixel sul lato lungo non vengono contate: {n}. Sono icone, miniature e immagini di programmi, non foto.", "pt": "Imagens com menos de 320 pixels no lado maior não são contadas: {n}. São ícones, miniaturas e imagens de programas, não fotos.", "ja": "長辺が320ピクセル未満の画像は数えません：{n}。アイコンやサムネイル、プログラムの画像で、写真ではありません。", "ko": "긴 변이 320픽셀 미만인 이미지는 세지 않습니다: {n}. 아이콘, 미리보기, 프로그램 이미지이며 사진이 아닙니다."},
    "heldX": {"ru": "Найдено только в папках программ и пока не учтено — {n}: там лежат образцы программ и снимки, присланные в мессенджерах. Учесть их можно в блоке «Устройства».", "en": "Found only in program folders and not counted yet: {n}. Program samples and photos received in messengers are kept there. You can include them in Devices.", "cs": "Nalezeno jen ve složkách programů a zatím nezapočteno — {n}: bývají tam ukázky programů a fotky přijaté v messengerech. Započítat je můžete v části „Zařízení“.", "de": "Nur in Programmordnern gefunden und noch nicht gezählt: {n}. Dort liegen Beispieldateien von Programmen und in Messengern empfangene Fotos. Einbeziehen können Sie sie unter „Geräte“.", "fr": "Trouvé uniquement dans les dossiers de programmes et pas encore compté : {n}. On y trouve des exemples de programmes et des photos reçues par messagerie. Vous pouvez les inclure dans « Appareils ».", "es": "Encontrado solo en carpetas de programas y aún sin contar: {n}. Ahí se guardan ejemplos de programas y fotos recibidas por mensajería. Puedes incluirlas en «Dispositivos».", "it": "Trovato solo nelle cartelle dei programmi e non ancora contato: {n}. Lì si trovano esempi dei programmi e foto ricevute nelle app di messaggistica. Può includerle in «Dispositivi».", "pt": "Encontrado só em pastas de programas e ainda não contado: {n}. Ali ficam exemplos de programas e fotos recebidas em aplicativos de mensagens. Você pode incluí-las em “Dispositivos”.", "ja": "プログラムのフォルダーだけで見つかり、まだ数えていません：{n}。そこにはプログラムの見本やメッセンジャーで受け取った写真があります。「デバイス」で含めることができます。", "ko": "프로그램 폴더에서만 발견되어 아직 세지 않았습니다: {n}. 그곳에는 프로그램 예시와 메신저로 받은 사진이 있습니다. ‘기기’에서 포함할 수 있습니다."},

    "proTripsX": {"ru": "Поездка — дни подряд дальше 60 км от дома; дом — город, где в этом году больше всего дней. До двух дней без точек поездку не прерывают.", "en": "A trip is a run of days more than 60 km from home; home is the city with the most days that year. Up to two days without points do not break a trip.", "cs": "Cesta jsou dny po sobě dál než 60 km od domova; domov je město, kde jste ten rok strávili nejvíc dní. Až dva dny bez bodů cestu nepřeruší.", "de": "Eine Reise sind aufeinanderfolgende Tage mehr als 60 km von zu Hause; zu Hause ist die Stadt mit den meisten Tagen in diesem Jahr. Bis zu zwei Tage ohne Punkte unterbrechen eine Reise nicht.", "fr": "Un voyage est une suite de jours à plus de 60 km de chez vous ; chez vous, c’est la ville où vous avez passé le plus de jours cette année-là. Jusqu’à deux jours sans points n’interrompent pas un voyage.", "es": "Un viaje son días seguidos a más de 60 km de casa; casa es la ciudad con más días ese año. Hasta dos días sin puntos no interrumpen el viaje.", "it": "Un viaggio sono giorni consecutivi a più di 60 km da casa; casa è la città con più giorni in quell’anno. Fino a due giorni senza punti non interrompono il viaggio.", "pt": "Uma viagem são dias seguidos a mais de 60 km de casa; casa é a cidade com mais dias naquele ano. Até dois dias sem pontos não interrompem a viagem.", "ja": "旅行とは、自宅から60 km以上離れた日が続く期間です。自宅はその年に最も多くの日を過ごした都市です。地点のない日が2日以内なら旅行は途切れません。", "ko": "여행은 집에서 60km 넘게 떨어진 날이 이어지는 기간입니다. 집은 그해 가장 많은 날을 보낸 도시입니다. 지점이 없는 날이 이틀 이내면 여행은 끊기지 않습니다."},

    "proSchNone": {"ru": "Точек в Шенгенской зоне нет.", "en": "There are no points in the Schengen area.", "cs": "V Schengenském prostoru nejsou žádné body.", "de": "Im Schengen-Raum gibt es keine Punkte.", "fr": "Aucun point dans l’espace Schengen.", "es": "No hay puntos en el espacio Schengen.", "it": "Non ci sono punti nell’area Schengen.", "pt": "Não há pontos no espaço Schengen.", "ja": "シェンゲン圏の地点はありません。", "ko": "솅겐 지역의 지점이 없습니다."},
    "proVisaNote": {"ru": "Считаются только дни, в которые есть точки: дни без снимков неизвестны, поэтому настоящих дней может быть больше. День переезда считается в обеих странах. Это подсказка, а не документ.", "en": "Only days with points are counted: days without photos are unknown, so the real number of days may be higher. A travel day counts in both countries. This is a hint, not a document.", "cs": "Počítají se jen dny, kdy existují body: dny bez fotek nejsou známé, takže skutečných dní může být víc. Den přejezdu se počítá v obou zemích. Je to vodítko, ne doklad.", "de": "Gezählt werden nur Tage mit Punkten: Tage ohne Fotos sind unbekannt, die tatsächliche Zahl kann also höher sein. Ein Reisetag zählt in beiden Ländern. Das ist ein Hinweis, kein Nachweis.", "fr": "Seuls les jours avec des points sont comptés : les jours sans photos sont inconnus, le nombre réel peut donc être plus élevé. Un jour de trajet compte dans les deux pays. C’est une indication, pas un justificatif.", "es": "Solo se cuentan los días con puntos: los días sin fotos se desconocen, así que los días reales pueden ser más. Un día de viaje cuenta en ambos países. Es una orientación, no un documento.", "it": "Si contano solo i giorni con punti: i giorni senza foto sono sconosciuti, quindi i giorni reali possono essere di più. Un giorno di viaggio conta in entrambi i paesi. È un’indicazione, non un documento.", "pt": "Só contam os dias com pontos: os dias sem fotos são desconhecidos, então os dias reais podem ser mais. Um dia de viagem conta nos dois países. É uma indicação, não um documento.", "ja": "地点のある日だけを数えます。写真のない日は分からないため、実際の日数はもっと多いかもしれません。移動日は両方の国に数えます。目安であり、証明書ではありません。", "ko": "지점이 있는 날만 셉니다. 사진이 없는 날은 알 수 없으므로 실제 일수는 더 많을 수 있습니다. 이동한 날은 두 나라 모두에 셉니다. 참고용이며 증빙 자료가 아닙니다."},

    "proJumpH": {"ru": "Невозможные скачки", "en": "Impossible jumps", "cs": "Nemožné skoky", "de": "Unmögliche Sprünge", "fr": "Sauts impossibles", "es": "Saltos imposibles", "it": "Salti impossibili", "pt": "Saltos impossíveis", "ja": "ありえない移動", "ko": "불가능한 이동"},
    "proJumpX": {"ru": "Точка, к которой и от которой то же устройство «долетело» бы быстрее 1000 км/ч: обычно это неверное место или неверные часы камеры. На карте такие точки обведены красным.", "en": "A point the same device would have had to reach and leave faster than 1,000 km/h: usually a wrong place or a wrong camera clock. Such points are circled in red on the map.", "cs": "Bod, ke kterému a od kterého by stejné zařízení muselo „letět“ rychleji než 1000 km/h: obvykle jde o chybné místo nebo chybné hodiny fotoaparátu. Na mapě jsou takové body zakroužkované červeně.", "de": "Ein Punkt, zu dem und von dem dasselbe Gerät schneller als 1000 km/h „geflogen“ sein müsste: meist ein falscher Ort oder eine falsche Kamerauhr. Solche Punkte sind auf der Karte rot umrandet.", "fr": "Un point vers lequel et depuis lequel le même appareil aurait dû « voler » à plus de 1 000 km/h : en général un lieu erroné ou une horloge d’appareil fausse. Ces points sont entourés de rouge sur la carte.", "es": "Un punto al que y desde el que el mismo dispositivo habría tenido que «volar» a más de 1000 km/h: suele ser un lugar erróneo o un reloj de cámara mal ajustado. En el mapa esos puntos se rodean en rojo.", "it": "Un punto verso cui e da cui lo stesso dispositivo avrebbe dovuto «volare» a più di 1000 km/h: di solito un luogo errato o un orologio della fotocamera sbagliato. Sulla mappa questi punti sono cerchiati in rosso.", "pt": "Um ponto para o qual e do qual o mesmo aparelho teria de “voar” a mais de 1000 km/h: em geral, um local errado ou o relógio da câmera errado. No mapa, esses pontos aparecem circulados em vermelho.", "ja": "同じ機器が時速1000 kmを超えて行き来しなければならない地点です。多くは場所の誤りかカメラの時計のずれです。地図では赤い丸で示します。", "ko": "같은 기기가 시속 1000km보다 빠르게 오가야 하는 지점입니다. 보통 위치 오류나 카메라 시계 오류입니다. 지도에서는 빨간 원으로 표시됩니다."},

    "proJumpDelX": {"ru": "Точки со скачком ({n}) уйдут в корзину и перестанут учитываться. Вернуть их можно в течение 30 дней в блоке «Устройства».", "en": "The points with a jump ({n}) will go to the bin and stop counting. You can restore them for 30 days in Devices.", "cs": "Body se skokem ({n}) se přesunou do koše a přestanou se započítávat. Vrátit je můžete do 30 dnů v části „Zařízení“.", "de": "Die Punkte mit Sprung ({n}) kommen in den Papierkorb und zählen nicht mehr. Wiederherstellen können Sie sie 30 Tage lang unter „Geräte“.", "fr": "Les points avec un saut ({n}) iront à la corbeille et ne seront plus comptés. Vous pourrez les restaurer pendant 30 jours dans « Appareils ».", "es": "Los puntos con salto ({n}) irán a la papelera y dejarán de contar. Puedes recuperarlos durante 30 días en «Dispositivos».", "it": "I punti con un salto ({n}) andranno nel cestino e non verranno più contati. Può ripristinarli per 30 giorni in «Dispositivi».", "pt": "Os pontos com salto ({n}) irão para a lixeira e deixarão de contar. Você pode restaurá-los por 30 dias em “Dispositivos”.", "ja": "ありえない移動の地点（{n}）はごみ箱に移り、数えられなくなります。30日以内なら「デバイス」で元に戻せます。", "ko": "이동 오류 지점({n})은 휴지통으로 이동하며 더 이상 세지 않습니다. 30일 동안 ‘기기’에서 되돌릴 수 있습니다."},
