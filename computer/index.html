<style>
body{min-height:100vh;background:var(--glow),radial-gradient(800px 520px at 0% 100%,var(--accent-soft) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.pc-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.pc-theme{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.pc-theme .ic{width:19px;height:19px}
details.lang li button{all:unset;display:block;box-sizing:border-box;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink);font-weight:500;cursor:pointer}
details.lang li button:hover,details.lang li button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.pc{max-width:1320px;margin:0 auto;padding:28px 20px 56px}
.pc-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:20px;align-items:start;transition:grid-template-columns .4s ease}
.pc-grid.idle{grid-template-columns:minmax(0,600px);justify-content:center}
.pc-grid.idle .pc-side{display:none}
.pc-card{background:var(--panel);border-radius:24px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-main{display:grid;gap:16px}
.pc-main h1{font-size:clamp(26px,2.6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0}
.pc-lead{color:var(--sub);margin:0}
.pc-side{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;display:grid;gap:12px;align-content:start}
.pc-side h2,.pc-route h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.pc-count{color:var(--sub);font-weight:700;margin-left:6px}
.pc-btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%}
.pc-btn.b2{background:var(--bg2);color:var(--ink)}
.pc-btn:disabled{opacity:.55;cursor:default}
.pc-in{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.pc-s{color:var(--sub);font-size:14px;line-height:1.45;margin:0}
.pc-e{color:var(--accent);font-size:14.5px;line-height:1.45;font-weight:600}
.pc-drop{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--sub);font-size:14px}
.pc-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden}.pc-bar>div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.pc-when{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;min-height:1.1em}
.pc-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pc-stat{background:var(--bg);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.pc-stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.pc-stat span{font-size:12.5px;color:var(--sub);line-height:1.25;display:block}
.pc-list{display:grid;gap:8px}
.pc-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both}
.pc-item img{width:34px;height:24px;object-fit:cover;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pc-item .nm{font-weight:700;line-height:1.25}
.pc-item .dt{color:var(--sub);font-size:12.5px}
.pc-regs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pc-regs span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;animation:pcIn .45s ease both}
.pc-city{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);animation:pcIn .45s ease both;min-width:0}
.pc-city .nm{font-weight:650;min-width:0;overflow-wrap:anywhere}
.pc-city .cc{color:var(--sub);font-size:12.5px;white-space:nowrap;flex:none}
.pc-route{margin-top:20px;display:grid;gap:12px}
.pc-route canvas{width:100%;height:400px;border-radius:16px;background:var(--bg);display:block}
.pc-diag{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:14.5px}
.pc-diag li{line-height:1.45}
.pc-foot{max-width:1320px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px}
.pc-foot a{color:var(--sub);font-weight:600;text-decoration:none}.pc-foot a:hover{color:var(--ink)}
.pc-over{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);font-size:24px;font-weight:800;color:var(--accent);pointer-events:none}
@keyframes pcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pc-item,.pc-city,.pc-regs span{animation:none}}
@media (max-width:1100px){.pc-grid{grid-template-columns:minmax(0,1fr)}.pc-grid.idle{grid-template-columns:minmax(0,600px)}.pc-side{position:static;max-height:none}.pc-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.pc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.pc-route canvas{height:300px}}
[hidden]{display:none!important}
</style></head>
<body>
<header class="top"><div class="wrap">
<a class="wordmark" href="/" id="homeLink" aria-label="Tabi">Tabi</a>
<div class="pc-tools">
<details class="lang" id="langBox"><summary><span class="sr" id="langLbl"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span id="langCur"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><ul id="langList"></ul></details>
<button class="pc-theme" id="themeBtn" type="button"></button>
</div>
</div></header>

<main class="pc">
<div class="pc-grid idle" id="grid">
  <aside class="pc-card pc-side" id="left" aria-live="polite">
    <h2><span id="hCountries"></span><span class="pc-count" id="nCountries"></span></h2>
    <div class="pc-list" id="countries"></div>
  </aside>

  <section class="pc-card pc-main">
    <h1 id="title"></h1>
    <p class="pc-lead" id="lead"></p>
    <!-- Вход -->
    <div id="vIn" hidden style="display:grid;gap:10px">
      <button class="pc-btn" id="bGoogle"></button>
      <p class="pc-s" id="orMail"></p>
      <input class="pc-in" id="mail" type="email" autocomplete="email">
      <button class="pc-btn b2" id="bCode"></button>
      <input class="pc-in" id="code" inputmode="numeric" autocomplete="one-time-code" hidden>
      <button class="pc-btn" id="bVerify" hidden></button>
    </div>
    <!-- Выбор файлов -->
    <div id="vPick" hidden style="display:grid;gap:10px">
      <p class="pc-s" id="who"></p>
      <button class="pc-btn" id="bFolder"></button>
      <button class="pc-btn b2" id="bFiles"></button>
      <div class="pc-drop" id="drop"></div>
      <p class="pc-s" id="whole"></p>
      <input type="file" id="fFolder" webkitdirectory multiple hidden>
      <input type="file" id="fFiles" multiple accept="image/*,video/*,.heic,.heif,.mov,.mp4,.dng,.cr2,.nef,.arw" hidden>
      <a href="#" class="pc-s" id="out" style="color:var(--sub)"></a>
    </div>
    <!-- Чтение и разбор -->
    <div id="vWork" hidden style="display:grid;gap:12px">
      <div class="pc-when" id="when" aria-live="polite"></div>
      <div id="prog" class="pc-s"></div>
      <div class="pc-bar"><div id="barIn"></div></div>
    </div>
    <div class="pc-stats" id="stats" hidden></div>
    <!-- Итог -->
    <div id="vDone" hidden style="display:grid;gap:12px">
      <div id="done"></div>
      <div id="diagBox" hidden><p class="pc-s" style="font-weight:700;color:var(--ink)" id="dHead"></p><ul class="pc-diag" id="diag"></ul></div>
      <button class="pc-btn" id="bRetry" hidden></button>
      <button class="pc-btn b2" id="bMore"></button>
    </div>
    <div class="pc-e" id="err" hidden></div>
    <p class="pc-s" id="placesNote" hidden></p>
    <p class="pc-s" id="privacyNote"></p>
  </section>

  <aside class="pc-card pc-side" id="right" aria-live="polite">
    <h2><span id="hCities"></span><span class="pc-count" id="nCities"></span></h2>
    <div class="pc-list" id="cities"></div>
  </aside>
</div>

<section class="pc-card pc-route" id="routeBox" hidden>
  <h2 id="hRoute"></h2>
  <canvas id="map" aria-hidden="true"></canvas>
</section>
</main>
<footer class="pc-foot"><a href="/" id="fHome"></a><a href="/privacy.html" id="pol"></a><span id="credits"></span></footer>
<div class="pc-over" id="over" hidden></div>

    "none": {"en": "The chosen files have no shooting location. Phone cameras and cameras with GPS record it; screenshots and forwarded photos usually do not keep it.", "ru": "В выбранных файлах нет места съёмки. Место записывают камера телефона и фотоаппараты с GPS; снимки экрана и пересланные фотографии его обычно не хранят.", "cs": "Vybrané soubory neobsahují místo pořízení. Zaznamenávají ho fotoaparáty telefonů a přístroje s GPS; snímky obrazovky a přeposlané fotky ho obvykle nemají.", "de": "Die gewählten Dateien enthalten keinen Aufnahmeort. Handykameras und Kameras mit GPS speichern ihn; Bildschirmfotos und weitergeleitete Fotos meist nicht.", "fr": "Les fichiers choisis n’ont pas de lieu de prise de vue. Les téléphones et les appareils avec GPS l’enregistrent ; les captures d’écran et les photos transférées ne le gardent généralement pas.", "es": "Los archivos elegidos no tienen lugar de captura. Lo guardan las cámaras de los teléfonos y las cámaras con GPS; las capturas de pantalla y las fotos reenviadas no suelen conservarlo.", "it": "I file scelti non contengono il luogo di scatto. Lo registrano le fotocamere dei telefoni e le fotocamere con GPS; gli screenshot e le foto inoltrate di solito non lo conservano.", "pt": "Os arquivos escolhidos não têm o local da captura. Ele é registrado pelas câmeras dos telefones e pelas câmeras com GPS; capturas de tela e fotos encaminhadas normalmente não o guardam.", "ja": "選んだファイルには撮影場所がありません。撮影場所はスマートフォンやGPS付きカメラが記録します。スクリーンショットや転送された写真には通常残りません。", "ko": "선택한 파일에 촬영 장소가 없습니다. 촬영 장소는 휴대전화 카메라와 GPS가 있는 카메라가 기록하며, 스크린샷과 전달받은 사진에는 보통 남아 있지 않습니다."},
    "more": {"en": "Choose more", "ru": "Выбрать ещё", "cs": "Vybrat další", "de": "Weitere wählen", "fr": "En choisir d’autres", "es": "Elegir más", "it": "Scegli altri", "pt": "Escolher mais", "ja": "さらに選ぶ", "ko": "더 선택"},
    "note": {"en": "Your files never leave the computer: the page reads only the shooting location and time, and only these points go to Tabi.", "ru": "Файлы не покидают компьютер: страница читает в них только место и время съёмки, и в Tabi уходят только эти точки.", "cs": "Soubory neopouštějí počítač: stránka v nich čte jen místo a čas pořízení a do Tabi odchází jen tyto body.", "de": "Ihre Dateien verlassen den Computer nicht: Die Seite liest nur Aufnahmeort und -zeit, und nur diese Punkte gehen an Tabi.", "fr": "Vos fichiers ne quittent pas l’ordinateur : la page n’y lit que le lieu et l’heure de prise de vue, et seuls ces points partent vers Tabi.", "es": "Tus archivos no salen del ordenador: la página solo lee el lugar y la hora de captura, y solo esos puntos van a Tabi.", "it": "I file non lasciano il computer: la pagina legge solo il luogo e l’ora dello scatto, e a Tabi vanno solo questi punti.", "pt": "Os arquivos não saem do computador: a página lê neles apenas o local e a hora da captura, e apenas esses pontos vão para o Tabi.", "ja": "ファイルはパソコンの外に出ません。ページが読むのは撮影場所と時刻だけで、Tabiに送られるのはその地点だけです。", "ko": "파일은 컴퓨터를 벗어나지 않습니다. 페이지는 촬영 장소와 시간만 읽으며, Tabi로는 이 지점만 전송됩니다."},
    "pol": {"en": "Privacy policy", "ru": "Политика конфиденциальности", "cs": "Zásady ochrany soukromí", "de": "Datenschutzerklärung", "fr": "Politique de confidentialité", "es": "Política de privacidad", "it": "Informativa sulla privacy", "pt": "Política de privacidade", "ja": "プライバシーポリシー", "ko": "개인정보처리방침"},
    "eNet": {"en": "No connection to Tabi. Check the internet and try again.", "ru": "Нет связи с Tabi. Проверьте интернет и попробуйте ещё раз.", "cs": "Spojení s Tabi chybí. Zkontrolujte internet a zkuste to znovu.", "de": "Keine Verbindung zu Tabi. Prüfen Sie das Internet und versuchen Sie es erneut.", "fr": "Pas de connexion à Tabi. Vérifiez internet et réessayez.", "es": "No hay conexión con Tabi. Comprueba internet y vuelve a intentarlo.", "it": "Nessuna connessione con Tabi. Controlli la connessione a Internet e riprovi.", "pt": "Sem conexão com o Tabi. Verifique a internet e tente novamente.", "ja": "Tabiに接続できません。インターネットを確認して、もう一度お試しください。", "ko": "Tabi에 연결할 수 없습니다. 인터넷 연결을 확인하고 다시 시도하세요."},
    "eMail": {"en": "There is no account with this email. Use the email you use in the app.", "ru": "Учётной записи с этой почтой нет. Войдите той почтой, которой пользуетесь в приложении.", "cs": "Účet s tímto e-mailem neexistuje. Použijte e-mail, který používáte v aplikaci.", "de": "Es gibt kein Konto mit dieser E-Mail. Verwenden Sie die E-Mail aus der App.", "fr": "Aucun compte avec cet e-mail. Utilisez l’e-mail de l’application.", "es": "No hay ninguna cuenta con este correo. Usa el correo de la aplicación.", "it": "Non esiste un account con questa e-mail. Usi l’e-mail con cui accede all’app.", "pt": "Não há conta com este e-mail. Use o e-mail que você usa no aplicativo.", "ja": "このメールのアカウントはありません。アプリで使っているメールを使ってください。", "ko": "이 이메일로 된 계정이 없습니다. 앱에서 사용하는 이메일로 로그인하세요."},

    "eApp": {"en": "Tabi has not been opened on a phone with this account yet. Sign in to it in the app and come back here.", "ru": "С этой учётной записью Tabi ещё не открывали на телефоне. Войдите в неё в приложении и вернитесь сюда.", "cs": "S tímto účtem ještě nebylo Tabi v telefonu otevřeno. Přihlaste se k němu v aplikaci a vraťte se sem.", "de": "Mit diesem Konto wurde Tabi noch auf keinem Telefon geöffnet. Melden Sie sich in der App an und kommen Sie zurück.", "fr": "Tabi n’a encore été ouvert sur aucun téléphone avec ce compte. Connectez-vous dans l’application et revenez ici.", "es": "Todavía no se ha abierto Tabi en un teléfono con esta cuenta. Inicia sesión en la aplicación y vuelve aquí.", "it": "Con questo account Tabi non è ancora stato aperto su un telefono. Acceda all’account nell’app e torni qui.", "pt": "O Tabi ainda não foi aberto em um telefone com esta conta. Entre nela no aplicativo e volte aqui.", "ja": "このアカウントでまだスマートフォンのTabiを開いていません。アプリでログインしてから戻ってきてください。", "ko": "이 계정으로 아직 휴대전화에서 Tabi를 연 적이 없습니다. 앱에서 이 계정으로 로그인한 후 다시 이곳으로 오세요."},
    "eLimit": {"en": "That is enough points for today. Open Tabi on your phone to check the ones already sent; send the rest tomorrow.", "ru": "На сегодня точек достаточно. Откройте Tabi на телефоне — он проверит уже присланные, а остальное можно отправить завтра.", "cs": "Pro dnešek je bodů dost. Otevřete Tabi v telefonu, aby zkontrolovalo už odeslané; zbytek pošlete zítra.", "de": "Für heute sind es genug Punkte. Öffnen Sie Tabi auf dem Telefon, um die gesendeten zu prüfen; den Rest senden Sie morgen.", "fr": "Assez de points pour aujourd’hui. Ouvrez Tabi sur le téléphone pour vérifier ceux déjà envoyés ; envoyez le reste demain.", "es": "Por hoy son suficientes puntos. Abre Tabi en el teléfono para comprobar los ya enviados; envía el resto mañana.", "it": "Per oggi i punti sono sufficienti. Apra Tabi sul telefono: verificherà quelli già inviati; il resto si potrà inviare domani.", "pt": "Por hoje, os pontos são suficientes. Abra o Tabi no telefone — ele verificará os já enviados, e o restante pode ser enviado amanhã.", "ja": "今日はこれ以上送れません。スマートフォンでTabiを開き、送った地点を確認してください。残りは明日送れます。", "ko": "오늘은 지점이 충분합니다. 휴대전화에서 Tabi를 여세요. 이미 보낸 지점을 확인하며, 나머지는 내일 보낼 수 있습니다."},
    "drop": {"en": "Or drag folders and files here — several at once.", "ru": "Или перетащите сюда папки и файлы — можно несколько сразу.", "cs": "Nebo sem přetáhněte složky a soubory — i několik najednou.", "de": "Oder ziehen Sie Ordner und Dateien hierher – auch mehrere auf einmal.", "fr": "Ou faites glisser ici des dossiers et des fichiers, même plusieurs à la fois.", "es": "O arrastra aquí carpetas y archivos, también varios a la vez.", "it": "Oppure trascini qui cartelle e file, anche più di uno alla volta.", "pt": "Ou arraste pastas e arquivos para cá — vários de uma vez.", "ja": "またはフォルダやファイルをここにドラッグしてください。複数まとめてでもかまいません。", "ko": "또는 폴더와 파일을 여기로 끌어다 놓으세요. 여러 개를 한 번에 놓을 수도 있습니다."},
    "dropHere": {"en": "Drop to add", "ru": "Отпустите, чтобы добавить", "cs": "Pusťte a soubory se přidají", "de": "Loslassen zum Hinzufügen", "fr": "Relâchez pour ajouter", "es": "Suelta para añadir", "it": "Rilasci per aggiungere", "pt": "Solte para adicionar", "ja": "ドロップして追加", "ko": "놓아서 추가"},
    "whole": {"en": "A browser cannot open the whole computer at once — this protects your files. Add the folders with photos one by one: the results add up.", "ru": "Браузер не открывает весь компьютер сразу — так он защищает ваши файлы. Добавляйте папки с фотографиями по очереди: найденное складывается.", "cs": "Prohlížeč neotevře celý počítač najednou — chrání tak vaše soubory. Přidávejte složky s fotkami postupně: nálezy se sčítají.", "de": "Ein Browser kann nicht den ganzen Computer auf einmal öffnen – so schützt er Ihre Dateien. Fügen Sie die Fotoordner nacheinander hinzu: Die Funde werden addiert.", "fr": "Un navigateur ne peut pas ouvrir tout l’ordinateur d’un coup : c’est ainsi qu’il protège vos fichiers. Ajoutez les dossiers de photos l’un après l’autre : les résultats s’additionnent.", "es": "Un navegador no puede abrir todo el ordenador a la vez: así protege tus archivos. Añade las carpetas de fotos una tras otra: los resultados se suman.", "it": "Un browser non può aprire tutto il computer in una volta: così protegge i Suoi file. Aggiunga le cartelle di foto una dopo l’altra: i risultati si sommano.", "pt": "Um navegador não consegue abrir o computador inteiro de uma vez — é assim que ele protege seus arquivos. Adicione as pastas de fotos uma após a outra: os resultados se somam.", "ja": "ブラウザーはファイルを守るため、パソコン全体を一度に開くことができません。写真のフォルダを順に追加してください。見つかったものは合算されます。", "ko": "브라우저는 파일을 보호하기 위해 컴퓨터 전체를 한 번에 열 수 없습니다. 사진 폴더를 하나씩 추가하세요. 찾은 결과는 합산됩니다."},

      r.p.forEach(function (q, i) { var xy = P(q[1], q[0]); if (i && Math.abs(xy[0] - lx) < 0.7 && Math.abs(xy[1] - ly) < 0.7) return; i ? g.lineTo(xy[0], xy[1]) : g.moveTo(xy[0], xy[1]); lx = xy[0]; ly = xy[1]; });
      g.closePath();
      g.fillStyle = landC;
      g.fill();
      if (visited[r.cc]) { g.globalAlpha = 0.28; g.fillStyle = accC; g.fill(); g.globalAlpha = 1; }
      g.strokeStyle = lineC; g.lineWidth = 0.6; g.stroke();
    });
  }
  function drawMap(upto) {
    var dpr = window.devicePixelRatio || 1, W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (!W || !H) return;
    if (cv.width !== W || cv.height !== H || mapDirty || !land) { cv.width = W; cv.height = H; view0 = fitView(A.pts); drawLand(W, H); mapDirty = false; drawnTo = 0; }
    var P = proj(view0, W, H), pts = A.pts, acc = css("--accent");
    if (drawnTo > upto || drawnTo === 0) { cx.drawImage(land, 0, 0); drawnTo = 0; }
    cx.lineCap = "round"; cx.lineJoin = "round";
    for (var i = Math.max(1, drawnTo); i < upto && i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], pa = P(a[0], a[1]), pb = P(b[0], b[1]);
      if (b[2] - a[2] > 36 * 3600000) continue;
      var far = dist(a[0], a[1], b[0], b[1]) > 300000;
      cx.setLineDash(far ? [5 * dpr, 6 * dpr] : []);
      cx.strokeStyle = acc; cx.globalAlpha = far ? 0.45 : 0.75; cx.lineWidth = 2 * dpr;
      cx.beginPath(); cx.moveTo(pa[0], pa[1]); cx.lineTo(pb[0], pb[1]); cx.stroke();
    }
    cx.setLineDash([]); cx.globalAlpha = 1; cx.fillStyle = acc;
    for (var j = drawnTo; j < upto && j < pts.length; j++) { var pp = P(pts[j][0], pts[j][1]); cx.beginPath(); cx.arc(pp[0], pp[1], 2.6 * dpr, 0, 6.2832); cx.fill(); }
    drawnTo = Math.max(drawnTo, Math.min(upto, pts.length));
  }
  window.addEventListener("resize", function () { mapDirty = true; A.shown && drawMap(A.shown); });

  // ===== Разбор папки =====
  function run(list) {
    var files = list.filter(function (f) { var x = extOf(f); return EXT[x] || OTHER[x]; });
    if (!files.length) { view("vDone"); doneText = function () { return t("none"); }; $("done").textContent = doneText(); renderDiag(); return; }
    err(null);
    view("vWork");
    $("barIn").style.width = "0%";
    $("when").textContent = "";
    var pts = [], done = 0, now = Date.now(), next = 0;
    var show = function () { $("prog").textContent = t("reading", { a: num(done), b: num(files.length), n: num(pts.length) }); $("barIn").style.width = Math.round((done / files.length) * 100) + "%"; };
    show();
    var worker = function () {
      if (next >= files.length) return Promise.resolve();
      var f = files[next++], x = extOf(f);
      A.files++;
      if (!EXT[x]) { A.other[x] = (A.other[x] || 0) + 1; done++; return worker(); }
      return EXT[x](f).catch(function () { return null; }).then(function (r) {
        done++;
        var place = r && isFinite(r.lat) && isFinite(r.lng) && !(Math.abs(r.lat) < 1e-6 && Math.abs(r.lng) < 1e-6) && Math.abs(r.lat) <= 90 && Math.abs(r.lng) <= 180;
        var at = r ? taken(r) : 0;
        if (place) {
          A.place++;
          if (at >= 631152000000 && at <= now + 86400000 && !(r.alt > 9000) && !(r.speed > 92)) pts.push([Math.round(r.lat * 1e5) / 1e5, Math.round(r.lng * 1e5) / 1e5, Math.min(at, now)]);
        } else if (at > 0) A.time++;
        else A.none++;
        done % 25 === 0 && show();

      });
    };
    Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]).then(function () {
      show();
      // Серия кадров одного места — одна точка: ближе 150 м и 20 минут от предыдущей.
      pts.sort(function (x, y) { return x[2] - y[2]; });
      var keep = [];
      pts.forEach(function (p) { var q2 = keep[keep.length - 1]; if (q2 && p[2] - q2[2] <= 1200000 && dist(q2[0], q2[1], p[0], p[1]) < 150) return; keep.push(p); });
      keep = keep.filter(function (p) { var k = p.join(","); if (seenPt.has(k)) return false; seenPt.add(k); return true; });
      renderDiag();
      if (!keep.length) { view("vDone"); doneText = function () { return A.pts.length ? t("done", { n: num(A.sent) }) : t("none"); }; $("done").textContent = doneText(); return; }
      sendQ = sendQ.concat(keep);
      send();
      $("prog").textContent = t("loadingMap");
      geo().then(function () { return reveal(keep); }).catch(function () { return reveal(keep); });
    });
  }

  // Показ находок по ходу времени — не меньше десяти секунд (17.11.2026, Андрей: сто гигабайт за две секунды выглядят
  // нереально, и ничего не успеваешь увидеть). Страны и регионы — слева, города — справа, маршрут — внизу.
  function reveal(keep) {
    var all = A.pts.concat(keep).sort(function (x, y) { return x[2] - y[2]; });
    var startShown = 0;
    A.pts = all;
    mapDirty = true;
    revealing = true;
    shell(); renderStats();
    $("prog").textContent = t("tracing");
    var ev = [], ccs = {}, i;
    if (G) {
      for (i = 0; i < keep.length; i++) { var cc = countryAt(keep[i][0], keep[i][1]); keep[i].cc = cc; cc && (ccs[cc] = 1); }
    }
    return Promise.all(Object.keys(ccs).map(function (cc) { return regions(cc).then(function (list) { return [cc, list]; }); })).then(function (pairs) {
      var regBy = {};
      pairs.forEach(function (p) { regBy[p[0]] = p[1]; });
      var byKeep = new Set(keep);
      for (i = 0; i < all.length; i++) {
        var p = all[i];
        if (!byKeep.has(p) || !G) { ev.push({ i: i }); continue; }
        var e = { i: i, p: p };
        if (p.cc) {
          var rg = regionAt(regBy[p.cc] || [], p[0], p[1]);
          rg && (e.rg = rg);
        }
        var ct = cityAt(p[0], p[1]);
        ct >= 0 && (e.ct = ct);
        ev.push(e);
      }
      var newC = Object.keys(ccs).filter(function (cc) { return !found.byCc[cc]; }).length,
        D = Math.min(28000, Math.max(10000, 8000 + newC * 900)),
        t0 = performance.now(), k = 0;
      $("routeBox").hidden = false;
      return new Promise(function (ok) {
        var frame = function (now) {
          var f = Math.min(1, (now - t0) / D), upto = Math.round(f * ev.length);
          for (; k < upto; k++) {
            var e = ev[k];
            if (!e.p) continue;
            var p = e.p, day = new Date(p[2]).toDateString();
            found.days.add(day);
            var prev = k > 0 ? all[e.i - 1] : null;
            prev && p[2] - prev[2] <= 36 * 3600000 && (found.km += dist(prev[0], prev[1], p[0], p[1]));
            if (p.cc && !found.byCc[p.cc]) { var c = { cc: p.cc, at: p[2], regs: [], rset: {} }; found.byCc[p.cc] = c; found.countries.push(c); addCountry(c); mapDirty = true; }
            if (e.rg && p.cc) { var cobj = found.byCc[p.cc]; if (!cobj.rset[e.rg.id]) { cobj.rset[e.rg.id] = 1; cobj.regs.push(e.rg); found.regions++; addRegion(cobj, e.rg); } }
            if (e.ct != null && !found.byCity[e.ct]) { var city = { i: e.ct, name: townName(e.ct), at: p[2] }; found.byCity[e.ct] = city; found.cities.push(city); addCity(city); }
          }
          var cur = ev[Math.min(ev.length - 1, Math.max(0, upto - 1))];
          cur && ($("when").textContent = monthYear(all[cur.i][2]));
          $("barIn").style.width = Math.round(f * 100) + "%";
          A.shown = Math.max(startShown, upto);
          renderStats();
          drawMap(A.shown);
          f < 1 ? requestAnimationFrame(frame) : ok();
        };
        requestAnimationFrame(frame);
      });
    }).then(function () {
      revealing = false;
      A.shown = all.length;
      drawMap(A.shown);
      finish();
    });
  }

  // ===== Отправка точек (pc_media_put), порциями по 5000 =====
  function send() {
    if (sending || !sendQ.length) return;
    sending = true; sendErr = null;
    var part = sendQ.slice(0, 5000);
    fresh().then(function (s) {
      if (!s) return { auth: true };
      return fetch(SB + "/rest/v1/rpc/pc_media_put", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + s.at, "Content-Type": "application/json" }, body: JSON.stringify({ p_points: part }) })
        .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; }); });
    }).then(function (res) {
      sending = false;

      else if (!j || !j.ok) sendErr = [why === "no app" ? "eApp" : why === "day limit" || why === "pending limit" ? "eLimit" : why === "not signed in" ? "eAuth" : "eSrv", { c: why || "?" }];

  function finish() {

    $("done").textContent = doneText();
    renderDiag(); renderStats(); shell();
    $("bRetry").hidden = !sendErr || sendErr[0] === "eAuth";

    sendErr && sendErr[0] === "eAuth" && (save(null), view("vIn"));
  }
  $("bRetry").onclick = function () { $("bRetry").hidden = true; err(null); send(); finish(); };

  applyTexts();
})();
