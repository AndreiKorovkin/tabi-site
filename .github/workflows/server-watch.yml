# Сторож сервера Tabi снаружи (07.11.2026, план выхода, раздел 2, пункт 9). Раз в полчаса спрашивает сервер
# (вызов mail_open — отвечают и вход, и база). Три неудачи подряд с минутой между ними — запуск завершается
# ошибкой, и GitHub пишет об этом письмом владельцу репозитория. Ключ — открытый ключ приложения (он и так
# внутри APK); номер выпуска 9999 — сервер не пускает запросы без номера выпуска.
name: server-watch
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Server answers
        env:
          URL: https://ogrdnhwfgasbgcespsou.supabase.co
          KEY: sb_publishable_lrMZwDEvMLZLgofMLje33Q_E8KB0Tq5
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r -w '%{http_code}' -m 20 -X POST "$URL/rest/v1/rpc/mail_open" \
              -H "apikey: $KEY" -H "x-tabi-apk: 9999" -H "Content-Type: application/json" -d '{}') || code=000
            if [ "$code" = 200 ]; then echo "ok: $(cat /tmp/r)"; exit 0; fi
            echo "try $i: HTTP $code $(head -c 300 /tmp/r 2>/dev/null)"
            [ "$i" = 3 ] || sleep 60
          done
          echo "::error::Tabi server did not answer three times in a row"
          exit 1
